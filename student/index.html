(function(){
  var W=window;W.__qsStage='script';W.__qsErr='';var T0=Date.now();
  var WHY={script:'ไฟล์หน้าเว็บโหลดไม่ครบ หรือสคริปต์ยังไม่เริ่มทำงาน',liff:'เชื่อมต่อ LINE (LIFF) ไม่สำเร็จหรือช้ามาก',login:'กำลังพาไปล็อกอิน LINE ไม่สำเร็จ',api:'รอหลังบ้าน (Google Apps Script) ตอบ ใช้เวลานานผิดปกติ อาจเป็นเน็ตช้า หรือหลังบ้านกำลังเริ่มทำงาน',render:'วาดหน้าจอไม่สำเร็จ'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function splash(){var b=document.getElementById('boot');return !!(b&&!b.hidden&&b.querySelector('.spin'))}
  W.qsFail=function(stage,err,wait){
    var st=stage||W.__qsStage,em=err&&err.message?err.message:(err?String(err):W.__qsErr);if(em)W.__qsErr=em;
    var host=document.getElementById('boot');if(!host)return;host.hidden=false;
    host.innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><div style="font-size:2rem">⚠️</div><h2>'+(wait?'Q-Student เปิดช้ากว่าปกติ':'Q-Student เปิดไม่สำเร็จ')+'</h2><p class="sub">'+esc(WHY[st]||WHY.script)+'</p><p class="sub">ขั้นที่ค้าง: '+esc(st)+' · ผ่านมา '+Math.round((Date.now()-T0)/1000)+' วินาที'+(em?'<br>'+esc(em).slice(0,160):'')+'</p><button class="bn pri wide" onclick="location.reload()">ลองใหม่</button></div>';
  };
  W.addEventListener('error',function(e){W.__qsErr=(e&&e.message)||'error';if(splash())W.qsFail(W.__qsStage,e&&e.error?e.error:{message:e.message},false)});
  W.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;W.__qsErr=(r&&r.message)||String(r||'rejection');if(splash())W.qsFail(W.__qsStage,r,false)});
  setTimeout(function(){if(splash())W.qsFail(W.__qsStage,null,true)},15000);
})();

/* ---------- หลังบ้าน ---------- */
const nonce=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function netErr(msg,code){const e=new Error(msg);e.code=code;e.net=true;return e}
async function api(action,data,extra){
  if(!CONFIG.API_URL||/ใส่|PLACEHOLDER/.test(CONFIG.API_URL)){const e=new Error('ยังไม่ได้ตั้งค่า API_URL (รอ ผอ. Deploy หลังบ้าน Q-Student แล้วใส่ URL ที่ค่าตั้งของไฟล์)');e.code='NO_API';throw e}

}

/* ---------- คิวบันทึกเบื้องหลัง (แตะแล้วขึ้นทันที · เก็บร่างในเครื่องเมื่อสัญญาณหลุด · ส่งซ้ำไม่ซ้ำรายการด้วย nonce) ---------- */
const Q={items:[]};let flushing=false,flushT=null;

function qLoad(){try{const v=JSON.parse(localStorage.getItem(qKey())||'[]');Q.items=Array.isArray(v)?v.filter(i=>i&&i.key&&i.id&&(i.t==='att'||i.t==='read')).map(i=>Object.assign(i,{state:'pending'})):[]}catch(e){Q.items=[]}}
function qPush(it){
  Q.items=Q.items.filter(x=>!(x.t===it.t&&x.key===it.key&&x.id===it.id&&(x.state==='queued'||x.state==='pending'||x.state==='failed')));
  Q.items.push(Object.assign({ts:Date.now(),at:clockNow(),state:'queued',batch:''},it));qSave();scheduleFlush(600);
}
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(()=>flush(false),ms)}
async function flush(byUser){
  if(flushing)return;flushing=true;
  try{
    for(const t of ['att','read']){
      const keys=[];Q.items.forEach(i=>{if(i.t===t&&i.state!=='saving'&&keys.indexOf(i.key)<0)keys.push(i.key)});
      for(const key of keys){
        const batches={};
        Q.items.filter(i=>i.t===t&&i.key===key&&i.state!=='saving').forEach(i=>{if(!i.batch)i.batch='';(batches[i.batch]=batches[i.batch]||[]).push(i)});
        for(const bid of Object.keys(batches)){
          const its=batches[bid],nc=bid||nonce();its.forEach(i=>{i.batch=nc;i.state='saving'});qSave();render();
          const payload=its.map(i=>t==='att'?{id:i.id,st:i.st,reason:i.reason||'',text:i.text||'',ts:i.ts}:(i.kind==='thai'?{id:i.id,words:i.words,level:i.level,ts:i.ts}:{id:i.id,book:i.book,page:i.page,res:i.res,level:i.level,ts:i.ts}));
          try{
            const j=await api(t==='att'?'att.set':'read.save',{key:key,items:payload},{nonce:nc});
            const bad=[];
            if(!j.dup)(j.results||[]).forEach(r=>{if(!r.ok&&r.code!=='STALE')bad.push(r)});
            Q.items=Q.items.filter(i=>its.indexOf(i)<0);
            if(j.scope)mergeScope(j.scope);
            bad.forEach(r=>toast(r.code==='ABSENT'?'บันทึกผลอ่านไม่ได้ เพราะนักเรียนถูกทำเครื่องหมาย "'+r.status+'"':'บันทึกบางรายการไม่ได้ ('+(r.code||'')+')'));
          }catch(e){
            if(e.net||e.code==='BUSY'){its.forEach(i=>{i.state=byUser?'failed':'pending'})}
            else{Q.items=Q.items.filter(i=>its.indexOf(i)<0);toast(e.message);refreshQuiet()}
          }
          qSave();render();
        }
      }
    }
  }finally{flushing=false}
}
setInterval(()=>{if(Q.items.some(i=>i.state==='pending'||i.state==='failed')&&!flushing&&navigator.onLine!==false)flush(false)},12000);
window.addEventListener('online',()=>{if(Q.items.length)flush(false)});
window.addEventListener('beforeunload',e=>{if(Q.items.length){e.preventDefault();e.returnValue=''}});
async function waitFlush(){for(let i=0;i<80&&(flushing||Q.items.some(x=>x.state==='queued'));i++){if(!flushing)await flush(true);else await new Promise(r=>setTimeout(r,150))}}
/* ---------- ข้อมูลที่แสดง = ข้อมูลหลังบ้าน + รายการที่ยังรอส่ง (ซ้อนทับ) ---------- */
function mergeScope(sc){if(!B)return;const i=B.scopes.findIndex(x=>x.key===sc.key);if(i>=0)B.scopes[i]=sc;else B.scopes.push(sc)}
function view(sc){
  const items=Q.items.filter(i=>i.key===sc.key);const c=JSON.parse(JSON.stringify(sc));
  c.students.forEach(s=>{
    let sync='';const rank={failed:3,pending:2,saving:1,queued:1};
    items.filter(i=>i.id===s.id).sort((a,b)=>a.ts-b.ts).forEach(i=>{
      if(!sync||rank[i.state]>rank[sync])sync=i.state;
      if(i.t==='att'){s.att={st:i.st,reason:ABS(i.st)?(i.reason||''):'',text:i.text||'',src:RO()?'director':(ME&&ME.isAdmin?'director':'teacher'),at:i.at,by:ME.staff_id};if(s.read&&ABS(i.st))s.read.flag=true}
      else{s.read=i.kind==='thai'?{words:i.words,pass:i.words>=cfg().pass,level:i.level,flag:false,at:i.at}:{book:i.book,page:i.page,res:i.res,level:i.level,flag:false,seed:false,at:i.at};if(!s.att.st)s.att={st:'มา',reason:'',text:'',src:'auto_reading',at:i.at,by:ME.staff_id}}
    });
    s.sync=sync;s.follow=!!(s.att.st&&isFollow(s.att));
  });
  const k={'มา':0,'ขาด':0,'ลา':0,'กิจกรรม':0,'':0,follow:0};c.students.forEach(s=>{k[s.att.st||'']++;if(s.follow)k.follow++});c.counts=k;
  return c;
}
const scopesV=()=>(B?B.scopes:[]).map(view);

function review(){

  if(!rows.length)b+='<div class="card"><h2>ไม่มีแถวที่ต้องตรวจ</h2></div>';
  b+=rows.map(r=>'<div class="stu"><div class="nm"><b>'+esc(r.name||'ยังไม่จับคู่')+'</b><span class="chip '+(r.done?'c-ok':'c-warn')+'">'+(r.done?(r.decision==='ไม่พบ'?'ไม่พบในทะเบียน':'ตรวจแล้ว'):esc(r.kind))+'</span></div><div class="hint">'+(r.raw?'ชื่อจากไฟล์: '+esc(r.raw)+' · ':'')+'กลุ่ม '+esc(r.group_id)+'</div>'+(r.done?'<div class="hint">ตรวจโดย '+esc(r.by)+' เวลา '+esc(r.at)+' น.</div>':'')

  b+='<div class="card"><div class="rowf between"><h3>ตรวจรายชื่อ</h3><span class="chip '+(o.review.pending?'c-warn':'c-ok')+'">เหลือ '+o.review.pending+' / '+o.review.total+'</span></div></div>';

  b+='<div class="card"><h3>ค่าตั้ง (ผอ. แก้ได้)</h3><div class="grid2"><div class="fld"><label for="c1">จำนวนเล่มอิกเราะห์</label><input id="c1" type="number" min="1" max="12" value="'+o.cfg.books+'"></div><div class="fld"><label for="c2">ผ่านอ่านไทย (คำจาก 10)</label><input id="c2" type="number" min="1" max="10" value="'+o.cfg.pass+'"></div><div class="fld"><label for="c3">เวลาเตือนในแอป</label><input id="c3" type="time" value="'+esc(o.cfg.remind)+'"></div><div class="fld"><label for="c4">เวลาที่ต้องรู้ข้อมูล</label><input id="c4" type="time" value="'+esc(o.cfg.cutoff)+'"></div></div><button class="bn pri wide" style="margin-top:10px" data-act="cfgsave">บันทึกค่าตั้ง</button><p class="hint">ส่งหลังเวลาที่ตั้ง ยังบันทึกได้ แต่ติดป้าย "ส่งหลังเวลา" ให้ ผอ. เห็น · เตือนในแอปอย่างเดียว ไม่ส่ง LINE</p></div>';
  b+='<div class="card"><div class="rowf between"><h3>ประวัติการแก้ไข</h3><button class="bn" data-act="audit">'+(S.audit?'โหลดใหม่':'ดูประวัติ')+'</button></div>'+(S.audit?(S.audit.length?'<ul style="margin:6px 0 0;padding-left:18px">'+S.audit.slice(0,10).map(a=>'<li class="sub">'+esc(String(a.at).slice(11,16))+' น. · '+esc(a.by)+' · '+esc(a.action)+(a.key?' · '+esc(a.key):'')+'</li>').join('')+'</ul>':'<p class="sub">ยังไม่มีการแก้ไข</p>'):'')+'</div></div>';
  return h+b;
}
/* ---------- หน้า: ย้าย/แก้นักเรียน (ผอ.) ---------- */
function studentListHtml(){
  const l=(S.adm&&S.adm.students)||[];if(!S.adm)return '<div class="card"><div class="spin"></div></div>';if(!l.length)return '<div class="card"><p class="sub">ไม่พบนักเรียน</p></div>';
  const rm={};(S.adm.rooms||[]).forEach(r=>{rm[r.room_id]=r.grade});
  return l.map(s=>'<div class="stu"><div class="nm"><b>'+esc(s.name)+'</b><span class="chip '+(s.status==='กำลังเรียน'?'':'c-warn')+'">'+esc(s.status)+'</span></div><div class="hint">รหัส '+esc(s.code)+' · ห้อง '+esc(rm[s.room_id]||'-')+' · '+(s.gid?'กลุ่ม '+esc(s.gid):'ไม่อยู่กลุ่มอิกเราะห์')+'</div><div class="rowf"><button class="bn" data-act="stuedit" data-id="'+esc(s.id)+'">ย้าย / แก้</button></div></div>').join('')+(l.length>=80?'<p class="hint">แสดง 80 คนแรก · ค้นหาเพื่อจำกัด</p>':'');
}
function students(){
  let h=header('ย้าย / แก้นักเรียน','เฉพาะ ผอ. · ทุกการแก้เก็บประวัติ')+'<div class="wrap">';
  h+='<div class="card"><div class="grid2"><div class="fld"><label for="sq">ค้นหาชื่อ/รหัส</label><input id="sq" value="'+esc(S.q)+'" placeholder="พิมพ์ชื่อหรือรหัส"></div><div class="fld"><label for="sf">ห้อง</label><select id="sf" data-act="sfilter"><option value="">ทุกห้อง</option>'+((S.adm&&S.adm.rooms)||[]).map(r=>'<option value="'+esc(r.room_id)+'" '+(S.rf===r.room_id?'selected':'')+'>'+esc(r.grade)+'</option>').join('')+'</select></div></div></div><div id="slist">'+studentListHtml()+'</div>';
  const tr=S.trash||[];h+='<div class="card"><div class="rowf between"><h3>ถังขยะ (กู้คืนได้)</h3><span class="chip">'+tr.length+'</span></div>'+(tr.length?tr.map(t=>'<div class="line" style="margin-top:6px"><span>'+esc(t.name||t.tab+' '+t.key)+'</span><span class="hint">ลบโดย '+esc(t.by)+' '+esc(String(t.at).slice(11,16))+' น.</span><button class="bn" data-act="strest" data-id="'+esc(t.id)+'">กู้คืน</button></div>').join(''):'<p class="sub">ถังขยะว่าง</p>')+'</div></div>';
  return h;
}
/* ---------- วาดหน้า ---------- */
function render(){
  if(!B)return;
  let html;
  if(S.scope)html=openScope();else if(S.tab==='review')html=review();else if(S.tab==='overview'&&isDir())html=overview();else if(S.tab==='students'&&isDir())html=students();else html=today();
  const keepSq=document.activeElement&&document.activeElement.id==='sq';const sqv=keepSq?document.activeElement.value:'';
  $('#app').innerHTML='<div id="offbar" class="offbar" role="status" '+(S.offline?'':'hidden')+'>สัญญาณหลุด · เก็บร่างไว้ในเครื่อง จะส่งให้เองเมื่อสัญญาณกลับมา</div>'+html+'<div class="ver">Q-Student '+esc(B.version)+' · '+esc(CONFIG.WEB_VERSION)+'</div>'+(S.scope?'':'<div class="bar"><div class="in">'+nav()+'</div></div>')+sheet();
  if(keepSq){const e=$('#sq');if(e){e.focus();e.setSelectionRange(sqv.length,sqv.length)}}
}
/* ---------- โหลดข้อมูล ---------- */
async function loadBoot(){const j=await api('boot',{},vaX());B=j;ME=j.me;SRV={hm:j.today.hm,t:Date.now()};return j}
async function refreshQuiet(){try{await loadBoot();qLoadKeep();render()}catch(e){}}
function qLoadKeep(){}
async function loadReview(){try{const j=await api('review.list',{},vaX());S.rev=j.review;render()}catch(e){toast(e.message)}}
async function loadOverview(){try{const j=await api('admin.overview',{});S.ov=j.overview;render()}catch(e){toast(e.message)}}
async function loadStudents(){try{const j=await api('admin.students',{q:S.q,room_id:S.rf});S.adm=j;const t=await api('admin.trash',{});S.trash=t.trash;render()}catch(e){toast(e.message)}}
let sqT=null;
function goTab(t){S.tab=t;S.scope='';render();window.scrollTo(0,0);if(t==='review')loadReview();if(t==='overview')loadOverview();if(t==='students')loadStudents()}
/* ---------- การกระทำ ---------- */
function setStatus(sc,id,st,reason,text){if(blockRO())return;qPush({t:'att',key:sc.key,id:id,st:st,reason:reason||'',text:text||''});render()}
function guardLeave(go){const n=unsafeN();if(n>0&&!S.sheet){S.sheet={t:'leave',n:n,go:go};render();return false}return true}
function goBack(){S.scope='';render();window.scrollTo(0,0);if(S.tab==='overview'&&isDir())loadOverview();if(S.tab==='review')loadReview()}
async function doSend(){
  if(blockRO())return;const sc=scopeByKey(S.scope);
  if(sc.counts['']>0&&!S.sheet&&clockNow()>=cfg().remind&&!S.sendWarned){S.sendWarned=1;S.sheet={t:'clear'};toast('ยังมีคนที่ยังไม่ยืนยัน · เคลียร์ก่อนส่ง หรือกดส่งอีกครั้งเพื่อส่งทั้งที่ยังไม่ยืนยัน');render();return}
  S.sendWarned=0;
  await waitFlush();
  if(Q.items.some(i=>i.key===S.scope)){Q.items.forEach(i=>{if(i.key===S.scope)i.state='failed'});qSave();render();toast('ส่งไม่สำเร็จ · เก็บร่างไว้ในเครื่อง ส่งซ้ำได้เมื่อสัญญาณกลับมา');return}
  try{
    const j=await api('att.send',{key:S.scope},{nonce:nonce()});mergeScope(j.scope);const sd=j.scope.sent;render();
    toast(sd&&!sd.mine?'บันทึกแล้ว · ผลของห้องถือเป็นของ '+sd.first_name+' ที่ส่งก่อน · เก็บประวัติว่าท่านแก้':'ส่งเช็คชื่อแล้ว เวลา '+clockNow()+' น.'+(sd&&sd.late?' · ติดป้าย "ส่งหลังเวลา" ให้ ผอ. เห็น':' · ทันก่อน '+cfg().cutoff+' น.'));
  }catch(e){toast(e.net?'ส่งไม่สำเร็จ · ลองใหม่เมื่อสัญญาณกลับมา':e.message)}
}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.act==='viewas-sel'&&t.value){const o=S.ov&&S.ov.teachers.find(x=>x.id===t.value);startViewAs(t.value,o?o.name:t.value)}if(t.dataset.act==='sfilter'){S.rf=t.value;loadStudents()}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;clearTimeout(sqT);sqT=setTimeout(async()=>{try{const j=await api('admin.students',{q:S.q,room_id:S.rf});S.adm=j;const l=$('#slist');if(l)l.innerHTML=studentListHtml()}catch(er){toast(er.message)}},350)}});
async function startViewAs(id,name){S.viewAs=id;S.viewAsName=name;S.tab='today';S.scope='';try{await loadBoot();S.rev=null;render()}catch(e){S.viewAs='';toast(e.message)}}
async function endViewAs(){S.viewAs='';S.viewAsName='';S.tab='overview';S.scope='';await loadBoot();S.rev=null;render();loadOverview()}
const val=id=>(($('#'+id)||{}).value||'');
document.addEventListener('click',async e=>{
  const nmb=e.target.closest('.stu .nm b');if(nmb&&isDir()&&S.scope){const id=nmb.closest('.stu').querySelector('[data-id]');if(id){if(!S.adm)await loadStudents();S.sheet={t:'stu',id:id.dataset.id};render();return}}
  const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act,v=d.v;
  if(a==='ovclose'){if(e.target===t){S.sheet=null;RD={};render()}return}
  if(a==='close'){S.sheet=null;RD={};S.sendWarned=0;render();return}
  if(a==='leaveok'){const g=S.sheet&&S.sheet.go;S.sheet=null;if(g)g();return}
  if(a==='back'){if(!guardLeave(goBack))return;goBack();return}
  if(a==='viewas'){if(!guardLeave(endViewAs))return;endViewAs();return}
  if(a==='tab'){goTab(v);return}
  if(a==='open'){S.scope=v;render();window.scrollTo(0,0);return}
  if(a==='bell'){S.sheet={t:'notif'};render();try{if((B.notifs||[]).some(n=>!n.read)){const j=await api('notif.read',{},{nonce:nonce()});B.notifs=j.notifs;render()}}catch(er){}return}
  if(a==='st'){const sc=scopeByKey(S.scope),s=sc.students.find(x=>x.id===d.id),cur=s.att.st;setStatus(sc,d.id,cur===v?'':v,ABS(v)&&cur===v?'':(ABS(v)&&ABS(cur)?s.att.reason:''),'');return}
  if(a==='bulk'){if(blockRO())return;const sc=scopeByKey(S.scope);let n=0;sc.students.forEach(s=>{if(!s.att.st){qPush({t:'att',key:sc.key,id:s.id,st:'มา',reason:'',text:''});n++}});toast(n?'ตั้ง "มา" ให้ '+n+' คนที่ยังไม่ยืนยัน':'ไม่มีคนที่ยังไม่ยืนยัน');render();return}
  if(a==='sheet'){S.sheet={t:v};render();return}
  if(a==='clearto'){if(blockRO())return;const sc=scopeByKey(S.scope);let n=0;sc.students.forEach(s=>{if(!s.att.st){qPush({t:'att',key:sc.key,id:s.id,st:v==='ลา'?'ลา':'ขาด',reason:v==='ไม่ทราบ'?UNKNOWN:'',text:''});n++}});S.sheet=null;toast('เคลียร์ '+n+' คน'+(v==='ไม่ทราบ'?' เป็น ขาด · ยังไม่ทราบสาเหตุ (ขึ้นรายการต้องติดตาม)':' เป็น '+v));render();return}
  if(a==='reason'){if(blockRO())return;S.sheet={t:'reason',id:d.id};render();return}
  if(a==='setreason'){if(blockRO())return;const sc=scopeByKey(S.scope),s=sc.students.find(x=>x.id===d.id);qPush({t:'att',key:sc.key,id:d.id,st:s.att.st,reason:v,text:v==='อื่นๆ'?s.att.text:''});if(v!=='อื่นๆ')S.sheet=null;render();return}
  if(a==='reasontext'){if(blockRO())return;const sc=scopeByKey(S.scope),s=sc.students.find(x=>x.id===d.id),x=val('rtx').trim();qPush({t:'att',key:sc.key,id:d.id,st:s.att.st,reason:x?'อื่นๆ':s.att.reason,text:x});S.sheet=null;render();return}
  if(a==='read'){if(blockRO())return;RD={};S.sheet={t:'read',id:d.id};render();return}
  if(a==='rdw'){RD.words=+v;render();return}if(a==='rdb'){RD.book=+v;render();return}if(a==='rdr'){RD.res=v;render();return}if(a==='rdl'){RD.level=v;render();return}
  if(a==='rdp'){RD.page=Math.max(1,(RD.page==null?(RD.first?0:1):RD.page)+(+v));render();return}
  if(a==='rdsave'){const sc=scopeByKey(S.scope),id=S.sheet.id,s=sc.students.find(x=>x.id===id);
    if(ABS(s.att.st)){toast('บันทึกผลอ่านไม่ได้ เพราะนักเรียนถูกทำเครื่องหมาย "'+s.att.st+'"');return}
    const it=sc.kind==='thai'?{t:'read',key:sc.key,id:id,kind:'thai',words:RD.words,level:RD.level}:{t:'read',key:sc.key,id:id,kind:'iqra',book:RD.book,page:RD.page,res:RD.res,level:RD.level};
    qPush(it);
    toast('บันทึกแล้ว · '+s.name+' · '+(sc.kind==='thai'?'อ่านไทย '+RD.words+'/10 · '+RD.level:'อิกเราะห์ เล่ม '+RD.book+' หน้า '+RD.page+' · '+RD.res+' · '+RD.level)+(!s.att.st?' · ตั้ง "มา" อัตโนมัติ':''));
    const nx=sc.students.slice(sc.students.indexOf(s)+1).find(x=>!x.read&&!ABS(x.att.st));RD={};S.sheet=nx?{t:'read',id:nx.id}:null;if(!nx)toast('ประเมินอ่านครบทุกคนที่มาแล้ว');render();return}
  if(a==='readdel'){if(blockRO())return;try{const j=await api('read.del',{key:S.scope,id:d.id},{nonce:nonce()});mergeScope(j.scope);S.sheet=null;RD={};render();toast('ลบผลอ่านแล้ว · อยู่ในถังขยะ ผอ. กู้คืนได้')}catch(er){toast(er.message)}return}
  if(a==='flagok'){if(blockRO())return;try{const j=await api('read.flagok',{key:S.scope,id:d.id},{nonce:nonce()});mergeScope(j.scope);render()}catch(er){toast(er.message)}return}
  if(a==='send'){doSend();return}
  if(a==='revok'){if(blockRO())return;try{const j=await api('review.decide',{key:d.key,act:'ok'},{nonce:nonce()});S.rev=j.review;B.review.pending=j.review.filter(r=>!r.done).length;toast('ตรวจแล้ว · ถูกต้อง');render()}catch(er){toast(er.message);loadReview()}return}
  if(a==='revedit'){if(blockRO())return;try{const j=await api('review.candidates',{key:d.key},{});S.sheet={t:'rev',key:d.key,cands:j.candidates};render()}catch(er){toast(er.message)}return}
  if(a==='revsave'){const sid=val('r1'),raw=$('#r2')?val('r2'):'',row=S.rev.find(x=>x.key===d.key);if(!sid&&row.kind==='รอจับคู่'){toast('กรุณาเลือกนักเรียน หรือกด "ไม่พบในทะเบียน"');return}
    try{const j=await api('review.decide',{key:d.key,act:'edit',sid:sid,raw:raw},{nonce:nonce()});S.rev=j.review;B.review.pending=j.review.filter(r=>!r.done).length;S.sheet=null;toast('บันทึกแล้ว');render()}catch(er){toast(er.message);S.sheet=null;loadReview()}return}
  if(a==='revnone'){try{const j=await api('review.decide',{key:d.key,act:'none'},{nonce:nonce()});S.rev=j.review;B.review.pending=j.review.filter(r=>!r.done).length;S.sheet=null;toast('บันทึกว่าไม่พบในทะเบียน');render()}catch(er){toast(er.message);S.sheet=null;loadReview()}return}
  if(a==='audit'){try{const j=await api('admin.audit',{});S.audit=j.audit;render()}catch(er){toast(er.message)}return}
  if(a==='cfgsave'){try{const j=await api('admin.cfg.save',{books:+val('c1'),pass:+val('c2'),remind:val('c3'),cutoff:val('c4')},{nonce:nonce()});B.cfg=j.cfg;if(S.ov)S.ov.cfg=j.cfg;toast('บันทึกค่าตั้งแล้ว');render()}catch(er){toast(er.message)}return}
  if(a==='stuedit'){S.sheet={t:'stu',id:d.id};render();return}
  if(a==='stusave'){try{const j=await api('admin.student.update',{id:d.id,prefix:val('f1'),first:val('f2'),last:val('f3'),code:val('f4'),room_id:val('f5'),gid:val('f6'),status:val('f7')},{nonce:nonce()});S.adm.students=j.students;S.sheet=null;toast(j.changed&&j.changed.length?'บันทึกแล้ว · เก็บประวัติแล้ว ('+j.changed.join(' · ')+')':'ไม่มีการเปลี่ยนแปลง');render();refreshQuiet()}catch(er){toast(er.message)}return}
  if(a==='studel'){S.sheet={t:'delc',id:d.id};render();return}
  if(a==='delok'){try{const j=await api('admin.student.delete',{id:d.id},{nonce:nonce()});S.adm.students=j.students;S.trash=j.trash;S.sheet=null;toast('ย้ายไปถังขยะแล้ว · กู้คืนได้');render()}catch(er){toast(er.message)}return}
  if(a==='strest'){try{const j=await api('admin.trash.restore',{id:d.id},{nonce:nonce()});S.trash=j.trash;S.adm.students=j.students;toast('กู้คืนแล้ว');render()}catch(er){toast(er.message)}return}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&B&&!Q.items.length&&!S.sheet&&!S.scope){refreshQuiet()}});
/* ---------- เริ่มต้น ---------- */
async function start(){
  window.__qsStage='liff';
  try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return fatal('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message)}
  window.__qsStage='login';
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  window.__qsStage='api';
  try{const as=new URLSearchParams(location.search).get('as');if(as){S.viewAs=as;S.viewAsName=as}}catch(e){}
  try{await loadBoot()}
  catch(e){
    if(S.viewAs&&(e.code==='FORBIDDEN'||e.code==='NOT_FOUND')){S.viewAs='';try{await loadBoot()}catch(e2){return fail(e2)}}
    else return fail(e);
  }
  if(S.viewAs&&B.viewAs)S.viewAsName=B.viewAs.name;
  window.__qsStage='render';
  qLoad();S.tab=isDir()?'overview':'today';
  $('#boot').hidden=true;$('#app').hidden=false;render();
  if(isDir())loadOverview();
  if(Q.items.length)flush(false);
}
function fatal(h,msg){$('#boot').hidden=false;$('#boot').innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><h2>'+esc(h)+'</h2><p class="sub">'+esc(msg)+'</p><button class="bn pri wide" onclick="location.reload()">ลองใหม่</button></div>'}
function fail(e){
  if(e.code==='NOT_LINKED')return fatal('ยังไม่ได้ผูกบัญชี','ผูกบัญชี LINE กับโรงเรียนที่หน้ากลาง Q-Kawa ก่อน (กรอกรหัส 6 หลักจาก ผอ.) แล้วกลับมาที่นี่');
  if(e.code==='APP_OFF')return fatal('Q-Student ยังไม่เปิดใช้',e.message);
  if(e.code==='FORBIDDEN')return fatal('Q-Student ใช้ได้เฉพาะครูประจำชั้น ครูประจำกลุ่มอิกเราะห์ และ ผอ.',e.message);
  if(e.code==='NO_API')return fatal('ยังไม่ได้ตั้งค่า API_URL',e.message);
  return fatal('โหลดข้อมูลไม่สำเร็จ',e.message);
}
start().catch(e=>fail(e));
})();
