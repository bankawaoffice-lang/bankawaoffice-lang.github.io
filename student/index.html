<body>
<div id="boot"><div class="sk-top">Q-Student</div><div class="center"><div><div class="spin"></div><p style="margin-top:12px">กำลังเปิด Q-Student…</p></div></div><div class="sk-nav" aria-hidden="true"><i></i><i></i><i></i></div></div>
<div id="app" hidden></div>
<script>
'use strict';
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 hub:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 doc:'<svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M10 12h6M10 16h6"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
 task:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9l2 2 3-3.5M8 16h8"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8h7M9 12h5"/></svg>',
 users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 010 5.6M18 14.3c1.9.8 3 2.9 3 5.7"/></svg>'
};
const DAYN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
const REASONS=['ป่วย','ช่วยงานผู้ปกครอง','ไม่มีรถมาโรงเรียน','ติดตามไม่ได้','ยังไม่ทราบสาเหตุ','ฝนตก-น้ำท่วม','อื่นๆ'];
const UNKNOWN='ยังไม่ทราบสาเหตุ',LOST='ติดตามไม่ได้';
const LEVELS=['คล่อง','พอใช้','ต้องฝึก'],LVC={'คล่อง':'c-ok','พอใช้':'c-warn','ต้องฝึก':'c-bad'};
const PREFIXES=['ด.ช.','ด.ญ.','เด็กชาย','เด็กหญิง','นาย','นางสาว'],SSTAT=['กำลังเรียน','ย้ายออก','จบ','ลาออก'];
const ABS=st=>st==='ขาด'||st==='ลา';
const isFollow=a=>ABS(a.st)&&(!a.reason||a.reason===UNKNOWN||a.reason===LOST);
/* ---------- สถานะแอป ---------- */
let B=null,SRV={hm:'',t:0},ME=null;
const S={tab:'',scope:'',sheet:null,viewAs:'',ov:null,rev:null,adm:null,audit:null,trash:null,q:'',rf:'',offline:false,flagLoading:false};
let RD={};let busyN=0;
const cfg=()=>(B&&B.cfg)||{remind:'08:45',cutoff:'09:00',pass:7,books:6,pages:0,rank_min:5};
const isDir=()=>!!(ME&&ME.isAdmin&&!S.viewAs);
const RO=()=>!!S.viewAs;
function clockNow(){if(!SRV.hm)return '00:00';const p=SRV.hm.split(':').map(Number),m=p[0]*60+p[1]+Math.floor((Date.now()-SRV.t)/60000);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
/* ---------- หลังบ้าน ---------- */
const nonce=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function netErr(msg,code){const e=new Error(msg);e.code=code;e.net=true;return e}
const DG={m:{},calls:[],tp:[]};
function dgm(k){try{DG.m[k]=Math.round(performance.now())}catch(e){}}
function dgCall(a,tq,j){try{DG.calls.push({a:a,c:Math.round(performance.now()-tq),s:j&&j.ms,t:j&&j.t});if(DG.calls.length>12)DG.calls.shift()}catch(e){}}
dgm('script');
async function api(action,data,extra){
  if(!CONFIG.API_URL||/ใส่|PLACEHOLDER/.test(CONFIG.API_URL)){const e=new Error('ยังไม่ได้ตั้งค่า API_URL (รอ ผอ. Deploy หลังบ้าน Q-Student แล้วใส่ URL ที่ค่าตั้งของไฟล์)');e.code='NO_API';throw e}
  let r;busyN++;const tq=performance.now();
  try{r=await Promise.race([fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action,lite:1,idToken:liff.getIDToken(),data:data||{}},extra||{}))}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),40000))])}
  catch(e){busyN--;S.offline=true;renderOff();throw netErr(e&&e.message==='TIMEOUT'?'หลังบ้านไม่ตอบภายใน 40 วินาที':'เชื่อมต่อไม่ได้ ตรวจสัญญาณอินเทอร์เน็ต',e&&e.message==='TIMEOUT'?'TIMEOUT':'NETWORK')}
  let j;try{j=JSON.parse(await r.text())}catch(e){busyN--;S.offline=true;renderOff();throw netErr('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy)','BAD_RESPONSE')}
  busyN--;S.offline=false;renderOff();dgCall(action,tq,j);
  if(!j.ok){if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN')relogin();const er=new Error(j.error||j.code);er.code=j.code;throw er}
  return j;
}
function relogin(){let n=0;try{n=Number(sessionStorage.getItem('qs_relogin')||0);sessionStorage.setItem('qs_relogin',String(n+1))}catch(e){}if(n>1)return;if(liff.isInClient())location.reload();else{try{liff.logout()}catch(e){}liff.login({redirectUri:location.href})}}
const vaX=()=>S.viewAs?{viewAs:S.viewAs}:{};
/* ---------- คิวบันทึกเบื้องหลัง (แตะแล้วขึ้นทันที · เก็บร่างในเครื่องเมื่อสัญญาณหลุด · ส่งซ้ำไม่ซ้ำรายการด้วย nonce) ---------- */
const Q={items:[]};let flushing=false,flushT=null;
const qKey=()=>'qs1_q_'+(ME?ME.staff_id:'x')+'_'+(B?B.today.date:'');
function qSave(){try{localStorage.setItem(qKey(),JSON.stringify(Q.items))}catch(e){}}
function qLoad(){try{const v=JSON.parse(localStorage.getItem(qKey())||'[]');Q.items=Array.isArray(v)?v.filter(i=>i&&i.key&&i.id&&(i.t==='att'||(i.t==='read'&&(i.kind==='thai'?!!i.set:(i.book&&i.page))))).map(i=>Object.assign(i,{state:'pending'})):[]}catch(e){Q.items=[]}}
function qPush(it){
  Q.items=Q.items.filter(x=>!(x.t===it.t&&x.key===it.key&&x.id===it.id&&(x.state==='queued'||x.state==='pending'||x.state==='failed')));
  Q.items.push(Object.assign({ts:Date.now(),at:clockNow(),state:'queued',batch:''},it));qSave();scheduleFlush(600);
}
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(()=>flush(false),ms)}
async function flush(byUser){
  if(flushing)return;flushing=true;
  try{
    for(const t of ['att','read']){
      const keys=[];Q.items.forEach(i=>{if(i.t===t&&i.state!=='saving'&&keys.indexOf(i.key)<0)keys.push(i.key)});
      for(const key of keys){
        const batches={};
        Q.items.filter(i=>i.t===t&&i.key===key&&i.state!=='saving').forEach(i=>{if(!i.batch)i.batch='';(batches[i.batch]=batches[i.batch]||[]).push(i)});
        for(const bid of Object.keys(batches)){
          const its=batches[bid],nc=bid||nonce();its.forEach(i=>{i.batch=nc;i.state='saving'});qSave();render();
          const payload=its.map(i=>t==='att'?{id:i.id,st:i.st,reason:i.reason||'',text:i.text||'',ts:i.ts}:(i.kind==='thai'?{id:i.id,set:i.set,level:i.level||'',ts:i.ts}:{id:i.id,book:i.book,page:i.page,level:i.level||'',ts:i.ts}));
          try{
            const j=await api(t==='att'?'att.set':'read.save',{key:key,items:payload},{nonce:nc});
            const bad=[];
            if(!j.dup)(j.results||[]).forEach(r=>{if(!r.ok&&r.code!=='STALE')bad.push(r)});
            Q.items=Q.items.filter(i=>its.indexOf(i)<0);
            if(j.scope)mergeScope(j.scope);
            bad.forEach(r=>toast(r.code==='BAD_SET'?'ชุดคำนี้ถูกลบหรือไม่ใช่ของชั้นนี้ · เลือกชุดคำใหม่':r.code==='ABSENT'?'บันทึกผลอ่านไม่ได้ เพราะนักเรียนถูกทำเครื่องหมาย "'+r.status+'"':'บันทึกบางรายการไม่ได้ ('+(r.code||'')+')'));
          }catch(e){
            if(e.net||e.code==='BUSY'){its.forEach(i=>{i.state=byUser?'failed':'pending'})}
            else{Q.items=Q.items.filter(i=>its.indexOf(i)<0);toast(e.message);refreshQuiet()}
          }
          qSave();render();
        }
      }
    }
  }finally{flushing=false}
}
setInterval(()=>{if(Q.items.some(i=>i.state==='pending'||i.state==='failed')&&!flushing&&navigator.onLine!==false)flush(false)},12000);
window.addEventListener('online',()=>{if(Q.items.length)flush(false)});
window.addEventListener('beforeunload',e=>{if(Q.items.length){e.preventDefault();e.returnValue=''}});
async function waitFlush(){for(let i=0;i<80&&(flushing||Q.items.some(x=>x.state==='queued'));i++){if(!flushing)await flush(true);else await new Promise(r=>setTimeout(r,150))}}
/* ---------- ข้อมูลที่แสดง = ข้อมูลหลังบ้าน + รายการที่ยังรอส่ง (ซ้อนทับ) ---------- */
function mergeScope(sc){if(!B)return;const i=B.scopes.findIndex(x=>x.key===sc.key);if(i>=0)B.scopes[i]=sc;else B.scopes.push(sc)}
function view(sc){
  const items=Q.items.filter(i=>i.key===sc.key);const c=JSON.parse(JSON.stringify(sc));
  c.students.forEach(s=>{
    let sync='';const rank={failed:3,pending:2,saving:1,queued:1};
    items.filter(i=>i.id===s.id).sort((a,b)=>a.ts-b.ts).forEach(i=>{
      if(!sync||rank[i.state]>rank[sync])sync=i.state;
      if(i.t==='att'){s.att={st:i.st,reason:ABS(i.st)?(i.reason||''):'',text:i.text||'',src:RO()?'director':(ME&&ME.isAdmin?'director':'teacher'),at:i.at,by:ME.staff_id};if(s.read&&ABS(i.st))s.read.flag=true}
      else{s.read=i.kind==='thai'?{set:i.set,level:i.level,flag:false,at:i.at}:{book:i.book,page:i.page,level:i.level,flag:false,seed:false,at:i.at};if(!s.att.st)s.att={st:'มา',reason:'',text:'',src:'auto_reading',at:i.at,by:ME.staff_id}}
    });
    s.sync=sync;s.follow=!!(s.att.st&&isFollow(s.att));
  });
  const k={'มา':0,'ขาด':0,'ลา':0,'กิจกรรม':0,'':0,follow:0};c.students.forEach(s=>{k[s.att.st||'']++;if(s.follow)k.follow++});c.counts=k;
  return c;
}
const scopesV=()=>(B?B.scopes:[]).map(view);
const scopeByKey=k=>{const s=B&&B.scopes.find(x=>x.key===k);return s?view(s):null};
const unsafeN=()=>S.scope?Q.items.filter(i=>i.key===S.scope).length:0;
function toast(t){if(!t)return;let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3600)}
function blockRO(){if(RO()){toast('ดูอย่างเดียว · กำลังดูในมุมมองของ '+(S.viewAsName||''));return true}return false}
function nameOf(sc,id){if(!id)return '';if(ME&&id===ME.staff_id)return ME.name;const c=(sc.co||[]).find(x=>x.id===id);if(c)return c.name;if(sc.sent&&sc.sent.first_by===id)return sc.sent.first_name;return id}
/* ---------- แถบหัว/เมนู ---------- */
function header(title,sub,back){
  const n=RO()||!B?0:(B.notifs||[]).filter(x=>!x.read).length;
  return '<div class="hdr"><div class="row">'+(back?'<button class="hbtn" data-act="back" aria-label="ย้อนกลับ">'+IC.back+'</button>':'')+'<div style="flex:1;min-width:0"><h1>'+esc(title)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'
   +(RO()?'':'<button class="hbtn" data-act="bell" aria-label="การแจ้งเตือน '+n+' รายการ">'+IC.bell+(n?'<span class="badge">'+n+'</span>':'')+'</button>')
   +'<a class="hbtn" href="'+esc(CONFIG.HUB_URL)+'" aria-label="กลับ Q-Kawa">'+IC.hub+'<span class="t">Q-Kawa</span></a></div></div>';
}
const roBar=()=>RO()?'<div class="ro" role="status"><span>กำลังดูในมุมมองของ '+esc(S.viewAsName||'')+' (ดูอย่างเดียว)</span><button data-act="viewas" data-v="">กลับมุมมอง ผอ.</button></div>':'';
function renderOff(){const el=$('#offbar');if(el)el.hidden=!S.offline}
function nav(){
  const items=isDir()?[['overview','ภาพรวมเช้า',IC.chart],['reading','การอ่าน',IC.book],['review','ตรวจรายชื่อ',IC.list],['students','นักเรียน',IC.users]]:[['today','งานวันนี้',IC.task],['reading','การอ่าน',IC.book],['review','ตรวจรายชื่อ',IC.list]];
  const pend=(S.rev||[]).filter(r=>!r.done).length||(S.rev?0:(B&&B.review?B.review.pending:0)),cur=S.tab==='words'?'reading':S.tab;
  return '<nav class="nav" style="--n:'+items.length+'" aria-label="เมนูหลัก">'+items.map(i=>'<button data-act="tab" data-v="'+i[0]+'" '+(cur===i[0]&&!S.scope?'aria-current="page"':'')+'>'+i[2]+'<span>'+i[1]+'</span>'+(i[0]==='review'&&pend?'<span class="badge">'+pend+'</span>':'')+'</button>').join('')+'</nav>';
}
const CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function statusChip(sc){
  const s=sc.sent,bad=Q.items.filter(i=>i.key===sc.key&&(i.state==='pending'||i.state==='failed')).length;
  if(s)return '<span class="chip '+(s.late?'c-warn':'c-ok')+'">'+CK+' ส่งแล้ว '+esc(s.first_at)+' น.'+(!s.mine&&!isDir()?' · โดย '+esc(s.first_name):'')+(s.late?' · ส่งหลังเวลา':'')+'</span>';
  if(bad)return '<span class="chip c-warn">ยังไม่ได้ส่ง '+bad+' รายการ</span>';
  if(clockNow()>cfg().cutoff)return '<span class="chip c-bad">เลย '+esc(cfg().cutoff)+' น. ยังไม่ส่ง</span>';
  return '<span class="chip">ยังไม่ส่ง</span>';
}
function followBox(scopes){
  const out=[];scopes.forEach(sc=>sc.students.forEach(s=>{if(s.follow)out.push({s:s,key:sc.key})}));
  if(!out.length)return '';
  return '<div class="card"><div class="rowf between"><h3>ต้องติดตาม</h3><span class="chip c-bad">'+out.length+' คน</span></div><p class="sub">ไม่มาและยังไม่ได้เลือกสาเหตุ / ยังไม่ทราบสาเหตุ / ติดตามไม่ได้ · เลือกสาเหตุเมื่อรู้แล้ว รายการจะหายไป</p>'+out.map(o=>'<button class="bn wide" style="justify-content:space-between;margin-top:6px" data-act="open" data-v="'+esc(o.key)+'"><span>'+esc(o.s.name)+'</span><span class="chip c-bad">'+esc(o.s.att.st)+'</span></button>').join('')+'</div>';
}
/* ---------- หน้า: งานวันนี้ ---------- */
function today(){
  const scopes=scopesV().filter(s=>!s.extra),t=B.today,dow=DAYN[t.dow-1]||'';
  let h=header('งานวันนี้',(t.closed?'':'วัน'+dow+' · ')+(RO()?(S.viewAsName||''):ME.name))+roBar(),b='<div class="wrap">';
  if(t.closed){b+='<div class="card"><h2>วันนี้ปิดเรียน</h2><p class="sub">'+esc(t.holiday||'วันหยุด')+' · ไม่มีงานเช็คชื่อ</p></div>';return h+b+'</div>'}
  const late=clockNow()>=cfg().remind&&scopes.some(s=>!s.sent);
  if(late)b+='<div class="banner '+(clockNow()>cfg().cutoff?'c-bad':'c-warn')+'" role="alert"><b>'+(clockNow()>cfg().cutoff?'เลย '+esc(cfg().cutoff)+' น. แล้ว ยังมีงานเช็คชื่อที่ยังไม่ส่ง':'ใกล้ '+esc(cfg().cutoff)+' น. · เคลียร์คนที่ยังไม่ยืนยัน แล้วกดส่ง')+'</b><span>ต้องรู้ข้อมูลการมาเรียนก่อน '+esc(cfg().cutoff)+' น. (เตือนในแอปเท่านั้น)</span></div>';
  if(!scopes.length)b+='<div class="card"><h2>วัน'+dow+'ไม่มีงานเช็คชื่อของท่าน</h2><p class="sub">'+(t.dow<=2?'จันทร์–อังคาร ครูประจำชั้นเช็คชื่อและฟังอ่านไทย':t.dow<=4?'พุธ–พฤหัส ครูประจำกลุ่มเช็คชื่อและฟังอิกเราะห์ · ครูประจำชั้นเช็คชื่อเด็กที่ไม่อยู่กลุ่ม':'ศุกร์ ครูประจำชั้นเช็คชื่ออย่างเดียว')+'</p></div>';
  scopes.forEach(sc=>{const c=sc.counts,n=sc.students.length,done=n-c[''],rd=sc.kind==='att'?'':'<span class="chip c-pri">ประเมินอ่านแล้ว '+sc.students.filter(s=>s.read).length+'/'+n+'</span>';
    b+='<button class="task" data-act="open" data-v="'+esc(sc.key)+'"><div class="t"><b>'+esc(sc.title)+'</b>'+statusChip(sc)+'</div><div class="prog" aria-hidden="true"><i style="width:'+(n?Math.round(done/n*100):0)+'%"></i></div><div class="line"><span class="chip c-ok">มา '+c['มา']+'</span><span class="chip c-bad">ขาด '+c['ขาด']+'</span><span class="chip c-lv">ลา '+c['ลา']+'</span><span class="chip c-act">กิจกรรม '+c['กิจกรรม']+'</span><span class="chip '+(c['']?'c-warn':'')+'">ยังไม่ยืนยัน '+c['']+'</span>'+rd+'</div>'+(((sc.co||[])[0])?'<span class="hint">ครูร่วม: '+esc(sc.co[0].name)+'</span>':'')+'</button>'});
  b+=followBox(scopes);
  const rv=B.review?B.review.pending:0;
  if(rv)b+='<button class="task" data-act="tab" data-v="review"><div class="t"><b>ตรวจรายชื่อ</b><span class="chip c-warn">รอตรวจ '+rv+' แถว</span></div><span class="sub">ชื่อที่ยังต้องยืนยันหรือจับคู่กับทะเบียน</span></button>';
  return h+b+'</div>';
}
/* ---------- หน้า: เช็คชื่อ + บันทึกอ่าน ---------- */
function openScope(){
  const sc=scopeByKey(S.scope);if(!sc){S.scope='';return today()}
  const c=sc.counts,n=sc.students.length,mk=n-c[''],bad=sc.students.filter(s=>s.sync==='pending'||s.sync==='failed'),sv=sc.students.filter(s=>s.sync==='saving'||s.sync==='queued'),fl=sc.students.filter(s=>s.read&&s.read.flag),o=(sc.co||[])[0],ex=!!sc.extra;
  let h=header(sc.title,'วัน'+(DAYN[B.today.dow-1]||''),true)+roBar(),b='<div class="wrap">';
  if(sc.kind==='iqra')b+=quoteCard();
  if(sc.kind==='thai')b+=dayWords(sc);
  if(!ex&&clockNow()>=cfg().remind&&!sc.sent)b+='<div class="banner '+(clockNow()>cfg().cutoff?'c-bad':'c-warn')+'" role="alert"><b>'+(clockNow()>cfg().cutoff?'เลย '+esc(cfg().cutoff)+' น. แล้ว':'ใกล้ '+esc(cfg().cutoff)+' น.')+' · เคลียร์ "ยังไม่ยืนยัน" แล้วกดส่ง</b></div>';
  if(o&&!ex)b+='<div class="banner c-pri"><b>ห้องนี้มีครูร่วม: '+esc(o.name)+'</b><span>ใครส่งก่อนถือเป็นผลของห้อง อีกคนเห็นว่าส่งแล้วและแก้ได้ ระบบเก็บประวัติว่าใครแก้</span></div>';
  if(S.offline)b+='<div class="banner c-warn" role="status"><b>สัญญาณหลุด</b><span>ที่แตะไว้เก็บเป็นร่างในเครื่อง ส่งซ้ำได้ ไม่เกิดรายการซ้ำ</span></div>';
  if(fl.length)b+='<div class="banner c-warn"><b>มีผลอ่านที่บันทึกไว้ของคนที่ถูกเปลี่ยนเป็น ขาด/ลา '+fl.length+' คน</b><span>ผลอ่านยังอยู่ ไม่ถูกลบ · กรุณาตรวจ</span></div>';
  if(!ex){
    b+='<div class="rowf" style="margin-bottom:10px"><button class="bn'+(sc.fri?' good':'')+'" data-act="bulk">'+(sc.fri?CK.replace('14','18').replace('14','18')+' ทุกคนมา':'ที่เหลือมาทั้งหมด')+'</button>';
    if(c[''])b+='<button class="bn" data-act="sheet" data-v="clear">เคลียร์ที่ยังไม่ยืนยัน ('+c['']+')</button>';
    b+='</div>';
  }
  b+=sc.students.map((s,i)=>studentRow(s,sc,i)).join('');
  const warn=(sv.length?'<div class="hint">กำลังบันทึก '+sv.length+' รายการ…</div>':'')+(bad.length?'<div class="warnrow">ยังไม่ได้ส่ง '+bad.length+' รายการ'+(bad.some(s=>s.sync==='failed')?' · ส่งไม่สำเร็จ ลองใหม่':'')+'</div>':'');
  let bar;
  if(ex){const rd=sc.students.filter(s=>s.read).length;bar='<div class="bar"><div class="in"><div class="rowf between"><span><b class="num">ประเมินอ่านแล้ว '+rd+'/'+n+'</b></span><span class="hint">เช็คชื่อทำที่ "งานวันนี้"</span></div>'+warn+'<button class="bn pri wide" data-act="back">เสร็จแล้ว กลับ</button></div></div>'}
  else{const snt=sc.sent;bar='<div class="bar"><div class="in"><div class="rowf between"><span><b class="num">บันทึกแล้ว '+mk+'/'+n+'</b> · ยังไม่ยืนยัน <b class="num">'+c['']+'</b></span>'+statusChip(sc)+'</div>'+warn
   +'<button class="bn pri wide" data-act="send">'+(snt?(!snt.mine&&!isDir()?'บันทึกการแก้ไข (ห้องส่งโดย '+esc(snt.first_name)+')':'ส่งอีกครั้ง (มีการแก้ไข)'):bad.length?'ส่งซ้ำ':'ส่งเช็คชื่อ')+'</button></div></div>'}
  return h+b+'</div>'+bar;
}
function studentRow(s,sc,i){
  const r=s.att,abs=ABS(r.st),ex=!!sc.extra,rd=s.read,rdk=sc.kind==='thai'||sc.kind==='iqra';
  const bt=[['มา','s-m',IC.check],['ขาด','s-a',IC.x],['ลา','s-l',''],['กิจกรรม','s-g','']];
  const syn=(s.sync==='saving'||s.sync==='queued')?'<div class="hint">● กำลังบันทึก…</div>':s.sync==='pending'?'<div class="hint">● ยังไม่ได้ส่ง (เก็บร่างในเครื่อง)</div>':s.sync==='failed'?'<div class="hint" style="color:var(--bad)">● ส่งไม่สำเร็จ</div>':((r.st&&!ex)||(rd&&ex)?'<div class="hint">✓ บันทึกสำเร็จ '+esc((ex&&rd?rd.at:r.at))+' น.'+(r.by&&ME&&r.by!==ME.staff_id&&!isDir()&&!ex?' · โดย '+esc(nameOf(sc,r.by)):'')+'</div>':'');
  let h='<div class="stu sc"><div class="nm"><span class="who">'+avatar(s.g)+'<span><span class="no">'+(i+1)+'</span> <b>'+esc(s.name)+'</b></span></span>'+(r.st?(s.follow?'<span class="chip c-bad">ต้องติดตาม</span>':''):'<span class="chip c-warn">ยังไม่ยืนยัน</span>')+'</div>';
  if(ex)h+='<div class="line"><span class="chip '+(r.st==='มา'?'c-ok':r.st==='ขาด'?'c-bad':r.st==='ลา'?'c-lv':r.st?'c-act':'c-warn')+'">เช็คชื่อ: '+esc(r.st||'ยังไม่ยืนยัน')+'</span><span class="hint">เช็คชื่อที่ "งานวันนี้"</span></div>';
  else h+='<div class="sts" role="group" aria-label="สถานะ '+esc(s.name)+'">'+bt.map(x=>'<button class="'+x[1]+'" data-act="st" data-id="'+esc(s.id)+'" data-v="'+x[0]+'" aria-pressed="'+(r.st===x[0])+'">'+x[2]+x[0]+'</button>').join('')+'</div>'
   +(r.src==='auto_reading'?'<div class="line"><span class="chip c-pri">อัตโนมัติจากผลอ่าน '+esc(r.at)+' น.</span><span class="hint">แตะสถานะอื่นเพื่อแก้</span></div>':'')
   +(abs?'<div class="line"><button class="bn" data-act="reason" data-id="'+esc(s.id)+'">สาเหตุ: '+esc(r.reason||'เลือกสาเหตุ')+(r.text?' ('+esc(r.text)+')':'')+'</button></div>':'');
  if(rdk&&!abs){
    const lv=(e)=>'<div class="lvs" role="group" aria-label="ความคล่อง '+esc(s.name)+'">'+LEVELS.map(x=>'<button class="lv '+LVK[x]+'" data-act="lv" data-id="'+esc(s.id)+'" data-v="'+x+'" aria-pressed="'+(e.saved&&e.level===x)+'">'+x+'</button>').join('')+'</div>';
    if(sc.kind==='thai'){const e=effThai(s,sc),pre=!e.saved&&!!e.set;
      h+='<div class="rd2"><div class="'+(pre?'pre':'')+'"><select data-act="tset" data-id="'+esc(s.id)+'" aria-label="ชุดคำของ '+esc(s.name)+'"><option value="">เลือกชุดคำ…</option>'+setsOf(sc).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===e.set?'selected':'')+'>'+esc(x.name)+(x.status!=='เผยแพร่'?' (ร่าง)':'')+'</option>').join('')+'</select></div>'+(pre?'<div class="hint">เริ่มจากชุดคำครั้งก่อน/ชุดของวัน · แตะความคล่องเพื่อบันทึก</div>':'')+(setsWait(sc)?'<div class="hint">กำลังโหลดชุดคำ…</div>':!setsOf(sc).length?'<div class="hint">ชั้นนี้ยังไม่มีชุดคำ · ไปที่ "จัดการชุดคำ"</div>':'')+lv(e)+'</div>'}
    else{const e=effIqra(s),pre=!e.saved&&e.book>0,has=!!s.prev&&e.book>0&&e.page>0,man=!has||!!(S.man&&S.man[s.id]),bmax=cfg().books,pmax=cfg().pages>0?cfg().pages:999;
      if(!man){const bs=[e.book,e.book+1,e.book+2].filter(x=>x<=bmax),ps=[e.page,e.page+1,e.page+2].filter(x=>x<=pmax),chp=(a,v,on,lb)=>'<button class="chp" data-act="'+a+'" data-id="'+esc(s.id)+'" data-v="'+v+'" aria-pressed="'+on+'" aria-label="'+lb+' '+v+'">'+v+'</button>';
        h+='<div class="rd2"><div class="qk"><span class="qlb">เล่ม</span>'+bs.map(x=>chp('qb',x,e.saved&&x===e.book,'เล่ม')).join('')+'</div><div class="qk"><span class="qlb">หน้า</span>'+ps.map(x=>chp('qp',x,e.saved&&x===e.page,'หน้า')).join('')+'<button class="chp man" data-act="manual" data-id="'+esc(s.id)+'">เลือกเอง</button></div>'+(pre?'<div class="hint">เริ่มจากเล่ม/หน้าครั้งก่อน · แตะเลขเพื่อบันทึก</div>':'')+lv(e)+'</div>'}
      else

    if(rd&&!(s.sync==='saving'||s.sync==='queued'||s.sync==='pending'||s.sync==='failed')&&!RO())h+='<div class="line"><button class="bn danger" data-act="rdelask" data-id="'+esc(s.id)+'">ลบผลอ่านนี้</button></div>';
  }else if(rdk&&abs){
    h+='<div class="line"><span class="sub">'+(rd?'ผลอ่านที่บันทึกไว้ยังอยู่ ('+(sc.kind==='thai'?'ชุดคำ '+esc((setsOf(sc).find(x=>x.id===rd.set)||{}).name||'-'):'เล่ม '+rd.book+' หน้า '+rd.page)+(rd.level?' · '+esc(rd.level):'')+')':'ไม่บันทึกผลอ่าน (ขาด/ลา)')+'</span></div>';
  }
  if(rd&&rd.flag)h+='<div class="warnrow">มีผลอ่านที่บันทึกไว้ แต่ตอนนี้เป็น "'+esc(r.st)+'" · ตรวจอีกครั้ง <button class="bn" style="margin-left:6px" data-act="flagok" data-id="'+esc(s.id)+'">ตรวจแล้ว</button></div>';
  return h+syn+'</div>';
}

/* ---------- หน้า: ตรวจรายชื่อ ---------- */
function review(){
  const rows=S.rev||[],done=rows.filter(r=>r.done).length;
  let h=header('ตรวจรายชื่อ',isDir()?'ภาพรวมทุกห้อง/กลุ่ม':'ห้อง/กลุ่มของท่าน')+roBar(),b='<div class="wrap">';
  if(!S.rev)return h+b+'<div class="card"><div class="spin"></div><p class="sub" style="text-align:center">กำลังโหลด…</p></div></div>';
  b+='<div class="card"><div class="rowf between"><b>ตรวจแล้ว <span class="num">'+done+' / '+rows.length+'</span> แถว</b><span class="chip '+(done===rows.length?'c-ok':'c-warn')+'">เหลือ '+(rows.length-done)+'</span></div><div class="prog" style="margin-top:8px"><i style="width:'+(rows.length?Math.round(done/rows.length*100):0)+'%"></i></div><p class="hint" style="margin:8px 0 0">ครูประจำกลุ่มและครูประจำชั้นของเด็กตรวจได้ทั้งคู่ ใครตรวจก่อนก็ได้ · แถว "รอจับคู่" (ยังไม่ผูกกับเด็ก) เห็นเฉพาะครูประจำกลุ่มและ ผอ. ผูกกับเด็กแล้วครูประจำชั้นเห็นตามปกติ</p></div>';

function saveRead(sc,s,patch){

  else{const e=effIqra(s),book=patch.book!=null?patch.book:e.book;let page=patch.page!=null?patch.page:e.page;if(book&&!page)page=1;if(!book||!page){toast('เลือกเล่มและหน้าก่อน');render();return}

/* ---------- กราฟภาพรวม (SVG เอง เบา ไม่ใช้ไลบรารี · ตัวเลขทุกตัวมาจากข้อมูลจริง) ---------- */
const CSEG=[['มา','var(--ok)','มา'],['ขาด','var(--bad)','ขาด'],['ลา','var(--lv)','ลา'],['กิจกรรม','var(--act)','กิจกรรม'],['','var(--warn)','ยังไม่ยืนยัน']];
function donut(c,total){
  if(!total)return '<p class="sub">ยังไม่มีข้อมูล</p>';
  let off=0,segs='';CSEG.forEach(x=>{const v=c[x[0]]||0;if(!v)return;const p=v/total*100;segs+='<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:'+x[1]+'" stroke-width="6" stroke-dasharray="'+p.toFixed(2)+' '+(100-p).toFixed(2)+'" stroke-dashoffset="'+(25-off).toFixed(2)+'"/>';off+=p});
  return '<div class="donutw"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="สัดส่วนการมาเรียนทั้งโรงเรียน '+total+' คน"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--soft)" stroke-width="6"/>'+segs+'<text x="21" y="22.2" text-anchor="middle" class="dn">'+total+'</text><text x="21" y="27" text-anchor="middle" class="dn ds">คน</text></svg><div class="lgd" style="flex:1;min-width:150px">'+CSEG.map(x=>'<span class="chip" style="background:none;border:1.5px solid '+x[1]+';color:var(--ink)"><b class="num">'+(c[x[0]]||0)+'</b> '+x[2]+' <span class="hint">('+Math.round((c[x[0]]||0)/total*100)+'%)</span></span>').join('')+'</div></div>';
}
function stackBar(segs,total){
  let x=0,r='';segs.forEach(s=>{if(!s.v)return;const w=s.v/total*100;r+='<rect x="'+x.toFixed(2)+'" y="0" width="'+w.toFixed(2)+'" height="16" style="fill:'+s.col+(s.op?';fill-opacity:'+s.op:'')+'"/>';x+=w});
  return '<div class="cb"><svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true">'+r+'</svg></div>';
}

  const m=DG.m,d=(a,b)=>(m[a]!=null&&m[b]!=null)?(m[b]-m[a])+' ms':'-';
  const row=(k,v)=>'<div class="line"><span class="sub">'+k+'</span><b>'+v+'</b></div>';
  let h='<h2>เวลาเปิดหน้านี้ (ตัวเลขล้วน)</h2>'+row('LIFF เริ่ม → เสร็จ',d('liff0','liff1'))+row('รอหลังบ้าน boot (รวม)',d('boot0','boot1'))+row('วาดหน้า',d('boot1','render1'))+row('เปิดหน้าเว็บ → หน้าแรกขึ้น (รวม)',m.render1!=null?m.render1+' ms':'-');
  h+='<h3>คำขอล่าสุด (ฝั่งมือถือ / ฝั่งหลังบ้าน)</h3>';
  DG.calls.slice().reverse().forEach(c=>{const t=c.t||{},build=(c.s!=null&&t.auth!=null)?Math.max(0,c.s-(t.auth||0)-(t.sMs||0)-(t.cMs||0)):null;
    h+='<div class="card" style="margin:0 0 8px"><b>'+esc(c.a)+'</b> · มือถือ '+c.c+' ms · หลังบ้าน '+(c.s!=null?c.s:'-')+' ms'
     +(c.t?'<div class="hint">ตรวจ LINE '+t.auth+' ms'+(t.fetch?' (เรียก LINE)':' (จำไว้แล้ว)')+' · อ่านชีต QK-Student '+t.sReads+' ครั้ง '+t.sMs+' ms'+' · อ่านทะเบียน/ค่าตั้งสด '+t.cReads+' ครั้ง '+t.cMs+' ms (จากแคช '+t.hits+' ก้อน) · ประกอบข้อมูล '+(build==null?'-':build)+' ms</div><div class="hint">แท็บที่อ่าน: '+esc(Object.keys(t.tabs||{}).map(k=>k+'×'+t.tabs[k]).join(' ')||'-')+'</div>':'')+'</div>'});
  return h+(DG.calls.length?'':'<p class="sub">ยังไม่มีคำขอ</p>');
}

async function start(){
  window.__qsStage='liff';
  dgm('liff0');try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return fatal('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message)}
  dgm('liff1');window.__qsStage='login';
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  window.__qsStage='api';
  try{const as=new URLSearchParams(location.search).get('as');if(as){S.viewAs=as;S.viewAsName=as}}catch(e){}
  dgm('boot0');try{await loadBoot()}
  catch(e){
    if(S.viewAs&&(e.code==='FORBIDDEN'||e.code==='NOT_FOUND')){S.viewAs='';try{await loadBoot()}catch(e2){return fail(e2)}}
    else return fail(e);
  }
  if(S.viewAs&&B.viewAs)S.viewAsName=B.viewAs.name;
  dgm('boot1');window.__qsStage='render';
  qLoad();S.tab=isDir()?'overview':'today';S.rmode=(B.today.dow>=3&&B.today.dow<=4)?'iqra':'thai';
  $('#boot').hidden=true;$('#app').hidden=false;render();dgm('render1');
  loadLazy();
  if(isDir())loadOverview();
  if(Q.items.length)flush(false);
}
function fatal(h,msg){$('#boot').hidden=false;$('#boot').innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><h2>'+esc(h)+'</h2><p class="sub">'+esc(msg)+'</p><button class="bn pri wide" onclick="location.reload()">ลองใหม่</button></div>'}
function fail(e){
  if(e.code==='NOT_LINKED')return fatal('ยังไม่ได้ผูกบัญชี','ผูกบัญชี LINE กับโรงเรียนที่หน้ากลาง Q-Kawa ก่อน (กรอกรหัส 6 หลักจาก ผอ.) แล้วกลับมาที่นี่');
  if(e.code==='APP_OFF')return fatal('Q-Student ยังไม่เปิดใช้',e.message);
  if(e.code==='FORBIDDEN')return fatal('Q-Student ใช้ได้เฉพาะครูประจำชั้น ครูประจำกลุ่มอิกเราะห์ และ ผอ.',e.message);
  if(e.code==='NO_API')return fatal('ยังไม่ได้ตั้งค่า API_URL',e.message);
  return fatal('โหลดข้อมูลไม่สำเร็จ',e.message);
}
start().catch(e=>fail(e));
})();
</script>
