<script>
/* ============ ตั้งค่า (ที่เดียว) ============ */
const CONFIG = {
  LIFF_ID: '2012013981-CUuRUfnG',   // LIFF เดียวกับหน้ากลาง Q-Teacher / Q-Student / Q-Academic
  API_URL: 'https://script.google.com/macros/s/AKfycbx3hRVmBE0qttsEkeclss7wtvbJNfPb7jKBYpkxNXMDL1Vrm3iQlBhgKZlLGKBwWbsT/exec',   // URL หลังบ้าน Q-Parent ที่ Deploy แล้ว
  HUB_URL: '../',                   // กลับหน้ากลาง Q-Kawa
  CODE_DIGITS: 8,                   // จำนวนหลักของรหัส (ต้องตรงกับ CONFIG.CODE_DIGITS ของหลังบ้าน)
  LINK_URL: 'link.html',               // หน้าผูกบัญชี (เพิ่มลูก)

};

<script>
/* ตัวเฝ้าหน้า: ค้างที่หน้า "กำลังเปิด…" เกิน 15 วินาที หรือมี error ก่อนหน้าแรกวาดเสร็จ → ขึ้นข้อความสาเหตุ + ปุ่มลองใหม่ */
(function(){
  var W=window;W.__qpStage='script';
  var WHY={script:'ไฟล์หน้าเว็บโหลดไม่ครบ หรือสคริปต์ยังไม่เริ่มทำงาน',liff:'เชื่อมต่อ LINE (LIFF) ไม่สำเร็จหรือช้ามาก',login:'กำลังพาไปล็อกอิน LINE ไม่สำเร็จ',api:'รอหลังบ้าน (Google Apps Script) ตอบ ใช้เวลานานผิดปกติ อาจเป็นเน็ตช้า',render:'วาดหน้าจอไม่สำเร็จ'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function splash(){var b=document.getElementById('boot');return !!(b&&!b.hidden&&b.querySelector('.spin'))}
  W.qpFail=function(stage,err,wait){
    var host=document.getElementById('boot');if(!host)return;host.hidden=false;
    host.innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><div style="font-size:2rem">⚠️</div><h2>'+(wait?'หน้านี้เปิดช้ากว่าปกติ':'หน้านี้เปิดไม่สำเร็จ')+'</h2><p class="sub">'+esc(WHY[stage||W.__qpStage]||WHY.script)+(err&&err.message?'<br>'+esc(err.message):'')+'</p><button class="bn pri wide" onclick="location.reload()">ลองใหม่</button></div>';
  };
  W.addEventListener('error',function(e){if(splash())W.qpFail(W.__qpStage,e&&e.error?e.error:{message:e.message},false)});
  W.addEventListener('unhandledrejection',function(e){if(splash())W.qpFail(W.__qpStage,e&&e.reason,false)});
  setTimeout(function(){if(splash())W.qpFail(W.__qpStage,null,true)},15000);
})();
</script>
<style>
:root{--bg:#F3F4FB;--card:#fff;--soft:#F2F3F9;--line:#E7E9F3;--ink:#1B1F3B;--muted:#5E6385;--pri:#5B5BF0;--pri-ink:#4343D4;--pri-soft:#ECEBFE;--navy:#1E2341;--navy2:#2C3263;
 --ok:#0A6F45;--ok-bg:#E2F6EC;--bad:#B3262E;--bad-bg:#FDE8E9;--warn:#8A5300;--warn-bg:#FFF1D9;--lv:#6B2FA8;--lv-bg:#F1E6FB;--act:#1D5FA8;--act-bg:#E3EEFA;
 --shadow:0 8px 20px -8px rgba(30,35,65,.30),0 2px 5px rgba(30,35,65,.07);--f:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;--fh:"Kanit","IBM Plex Sans Thai",sans-serif;color-scheme:light}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{border:0;border-radius:16px;padding:8px 4px;text-align:center;min-height:62px;background:var(--card);box-shadow:var(--shadow)}.kpi b{display:block;font:600 21px var(--fh)}.kpi span{font-size:12px;color:var(--muted)}.kpi.on{outline:3px solid var(--pri)}

.codebox{font:600 40px/1.15 var(--fh);letter-spacing:.12em;text-align:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:18px;padding:18px 8px;margin:10px 0;user-select:all;-webkit-user-select:all;word-break:break-all}

@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

.today .ic{font-size:22px;line-height:1;flex:none;width:30px;text-align:center}.today small{display:block;font-weight:400;font-size:13px;opacity:.9}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-lv{background:var(--lv-bg);color:var(--lv)}.t-act{background:var(--act-bg);color:var(--act)}.t-mut{background:var(--soft);color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}

.wk .c{border-radius:12px;min-height:60px;padding:6px 2px;display:grid;align-content:center;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;line-height:1.2;word-break:break-word}
.wk .c b{font-size:17px;line-height:1}.wk .c.now{outline:3px solid var(--pri);outline-offset:1px}
.wk .c.fut{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}.wk .c.hol{background:var(--warn-bg);color:var(--warn)}
.kid h2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

<body>
<div id="boot"><div class="card" style="max-width:420px;margin:22vh auto 0;text-align:center"><div class="spin"></div><p class="sub" style="margin-top:12px">กำลังเปิด…</p></div></div>
<div id="app" hidden></div>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* โหมดตัวอย่างบนเครื่อง: เฉพาะเปิดจากไฟล์ในเครื่อง (file://) พร้อม ?preview=1 · ขึ้นเว็บจริงไม่ทำงานเด็ดขาด · ข้อมูลสมมติล้วน */
const PREVIEW=location.protocol==='file:'&&/[?&]preview=1(&|$)/.test(location.search);
const S={home:null,busy:false,online:navigator.onLine!==false,err:''};
const thMon=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDay=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function thDate(ymd){const p=String(ymd||'').split('-').map(Number);if(p.length!==3||!p[0])return '';const dow=new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay();return 'วัน'+thDay[dow]+'ที่ '+p[2]+' '+thMon[p[1]-1]+' '+String((p[0]+543)%100).padStart(2,'0')}

async function api(action,data,extra,ms){
  if(PREVIEW)return mockApi(action,data||{});
  if(!CONFIG.API_URL){const e=new Error('ยังไม่ได้ตั้งค่า API_URL');e.code='NO_API';throw e}
  let r,j;
  try{
    r=await Promise.race([fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action,idToken:liff.getIDToken(),data:data||{}},extra||{}))}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms||25000))]);
    j=await r.json();
  }catch(er){const e=new Error('เชื่อมต่อไม่ได้ (ไม่มีสัญญาณหรือช้ามาก) ลองใหม่อีกครั้ง');e.code='NET';throw e}
  if(!j.ok){const e=new Error(j.error||'เกิดข้อผิดพลาด');e.code=j.code||'ERROR';
    if(e.code==='TOKEN_EXPIRED'||e.code==='BAD_TOKEN')relogin();throw e}
  return j;
}
function relogin(){let n=0;try{n=Number(sessionStorage.getItem('qp_relogin')||0);sessionStorage.setItem('qp_relogin',String(n+1))}catch(e){}if(n>1)return;if(liff.isInClient())location.reload();else{try{liff.logout()}catch(e){}liff.login({redirectUri:location.href})}}
const ERR={NET:'เชื่อมต่อไม่ได้ (ไม่มีสัญญาณหรือช้ามาก) ลองใหม่อีกครั้ง',BUSY:'ระบบกำลังทำงานอยู่ กรุณาลองอีกครั้ง',NO_TOKEN:'เข้าสู่ระบบ LINE ไม่สำเร็จ กรุณาเปิดใหม่อีกครั้ง'};
const errText=e=>ERR[e.code]||e.message||'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';

/* สถานะ → สี + สัญลักษณ์ + ข้อความ (ไม่ใช้สีอย่างเดียว) · "ยังไม่เช็กชื่อ" เป็นสีเทากลาง ไม่ใช้แดง */
const ST={
 'มา':{cls:'t-ok',chip:'c-ok',ic:'✓',short:'มา',today:'มาเรียน'},
 'ขาด':{cls:'t-bad',chip:'c-bad',ic:'✗',short:'ขาด',today:'ขาดเรียน'},
 'ลา':{cls:'t-lv',chip:'c-lv',ic:'ล',short:'ลา',today:'ลา'},
 'กิจกรรม':{cls:'t-act',chip:'c-act',ic:'★',short:'กิจกรรม',today:'ร่วมกิจกรรมของโรงเรียน'},
 'ยังไม่เช็กชื่อ':{cls:'t-mut',chip:'c-mut',ic:'–',short:'ยังไม่เช็กชื่อ',today:'ครูยังไม่ได้เช็กชื่อ'},
 'ยังไม่ถึง':{cls:'t-mut',chip:'fut',ic:'·',short:'ยังไม่ถึง',today:'ยังไม่ถึงวันนี้'},
 'วันหยุด':{cls:'t-mut',chip:'hol',ic:'○',short:'วันหยุด',today:'วันหยุด ไม่มีเรียน'}
};
const stOf=s=>ST[s]||ST['ยังไม่เช็กชื่อ'];
function header(){return '<div class="hdr"><div class="row"><div style="flex:1;min-width:0"><h1>ลูกของฉัน</h1><p>'+(S.home?esc(thDate(S.home.today)):'Q-Parent · โรงเรียนบ้านกาวะ')+'</p></div><a class="hbtn" href="'+esc(CONFIG.HUB_URL)+'">หน้ากลาง</a></div></div>'}
function weekRow(k,today){
  return '<div class="wk" role="list" aria-label="การมาเรียนสัปดาห์นี้ของ'+esc(k.nick||k.name)+'">'+k.week.map(w=>{
    const s=stOf(w.status),isNow=w.date===today;
    const cc=s.chip==='fut'?'c fut':s.chip==='hol'?'c hol':'c '+s.chip;
    return '<div class="d" role="listitem"><span class="dn'+(isNow?' now':'')+'">'+esc(w.day)+'</span><span class="'+cc+(isNow?' now':'')+'" aria-label="'+esc(w.day+' '+w.status)+'"><b aria-hidden="true">'+s.ic+'</b><span>'+esc(s.short)+'</span></span></div>';
  }).join('')+'</div>';
}
function kidCard(k,today){
  const s=stOf(k.today&&k.today.status);
  return '<div class="card kid"><h2>'+esc(k.nick||k.name)+(k.room?'<span class="chip c-lv">'+esc(k.room)+'</span>':'')+'</h2>'
   +'<p class="sub" style="margin:2px 0 0">'+esc(k.name)+(k.teacher?' · ครูประจำชั้น: '+esc(k.teacher.replace(/^ครู/,'')):'')+'</p>'
   +'<div class="today '+s.cls+'" style="margin-top:10px" role="status"><span class="ic" aria-hidden="true">'+s.ic+'</span><span>วันนี้: '+esc(s.today)+'</span></div>'
   +weekRow(k,today)+'</div>';
}
function render(){
  const H=S.home;if(!H)return;
  const kids=H.kids||[];
  $('#app').innerHTML=(PREVIEW?'<div class="pv">โหมดตัวอย่างบนเครื่อง · ข้อมูลสมมติ ไม่ได้เชื่อมระบบจริง</div>':'')+(S.online?'':'<div class="offbar">ไม่มีสัญญาณอินเทอร์เน็ต</div>')+header()
   +'<div class="wrap"><div class="stack">'
   +(S.err?'<div class="card" role="alert" style="background:var(--bad-bg);color:var(--bad);font-weight:600">'+esc(S.err)+'</div>':'')
   +(kids.length?kids.map(k=>kidCard(k,H.today)).join(''):'<div class="card empty">ไม่พบลูกที่ผูกไว้ในตอนนี้ (อาจย้ายออกหรือสิ้นสุดการเป็นนักเรียน) ติดต่อโรงเรียนหากไม่ถูกต้อง</div>')
   +'<div class="rowf"><a class="bn pri" style="display:inline-flex;align-items:center" href="'+esc(CONFIG.LINK_URL)+'">+ เพิ่มลูก</a><button class="bn" data-a="refresh" '+(S.busy?'disabled':'')+'>'+(S.busy?'กำลังโหลด…':'โหลดใหม่')+'</button></div>'
   +'<p class="sub" style="margin:0">ตัวเลขการมาเรียนมาจากการเช็กชื่อของครู หากยังไม่เช็กชื่อ จะแสดงเป็น "ยังไม่เช็กชื่อ" ไม่ได้หมายถึงขาดเรียน</p>'
   +'</div><p class="sub" style="text-align:center;margin:18px 0 6px">'+esc(CONFIG.WEB_VERSION)+'</p></div>';
}
async function load(){
  S.busy=true;S.err='';if(S.home)render();
  try{const j=await api('home',{});S.home=j.home}
  catch(e){
    S.busy=false;
    if(e.code==='NOT_LINKED'){notLinked();return 'stop'}
    if(e.code==='APP_OFF'){fatal('ระบบยังไม่เปิดใช้งาน','โรงเรียนยังไม่เปิดให้ผู้ปกครองใช้งาน กรุณารอประกาศจากโรงเรียน',false);return 'stop'}
    if(S.home){S.err=errText(e);render();return}
    throw e;
  }
  S.busy=false;
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='refresh'){const r=await load();if(r!=='stop')render()}
});
window.addEventListener('online',()=>{S.online=true;render()});
window.addEventListener('offline',()=>{S.online=false;render()});

/* ---------- ตัวอย่างบนเครื่อง (ข้อมูลสมมติ) ---------- */
function mockApi(action,d){
  return new Promise((res,rej)=>setTimeout(()=>{
    const fail=(code,msg)=>{const e=new Error(msg);e.code=code;rej(e)};
    if(/off=1/.test(location.search))return fail('APP_OFF','ระบบยังไม่เปิดใช้งาน');
    if(/empty=1/.test(location.search))return fail('NOT_LINKED','ยังไม่ได้ผูก');
    if(action!=='home')return fail('UNKNOWN_ACTION','ไม่รู้จักคำสั่ง');
    const n=new Date(),z=v=>String(v).padStart(2,'0'),ymd=x=>x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());
    const dow=n.getDay()||7,mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-(dow-1)),today=ymd(n);
    const days=[0,1,2,3,4].map(i=>{const x=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);return {day:['จ','อ','พ','พฤ','ศ'][i],date:ymd(x)}});
    const pat={A:['มา','ลา','มา','มา','ขาด'],B:['มา','กิจกรรม','มา','','มา']};
    const mk=(id,nick,name,room,teacher,p)=>{const week=days.map((x,i)=>({day:x.day,date:x.date,status:dow>5||x.date>today?'ยังไม่ถึง':(p[i]||'ยังไม่เช็กชื่อ')}));if(dow>5)week.forEach((w,i)=>{w.status=p[i]||'ยังไม่เช็กชื่อ'});
      const t=dow>5?'วันหยุด':(week.find(w=>w.date===today)||{}).status;return {id:id,nick:nick,name:name,room:room,teacher:teacher,today:{date:today,status:t},week:week}};
    res({home:{today:today,week_from:days[0].date,week_to:days[4].date,kids:[mk('T1','น้องตัวอย่างหนึ่ง','ด.ญ.ตัวอย่างหนึ่ง สมมติ','ป.4','ครูสมมติหนึ่ง',pat.A),mk('T2','น้องตัวอย่างสอง','ด.ช.ตัวอย่างสอง สมมติ','อ.2','',pat.B)]}});
  },120));
}

function fatal(h,msg,retry){$('#boot').hidden=false;$('#app').hidden=true;$('#boot').innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><h2>'+esc(h)+'</h2><p class="sub">'+esc(msg)+'</p>'+(retry?'<button class="bn pri wide" onclick="location.reload()">ลองใหม่</button>':'')+'</div>'}
function notLinked(){$('#boot').hidden=false;$('#app').hidden=true;$('#boot').innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><h2>ยังไม่ได้ผูกบัญชีกับลูก</h2><p class="sub">กรอกรหัสที่ได้รับจากผู้อำนวยการ เพื่อดูข้อมูลของลูก</p><a class="bn pri wide" style="display:flex;align-items:center;justify-content:center" href="'+esc(CONFIG.LINK_URL)+'">ผูกบัญชีกับลูก</a></div>'}
async function start(){
  if(!PREVIEW){
    window.__qpStage='liff';
    try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return fatal('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message,true)}
    window.__qpStage='login';
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  }
  window.__qpStage='api';
  try{const r=await load();if(r==='stop')return}catch(e){
    if(e.code==='NO_API')return fatal('ยังไม่ได้ตั้งค่า API_URL',e.message,false);
    return fatal('เปิดหน้านี้ไม่สำเร็จ',errText(e),true);
  }
  window.__qpStage='render';
  $('#boot').hidden=true;$('#app').hidden=false;render();
}
start().catch(e=>{if(window.qpFail)window.qpFail(window.__qpStage,e,false)});
})();
</script>
