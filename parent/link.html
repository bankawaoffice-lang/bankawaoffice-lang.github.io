<meta name="description" content="หน้าทดสอบผูกบัญชีผู้ปกครอง Q-Parent โรงเรียนบ้านกาวะ · ผู้พัฒนา นายฮาฟีซี อูมา">

<script>
/* ============ ตั้งค่า (ที่เดียว) ============ */
const CONFIG = {
  LIFF_ID: '2012013981-CUuRUfnG',   // LIFF เดียวกับหน้ากลาง Q-Teacher / Q-Student / Q-Academic
  API_URL: 'https://script.google.com/macros/s/AKfycbx3hRVmBE0qttsEkeclss7wtvbJNfPb7jKBYpkxNXMDL1Vrm3iQlBhgKZlLGKBwWbsT/exec',   // URL หลังบ้าน Q-Parent ที่ Deploy แล้ว
  HUB_URL: '../',                   // กลับหน้ากลาง Q-Kawa
  CODE_DIGITS: 8,                   // จำนวนหลักของรหัส (ต้องตรงกับ CONFIG.CODE_DIGITS ของหลังบ้าน)
  WEB_VERSION: 'หน้าทดสอบ v0.3'
};
</script>
<script>
/* ตัวเฝ้าหน้า: ค้างที่หน้า "กำลังเปิด…" เกิน 15 วินาที หรือมี error ก่อนหน้าแรกวาดเสร็จ → ขึ้นข้อความสาเหตุ + ปุ่มลองใหม่ */
(function(){
  var W=window;W.__qpStage='script';
  var WHY={script:'ไฟล์หน้าเว็บโหลดไม่ครบ หรือสคริปต์ยังไม่เริ่มทำงาน',liff:'เชื่อมต่อ LINE (LIFF) ไม่สำเร็จหรือช้ามาก',login:'กำลังพาไปล็อกอิน LINE ไม่สำเร็จ',api:'รอหลังบ้าน (Google Apps Script) ตอบ ใช้เวลานานผิดปกติ อาจเป็นเน็ตช้า',render:'วาดหน้าจอไม่สำเร็จ'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function splash(){var b=document.getElementById('boot');return !!(b&&!b.hidden&&b.querySelector('.spin'))}
  W.qpFail=function(stage,err,wait){
    var host=document.getElementById('boot');if(!host)return;host.hidden=false;
    host.innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><div style="font-size:2rem">⚠️</div><h2>'+(wait?'หน้านี้เปิดช้ากว่าปกติ':'หน้านี้เปิดไม่สำเร็จ')+'</h2><p class="sub">'+esc(WHY[stage||W.__qpStage]||WHY.script)+(err&&err.message?'<br>'+esc(err.message):'')+'</p><button class="bn pri wide" onclick="location.reload()">ลองใหม่</button></div>';
  };
  W.addEventListener('error',function(e){if(splash())W.qpFail(W.__qpStage,e&&e.error?e.error:{message:e.message},false)});
  W.addEventListener('unhandledrejection',function(e){if(splash())W.qpFail(W.__qpStage,e&&e.reason,false)});
  setTimeout(function(){if(splash())W.qpFail(W.__qpStage,null,true)},15000);
})();
</script>
<style>
:root{--bg:#F3F4FB;--card:#fff;--soft:#F2F3F9;--line:#E7E9F3;--ink:#1B1F3B;--muted:#5E6385;--pri:#5B5BF0;--pri-ink:#4343D4;--pri-soft:#ECEBFE;--navy:#1E2341;--navy2:#2C3263;
 --ok:#0A6F45;--ok-bg:#E2F6EC;--bad:#B3262E;--bad-bg:#FDE8E9;--warn:#8A5300;--warn-bg:#FFF1D9;--lv:#6B2FA8;--lv-bg:#F1E6FB;--act:#1D5FA8;--act-bg:#E3EEFA;
 --shadow:0 8px 20px -8px rgba(30,35,65,.30),0 2px 5px rgba(30,35,65,.07);--f:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;--fh:"Kanit","IBM Plex Sans Thai",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1022;--card:#171A31;--soft:#1F2340;--line:#2A2E50;--ink:#EDEEFB;--muted:#B4B8D8;--pri:#8C8CFF;--pri-ink:#B8B8FF;--pri-soft:#262A5C;--navy:#0A0C1C;--navy2:#1B1F45;
 --ok:#6BD6A3;--ok-bg:#15352A;--bad:#FF9AA0;--bad-bg:#40191D;--warn:#F5C26B;--warn-bg:#3A2D12;--lv:#D2A8FF;--lv-bg:#2E1F45;--act:#8CC4FF;--act-bg:#16304F;--shadow:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-text-size-adjust:100%;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.25}h1{font-size:22px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}.sub{color:var(--muted);font-size:13px}.wrap{padding:0 16px;max-width:760px;margin:0 auto}
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 12px 28px rgba(30,35,65,.22);padding:18px 16px 20px;margin-bottom:14px}
.hdr .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}.hdr h1{color:#fff;flex:1;min-width:0}.hdr p{margin:2px 0 0;color:rgba(255,255,255,.82);font-size:13px}
.hbtn{flex:none;min-width:44px;min-height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:500;text-decoration:none;white-space:nowrap}
.pv{background:#F59E0B;color:#1B1F3B;padding:8px 14px;font-size:13.5px;font-weight:600;text-align:center}
.offbar{background:var(--warn-bg);color:var(--warn);padding:8px 14px;font-size:13.5px;font-weight:500;text-align:center}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.stack{display:grid;gap:12px}.rowf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.bn{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 16px;font-weight:500}.bn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bn.pri{color:#0E1022}}
.bn.good{background:var(--ok);border-color:var(--ok);color:#fff}.bn.bad{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad)}.bn.wide{width:100%}.bn.big{min-height:60px;font-size:18px;font-family:var(--fh);border-radius:18px}
.bn[disabled],.bn.dis{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-lv{background:var(--lv-bg);color:var(--lv)}.c-act{background:var(--act-bg);color:var(--act)}.c-mut{background:var(--soft);color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:5}
.nav button{flex:1;max-width:200px;min-height:50px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:500;font-size:13px;display:grid;gap:2px;justify-items:center;align-content:center}
.nav button.on{background:var(--navy);color:#fff;box-shadow:inset 0 3px 0 #38BDF8}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{border:0;border-radius:16px;padding:8px 4px;text-align:center;min-height:62px;background:var(--card);box-shadow:var(--shadow)}.kpi b{display:block;font:600 21px var(--fh)}.kpi span{font-size:12px;color:var(--muted)}.kpi.on{outline:3px solid var(--pri)}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.seg button{flex:none;min-height:44px}
input[type=text],input[type=search],select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.pick{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:2px solid transparent;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:8px;min-height:56px}
.pick.on{border-color:var(--pri)}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rel button{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:600}.rel button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-ink)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(10,12,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.codebox{font:600 40px/1.15 var(--fh);letter-spacing:.12em;text-align:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:18px;padding:18px 8px;margin:10px 0;user-select:all;-webkit-user-select:all;word-break:break-all}
.msgprev{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;z-index:30;max-width:90vw;box-shadow:var(--shadow)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
[hidden]{display:none!important}
</style>

<body>
<div id="boot"><div class="card" style="max-width:420px;margin:22vh auto 0;text-align:center"><div class="spin"></div><p class="sub" style="margin-top:12px">กำลังเปิด…</p></div></div>
<div id="app" hidden></div>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nonce=()=>{try{return crypto.randomUUID().replace(/-/g,'').slice(0,24)}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,12)}};
/* โหมดตัวอย่างบนเครื่อง: เฉพาะเปิดจากไฟล์ในเครื่อง (file://) พร้อม ?preview=1 · ขึ้นเว็บจริงไม่ทำงานเด็ดขาด · ข้อมูลสมมติล้วน */
const PREVIEW=location.protocol==='file:'&&/[?&]preview=1(&|$)/.test(location.search);
const S={kids:null,adding:false,code:'',busy:false,err:'',okMsg:'',off:false,online:navigator.onLine!==false};

async function api(action,data,extra,ms){
  if(PREVIEW)return mockApi(action,data||{});
  if(!CONFIG.API_URL){const e=new Error('ยังไม่ได้ตั้งค่า API_URL');e.code='NO_API';throw e}
  let r,j;
  try{
    r=await Promise.race([fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action,idToken:liff.getIDToken(),data:data||{}},extra||{}))}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms||25000))]);
    j=await r.json();
  }catch(er){const e=new Error('เชื่อมต่อไม่ได้ (ไม่มีสัญญาณหรือช้ามาก) ลองใหม่อีกครั้ง');e.code='NET';throw e}
  if(!j.ok){const e=new Error(j.error||'เกิดข้อผิดพลาด');e.code=j.code||'ERROR';
    if(e.code==='TOKEN_EXPIRED'||e.code==='BAD_TOKEN')relogin();throw e}
  return j;
}
function relogin(){let n=0;try{n=Number(sessionStorage.getItem('qp_relogin')||0);sessionStorage.setItem('qp_relogin',String(n+1))}catch(e){}if(n>1)return;if(liff.isInClient())location.reload();else{try{liff.logout()}catch(e){}liff.login({redirectUri:location.href})}}
function toast(t){const o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}
const ERR={NET:'เชื่อมต่อไม่ได้ (ไม่มีสัญญาณหรือช้ามาก) ลองใหม่อีกครั้ง',BUSY:'ระบบกำลังทำงานอยู่ กรุณาลองอีกครั้ง',NO_TOKEN:'เข้าสู่ระบบ LINE ไม่สำเร็จ กรุณาเปิดใหม่อีกครั้ง'};
const errText=e=>ERR[e.code]||e.message||'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';

function header(){return '<div class="hdr"><div class="row"><div style="flex:1;min-width:0"><h1>ผูกบัญชีผู้ปกครอง</h1><p>Q-Parent · โรงเรียนบ้านกาวะ</p></div><a class="hbtn" href="'+esc(CONFIG.HUB_URL)+'">หน้ากลาง</a></div></div>'}
function form(){
  const first=!S.kids.length;
  return '<div class="card"><h2>'+(first?'ผูกบัญชีกับลูก':'เพิ่มลูก')+'</h2>'
   +'<p class="sub" style="margin:4px 0 0">กรอกรหัส '+CONFIG.CODE_DIGITS+' หลักที่ได้รับจากผู้อำนวยการ รหัสหนึ่งใบใช้ผูกลูกหนึ่งคน และใช้ได้ครั้งเดียว</p>'
   +'<label for="code">รหัสผูกบัญชี</label><input type="text" id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="'+(CONFIG.CODE_DIGITS+4)+'" placeholder="เช่น 12345678" value="'+esc(S.code)+'" style="font-size:24px;letter-spacing:.15em;text-align:center">'
   +(S.err?'<p class="warnbox" role="alert" style="margin-top:10px;background:var(--bad-bg);color:var(--bad)">'+esc(S.err)+'</p>':'')
   +'<button class="bn pri big wide" style="margin-top:12px" data-a="link" '+(S.busy||!S.off&&S.code.length!==CONFIG.CODE_DIGITS?'disabled':'')+'>'+(S.busy?'กำลังตรวจรหัส…':'ผูกบัญชี')+'</button>'
   +(first?'':'<button class="bn wide" style="margin-top:8px" data-a="cancel">ยกเลิก</button>')+'</div>';
}
function kidCard(k){
  return '<div class="card"><div class="rowf between"><div style="display:grid"><b>'+esc(k.nick||k.name)+'</b><span class="sub">'+esc(k.name)+(k.room?' · '+esc(k.room):'')+'</span></div><span class="chip c-ok">ผูกแล้ว</span></div>'
   +(k.relation?'<div class="rowf" style="margin-top:6px"><span class="chip c-lv">'+esc(k.relation)+'</span>'+(k.teacher?'<span class="sub">'+esc(k.teacher)+'</span>':'')+'</div>':'')+'</div>';
}
function render(){
  const app=$('#app');
  let h=(PREVIEW?'<div class="pv">โหมดตัวอย่างบนเครื่อง · ข้อมูลสมมติ ไม่ได้เชื่อมระบบจริง</div>':'')+(S.online?'':'<div class="offbar">ไม่มีสัญญาณอินเทอร์เน็ต</div>')+header()+'<div class="wrap"><div class="stack">';
  if(S.okMsg)h+='<div class="card" role="status" style="background:var(--ok-bg);color:var(--ok);font-weight:600">'+esc(S.okMsg)+'</div>';
  if(S.kids.length){h+='<h2 style="margin:4px 2px">ลูกที่ผูกไว้ ('+S.kids.length+' คน)</h2>'+S.kids.map(kidCard).join('')}
  if(!S.kids.length||S.adding)h+=form();
  else h+='<button class="bn pri wide" style="min-height:52px" data-a="add">+ เพิ่มลูก</button>';
  h+='</div><p class="sub" style="text-align:center;margin:18px 0 6px">'+esc(CONFIG.WEB_VERSION)+'</p></div>';
  app.innerHTML=h;
  if(!S.kids.length||S.adding){const i=$('#code');if(i&&S.focus){i.focus();S.focus=false}}
}
async function loadMe(){
  try{const j=await api('me',{});S.kids=j.me.kids||[]}
  catch(e){
    if(e.code==='NOT_LINKED'){S.kids=[];return}
    throw e;
  }
}
async function doLink(){
  if(S.busy)return;
  const code=S.code;   // เก็บเป็นข้อความเสมอ (เลข 0 นำหน้าต้องไม่หาย)
  if(code.length!==CONFIG.CODE_DIGITS){S.err='กรุณากรอกรหัสตัวเลข '+CONFIG.CODE_DIGITS+' หลัก';render();return}
  S.busy=true;S.err='';S.okMsg='';render();
  try{
    const j=await api('link',{code:code},{nonce:nonce()});
    S.code='';S.adding=false;await loadMe();
    S.okMsg=j.already?'ผูกกับ'+(j.kid.nick||j.kid.name)+' อยู่แล้ว':'ผูกบัญชีกับ'+(j.kid.nick||j.kid.name)+' เรียบร้อย';
  }catch(e){
    if(e.code==='APP_OFF'){S.off=true;S.err=e.message}
    else if(e.code==='DUP_REQ'){try{await loadMe();S.code='';S.adding=false;S.okMsg='ตรวจสอบรายการลูกล่าสุดแล้ว'}catch(x){S.err=errText(x)}}
    else S.err=errText(e);
  }
  S.busy=false;S.focus=true;render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='link')doLink();
  if(a==='add'){S.adding=true;S.err='';S.okMsg='';S.code='';S.focus=true;render()}
  if(a==='cancel'){S.adding=false;S.err='';S.code='';render()}
});
document.addEventListener('input',e=>{
  if(e.target.id!=='code')return;
  const v=e.target.value.replace(/[^0-9]/g,'').slice(0,CONFIG.CODE_DIGITS);   // เก็บเป็นข้อความ ตัดตัวที่ไม่ใช่เลข
  S.code=v;S.err='';e.target.value=v;
  const b=$('[data-a=link]');if(b)b.disabled=S.busy||v.length!==CONFIG.CODE_DIGITS;
  const w=$('[role=alert]');if(w)w.remove();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code'){e.preventDefault();if(S.code.length===CONFIG.CODE_DIGITS)doLink()}});
window.addEventListener('online',()=>{S.online=true;render()});
window.addEventListener('offline',()=>{S.online=false;render()});

/* ---------- ตัวอย่างบนเครื่อง (ข้อมูลสมมติ) ---------- */
let MOCK=null;
function mockApi(action,d){
  if(!MOCK)MOCK={kids:[],tries:0,used:{}};
  const BANK={'12345678':{id:'T1',nick:'น้องตัวอย่างหนึ่ง',name:'ด.ญ.ตัวอย่างหนึ่ง สมมติ',room:'ป.4',relation:'แม่',teacher:'ครูสมมติ'},'00123456':{id:'T2',nick:'น้องตัวอย่างสอง',name:'ด.ช.ตัวอย่างสอง สมมติ',room:'ป.2',relation:'พ่อ',teacher:'ครูสมมติ'}};
  return new Promise((res,rej)=>setTimeout(()=>{
    const fail=(code,msg)=>{const e=new Error(msg);e.code=code;rej(e)};
    if(/off=1/.test(location.search))return fail('APP_OFF','ระบบยังไม่เปิดใช้งาน');
    if(action==='me'){return MOCK.kids.length?res({me:{kids:MOCK.kids}}):fail('NOT_LINKED','ยังไม่ได้ผูก')}
    if(action==='link'){
      if(typeof d.code!=='string'||!/^\d{8}$/.test(d.code))return fail('BAD_INPUT','กรุณากรอกรหัสตัวเลข 8 หลัก');
      if(MOCK.tries>=5)return fail('TOO_MANY','กรอกผิดหลายครั้ง กรุณารอสักครู่');
      const k=BANK[d.code];
      if(!k||MOCK.used[d.code]){MOCK.tries++;return fail('BAD_CODE','รหัสนี้ใช้ไม่ได้ กรุณาตรวจรหัส หรือติดต่อโรงเรียน')}
      MOCK.used[d.code]=1;MOCK.kids.push(Object.assign({linked_at:'2026-11-03 08:10'},k));
      return res({kid:{nick:k.nick,name:k.name,room:k.room},already:false});
    }
    fail('UNKNOWN_ACTION','ไม่รู้จักคำสั่ง');
  },120));
}

function fatal(h,msg,retry){$('#boot').hidden=false;$('#app').hidden=true;$('#boot').innerHTML='<div class="card" style="max-width:420px;margin:18vh auto 0;text-align:center"><h2>'+esc(h)+'</h2><p class="sub">'+esc(msg)+'</p>'+(retry?'<button class="bn pri wide" onclick="location.reload()">ลองใหม่</button>':'')+'</div>'}
async function start(){
  if(!PREVIEW){
    window.__qpStage='liff';
    try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return fatal('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message,true)}
    window.__qpStage='login';
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  }
  window.__qpStage='api';
  try{await loadMe()}catch(e){
    if(e.code==='NO_API')return fatal('ยังไม่ได้ตั้งค่า API_URL',e.message,false);
    if(e.code==='APP_OFF')return fatal('ระบบยังไม่เปิดใช้งาน','โรงเรียนยังไม่เปิดให้ผู้ปกครองใช้งาน กรุณารอประกาศจากโรงเรียน',false);
    return fatal('เปิดหน้านี้ไม่สำเร็จ',errText(e),true);
  }
  window.__qpStage='render';
  S.focus=true;$('#boot').hidden=true;$('#app').hidden=false;render();
}
start().catch(e=>{if(window.qpFail)window.qpFail(window.__qpStage,e,false)});
})();
</script>
