<style>
/* หน้าตารุ่น 1.1 · โทนม่วงคราม การ์ดขาวขอบมน · มือถือ <1000px / คอมพิวเตอร์มีเมนูซ้าย */
:root{
  --bg:#F3F4FB; --bg-top:#ECEBFF; --card:#FFFFFF; --soft:#F2F3F9; --line:#E7E9F3; --ink:#1B1F3B; --muted:#6B7092; --faint:#A3A7C2;
  --pri:#5B5BF0; --pri2:#8B6CF7; --pri-soft:#ECEBFE; --on-pri:#FFFFFF; --navy:#1E2341; --navy2:#2C3263;
  --ok:#1E9E66; --ok-bg:#E2F6EC; --warn:#C27803; --warn-bg:#FFF1D9; --bad:#E04850; --bad-bg:#FDE8E9;
  --t-c:#5B5BF0; --t-bg:#ECEBFE; --b-c:#E9820C; --b-bg:#FFF0DC; --s-c:#11A188; --s-bg:#DDF5EF; --p-c:#E0498D; --p-bg:#FDE6F0; --h-c:#2C8CE6; --h-bg:#E2F0FD; --g-c:#5D6385; --g-bg:#EEF0F7;
  --shadow:0 8px 28px rgba(44,48,110,.07),0 1px 2px rgba(44,48,110,.04);
  --f:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif; --fh:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) no-repeat;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:23px;letter-spacing:-.01em} h2{font-size:18px} h3{font-size:15.5px}
p{margin:0}
a{color:var(--pri)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 10px}
.sec h3{font-size:16px}
.sec button{border:0;background:none;color:var(--pri);font-size:13.5px;font-weight:500;padding:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.pri{background:var(--pri-soft);color:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:13px 16px;font-size:15.5px;border-radius:16px}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.c-t{background:var(--t-bg);color:var(--t-c)} .c-b{background:var(--b-bg);color:var(--b-c)} .c-s{background:var(--s-bg);color:var(--s-c)} .c-p{background:var(--p-bg);color:var(--p-c)} .c-h{background:var(--h-bg);color:var(--h-c)} .c-g{background:var(--g-bg);color:var(--g-c)} .c-w{background:var(--warn-bg);color:var(--warn)} .c-r{background:var(--bad-bg);color:var(--bad)} .c-o{background:var(--ok-bg);color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:22px}
.list{display:flex;flex-direction:column;gap:10px}
/* แถวงาน */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.task .tx{flex:1;min-width:0}
.task .t1{font-weight:500;display:block}
.task .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.task .chev{color:var(--faint)}
/* ช่องสถิติ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.stat .ic{width:38px;height:38px;border-radius:50%}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
/* ปุ่มด่วน */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);text-align:center;line-height:1.25}
.qa .ic{width:54px;height:54px;border-radius:18px}
.qa .ic svg{width:24px;height:24px}
/* แอป */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.app{border:0;background:none;padding:6px 2px;text-align:center;font-size:12.5px;line-height:1.3;border-radius:14px;font-weight:500}
.app .ic{width:54px;height:54px;border-radius:18px;margin:0 auto 7px}
.app .ic svg{width:25px;height:25px}
.app small{display:block;color:var(--faint);font-size:11.5px;font-weight:400}
.app.off .ic{opacity:.55}
/* ประกาศ */
.ann{border:0;border-radius:18px;padding:14px 16px;background:var(--card);box-shadow:var(--shadow);display:block;width:100%;text-align:left}
.ann .pv{color:var(--muted);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 16px;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);font-weight:500}
/* สวิตช์ แถว ฟอร์ม */
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{left:21px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t2{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font-size:15px;color:var(--ink);text-decoration:none}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:12px}
.mrow .tx{flex:1}
.mrow .chev{color:var(--faint)}
.form{display:grid;gap:14px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:6px;font-weight:500}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);width:100%;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{min-height:120px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;align-items:center;gap:8px}
.check input{width:auto}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.err{font-size:14px;color:var(--bad);background:var(--bad-bg);border-radius:14px;padding:10px 14px}
.credit{font-size:12px;color:var(--faint);text-align:center;padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;max-width:min(92vw,460px);z-index:30;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.body{white-space:pre-wrap;word-wrap:break-word}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.code{font-size:36px;letter-spacing:.2em;font-weight:600;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--pri)}
.copybox{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-input{font-size:30px!important;letter-spacing:.35em;text-align:center;font-weight:600!important}
.overlay{position:fixed;inset:0;background:rgba(20,22,50,.4);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86vh}}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;overflow:hidden;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover}
.bell{position:relative;background:var(--card);border:0;box-shadow:var(--shadow);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center;font-weight:600}
/* การ์ดเด่น */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#4B47C9 100%);box-shadow:0 14px 34px rgba(40,40,120,.22)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,247,.55),rgba(139,108,247,0) 70%)}
.hero .in{position:relative;z-index:1;display:flex;align-items:center;gap:18px}
.hero .k{font-size:13px;opacity:.75}
.hero h2{font-size:19px;margin-top:3px}
.hero .s{font-size:13.5px;opacity:.8;margin-top:4px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .v b{font-size:26px;font-weight:600}
.ring .v small{font-size:12px;opacity:.8}
.hero-ic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.hero-ic svg{width:30px;height:30px}
/* ปฏิทิน */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:var(--shadow)}
.wd{border:0;background:none;border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.wd small{font-size:11.5px;color:var(--muted)}
.wd b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.on{background:var(--pri)}
.wd[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.wd[aria-pressed="true"] small{color:var(--on-pri);opacity:.85}
.wd[aria-pressed="true"] i.on{background:var(--on-pri)}
.ev{display:flex;gap:14px;align-items:stretch}
button.ev{border:0;background:none;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
.ev .c .edit{float:right;color:var(--muted);margin-left:8px}
.ev .d{width:52px;flex:none;text-align:center;padding-top:10px;line-height:1.15}
.ev .d b{display:block;font-size:20px;font-weight:600}
.ev .d span{font-size:12px;color:var(--muted)}
.ev .c{flex:1;border-radius:16px;padding:12px 14px;border-left:4px solid var(--pri);background:var(--pri-soft)}
.ev .c.hol{border-color:var(--bad);background:var(--bad-bg)}
.ev .c.term{border-color:var(--s-c);background:var(--s-bg)}
.ev .c .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
/* โปรไฟล์ */
.prof{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:26px;padding:22px 20px 16px;box-shadow:0 14px 34px rgba(30,35,65,.25)}
.prof .avatar{width:72px;height:72px;font-size:28px;border:3px solid rgba(255,255,255,.25)}
.prof .pst{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 0}
.prof .pst div{text-align:center;border-left:1px solid rgba(255,255,255,.12)}
.prof .pst div:first-child{border-left:0}
.prof .pst b{display:block;font-size:20px;font-weight:600}
.prof .pst span{font-size:12px;opacity:.75}
/* หน้าเข้าสู่ระบบ */
.intro{min-height:100vh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.intro .logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:26px;box-shadow:0 10px 24px rgba(91,91,240,.35)}
.intro h1{font-size:32px;line-height:1.2;margin-top:22px}
.intro h1 em{font-style:normal;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .lead{color:var(--muted);margin-top:10px}
.intro .art{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0;min-height:150px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.center .card{max-width:420px;width:100%}
/* มือถือ / iPad */
.m-shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.m-main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.m-top{display:flex;align-items:center;gap:12px;padding:4px 0 18px}
.m-nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(44,48,110,.08);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.m-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--faint);padding:4px 0;position:relative}
.m-nav button[aria-current="page"]{color:var(--pri);font-weight:600}
.m-nav .fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin:-30px auto 2px;padding:0;justify-content:center;box-shadow:0 10px 22px rgba(91,91,240,.4)}
.m-nav .fab svg{width:26px;height:26px;stroke-width:2.2}
.m-nav .dot{top:-2px;right:calc(50% - 22px)}
/* คอมพิวเตอร์ */
.d-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .lg{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.side .new{margin:0 4px 12px}
.side .nv{display:flex;align-items:center;gap:11px;border:0;background:none;border-radius:14px;padding:9px 10px;text-align:left;font-size:14.5px;color:var(--ink);width:100%}
.side .nv[aria-current="page"]{background:var(--pri-soft);color:var(--pri);font-weight:600}
.side .nv .n{margin-left:auto;font-size:12px;background:var(--bad);color:#fff;border-radius:999px;padding:0 8px;font-weight:600}
.side .grp{font-size:12px;color:var(--faint);padding:16px 10px 5px;font-weight:500}
.side .sq{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.side .sq svg{width:16px;height:16px}
.d-main{padding:28px 34px 40px;min-width:0;max-width:1200px}
.d-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.d-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
h1,h2,h3,.stat .v,.ring .v b,.ev .d b,.prof .pst b,.wd b,.brand b,.code,.intro .logo,.brand .lg,.avatar{font-family:var(--fh)}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}.spin{animation-duration:3s}}

<body>
<div id="app"><div class="center" style="flex-direction:column;gap:14px"><div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#5B5BF0,#8B6CF7);color:#fff;display:flex;align-items:center;justify-content:center;font:600 28px Kanit,sans-serif;box-shadow:0 10px 24px rgba(91,91,240,.35)">Q</div><div class="spin" role="status" aria-label="กำลังโหลด" style="margin:0"></div><p style="color:#6B7092;font-size:14px">กำลังเปิด Q-Kawa…</p></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" hidden></div>

<script>
'use strict';
const ICON={
home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',

cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',

gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
chev:'<path d="M9 6l6 6-6 6"/>',

clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
check:'<path d="M5 12l4 4 10-10"/>',

copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
link:'<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
shield:'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
star:'<path d="M12 4l2.5 5 5.5.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.5-.8z"/>',
flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',

const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${s?` style="width:${s}px;height:${s}px"`:''}>${ICON[n]||''}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const APPS=[
 {key:'teacher',name:'Q-Teacher',c:'t',icon:'badge',sub:'ลงเวลา · ลา'},
 {key:'budget',name:'Q-Budget',c:'b',icon:'coin',sub:'งบ · โครงการ'},
 {key:'student',name:'Q-Student',c:'s',icon:'cap',sub:'นักเรียน'},
 {key:'parent',name:'Q-Parent',c:'p',icon:'fam',sub:'ผู้ปกครอง'}
];
const APP_NAMES={hub:'หน้ากลาง',teacher:'Q-Teacher',budget:'Q-Budget',student:'Q-Student',parent:'Q-Parent'};
const ERR={
 CODE_NOT_FOUND:'ไม่พบรหัสนี้ หรือรหัสถูกใช้ไปแล้ว ตรวจตัวเลขอีกครั้ง',
 CODE_EXPIRED:'รหัสนี้หมดอายุแล้ว ขอรหัสใหม่จาก ผอ.',
 TOO_MANY:'กรอกรหัสผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่',
 LINK_OFF:'ผอ. ยังไม่เปิดการผูกบัญชีสำหรับบุคลากร',
 NETWORK:'เชื่อมต่อไม่ได้ ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่'
};

const S={me:null,home:null,page:'home',anns:null,annFilter:'all',annOn:false,detail:null,cal:null,calDay:null,staff:null,settings:null};
const wide=matchMedia('(min-width:1000px)');
wide.addEventListener('change',()=>render());

/* ---------- เชื่อมหลังบ้าน ---------- */
async function api(action,payload){
  let r;
  try{
    r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,idToken:liff.getIDToken()},payload||{}))});
  }catch(e){ const er=new Error(ERR.NETWORK); er.code='NETWORK'; throw er; }
  let j;
  try{ j=await r.json(); }catch(e){ const er=new Error('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy Apps Script)'); er.code='BAD_RESPONSE'; throw er; }
  if(!j.ok){
    if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN'){ relogin(); }
    const er=new Error(ERR[j.code]||j.error||j.code); er.code=j.code; throw er;
  }
  return j;
}
function relogin(){
  let n=0; try{ n=Number(sessionStorage.getItem('qk_relogin')||0); sessionStorage.setItem('qk_relogin',String(n+1)); }catch(e){}
  if(n>1) return;
  if(liff.isInClient()) location.reload();
  else { try{ liff.logout(); }catch(e){} liff.login({redirectUri:location.href}); }
}

/* ---------- เริ่มต้น ---------- */
async function boot(){
  if(!CONFIG.LIFF_ID||!CONFIG.API_URL) return screen(`<div class="intro" style="min-height:auto;padding:0"><div class="logo">Q</div></div><h2>Q-Kawa Hub</h2><p class="note">ยังไม่ได้ตั้งค่า LIFF_ID หรือ API_URL ในไฟล์ index.html</p>`);
  try{ await liff.init({liffId:CONFIG.LIFF_ID}); }
  catch(e){ return screen(errBox('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message)); }
  if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
  // แสดงข้อมูลครั้งล่าสุดที่เก็บไว้ในเครื่องทันที แล้วค่อยโหลดข้อมูลใหม่ตามมา
  const cached=cacheGet();
  if(cached){ S.home=cached; S.me=cached.me; S.annOn=cached.annOn; S.anns=cached.allAnns||null; S.cal=cached.calendarAll||null; S.stale=true; render(); }
  try{
    await loadHome();   // เรียกหลังบ้านครั้งเดียว (เดิม 2 ครั้ง)
    try{ sessionStorage.removeItem('qk_relogin'); }catch(e){}
  }catch(e){
    if(e.code==='NOT_LINKED'){ cacheClear(); return renderLink(); }
    if(cached){ toast('ยังโหลดข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลครั้งก่อน'); return; }
    screen(errBox('โหลดข้อมูลไม่สำเร็จ',e.message));
  }
}
function cacheKey(){ try{ return 'qk_home_'+((liff.getDecodedIDToken()||{}).sub||''); }catch(e){ return ''; } }
function cacheGet(){ try{ const k=cacheKey(); if(!k) return null; const v=JSON.parse(localStorage.getItem(k)||'null'); return v&&v.me?v:null; }catch(e){ return null; } }
function cacheSet(v){ try{ const k=cacheKey(); if(k) localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function cacheClear(){ try{ const k=cacheKey(); if(k) localStorage.removeItem(k); }catch(e){} }
function screen(html){ document.getElementById('app').innerHTML=`<div class="center"><div class="card stack" style="gap:14px">${html}<p class="credit">ผู้พัฒนา: นายฮาฟีซี อูมา</p></div></div>`; }
function errBox(t,m){ return `<h2 style="text-align:center">${esc(t)}</h2><p class="err">${esc(m)}</p><button class="btn pri block" data-act="reload">ลองใหม่</button>`; }

function introArt(){
  return `<svg viewBox="0 0 280 170" width="280" height="170" aria-hidden="true">
    <defs><linearGradient id="ga" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8B6CF7"/><stop offset="1" stop-color="#5B5BF0"/></linearGradient></defs>
    <circle cx="140" cy="88" r="78" fill="#5B5BF0" opacity=".08"/>
    <rect x="62" y="34" width="156" height="110" rx="18" fill="#fff" stroke="#E7E9F3"/>
    <rect x="76" y="50" width="56" height="8" rx="4" fill="#ECEBFE"/>
    <rect x="76" y="66" width="128" height="30" rx="10" fill="url(#ga)"/>
    <circle cx="96" cy="81" r="8" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="36 50" transform="rotate(-90 96 81)"/>
    <rect x="112" y="76" width="60" height="5" rx="2.5" fill="#fff" opacity=".9"/><rect x="112" y="85" width="40" height="4" rx="2" fill="#fff" opacity=".6"/>
    <rect x="76" y="104" width="38" height="28" rx="9" fill="#DDF5EF"/><rect x="121" y="104" width="38" height="28" rx="9" fill="#FFF0DC"/><rect x="166" y="104" width="38" height="28" rx="9" fill="#FDE6F0"/>
    <rect x="206" y="20" width="52" height="44" rx="12" fill="#fff" stroke="#E7E9F3"/><path d="M218 50v-8M227 50v-14M236 50v-10M245 50v-18" stroke="#5B5BF0" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="96" width="46" height="46" rx="14" fill="#fff" stroke="#E7E9F3"/><path d="M37 119l6 6 12-12" stroke="#11A188" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function renderLink(msg){
  let name=''; try{ name=(liff.getDecodedIDToken()||{}).name||''; }catch(e){}
  document.getElementById('app').innerHTML=`<div class="intro">
    <div class="logo">Q</div>
    <h1>งานโรงเรียน<br><em>ครบ จบ</em><br>ในที่เดียว</h1>
    <p class="lead">ประกาศ งานของฉัน และปฏิทินของโรงเรียนบ้านกาวะ รวมไว้ใน LINE</p>
    <div class="art">${introArt()}</div>
    <form class="form" id="linkForm">
      ${name?`<p class="note">LINE ที่ใช้อยู่: <b>${esc(name)}</b></p>`:''}
      <label>รหัส 6 หลักจาก ผอ. (ใช้ครั้งแรกครั้งเดียว)<input id="code" class="big-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>
      ${msg?`<p class="err">${esc(msg)}</p>`:''}
      <button class="btn dark block" type="submit">เริ่มใช้งาน ${ic('right',18)}</button>
    </form>
    <p class="credit">Q-Kawa · โรงเรียนบ้านกาวะ · ผู้พัฒนา นายฮาฟีซี อูมา<br><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></p>
  </div>`;
  const f=document.getElementById('linkForm');
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const code=document.getElementById('code').value.replace(/\D/g,'');
    const b=f.querySelector('button'); b.disabled=true; b.textContent='กำลังตรวจรหัส…';
    try{
      const r=await api('link',{code});
      S.me=r.me; toast('ผูกบัญชีสำเร็จ ยินดีต้อนรับ '+r.me.call);
      if(r.home) applyHome(r.home); else await loadHome();
    }catch(e){ renderLink(e.message); }
  });
}

async function loadHome(){
  const r=await api('home');
  applyHome(r);
  loadExt();
}
/** ดึงงานจาก Q-Teacher มารวมใน "งานของฉัน" (ถ้าโหลดไม่ได้ ก็ข้ามไป ไม่กระทบหน้ากลาง) */
async function loadExt(){
  if(!S.home||!appReady('teacher')||!CONFIG.TEACHER_API||S.extLoading) return;
  if(S.ext&&Date.now()-(S.extAt||0)<60000) return;
  S.extLoading=true;
  try{
    const r=await fetch(CONFIG.TEACHER_API,{method:'POST',body:JSON.stringify({action:'tasks',idToken:liff.getIDToken()})});
    const j=await r.json();
    if(j.ok){ S.ext=j.tasks; S.extAt=Date.now(); S.teacherToday=j.today; S.home.tasks=S.home.tasks.filter(t=>t.app!=='teacher').concat(j.tasks); cacheSet(S.home); render(); }
  }catch(e){}
  S.extLoading=false;
}
/** ใช้ข้อมูลชุดเดียวกับทุกหน้า: หน้าแรก ประกาศ ปฏิทิน */
function applyHome(r,noRender){
  if(!r) return;
  if(S.ext) r.tasks=r.tasks.filter(t=>t.app!=='teacher').concat(S.ext);
  S.home=r; S.me=r.me; S.annOn=r.annOn; S.stale=false; S.fetchedAt=Date.now();
  if(r.allAnns) S.anns=r.allAnns;
  if(r.calendarAll) S.cal=r.calendarAll;
  cacheSet(r);
  if(!noRender) render();
}

/* ---------- โครงหน้า ---------- */
function canWrite(){ return S.annOn||(S.me&&S.me.isAdmin); }
function adminItems(){ return S.me&&S.me.isAdmin?[{id:'link',label:'ผูกบัญชีบุคลากร',icon:'key',c:'h'},{id:'switch',label:'สวิตช์ฟีเจอร์',icon:'gear',c:'g'}]:[]; }

function render(){
  if(!S.home) return;
  const body=pageBody();
  const el=document.getElementById('app');
  const n=S.home.tasks.length;
  if(wide.matches){
    const items=[{id:'home',label:'หน้าแรก',icon:'home'},{id:'tasks',label:'งานของฉัน',icon:'list',badge:n},{id:'ann',label:'ประกาศ',icon:'mega'},{id:'cal',label:'ปฏิทิน',icon:'cal'},{id:'menu',label:'โปรไฟล์',icon:'user'}];
    const nav=items.map(i=>`<button class="nv" data-go="${i.id}"${S.page===i.id?' aria-current="page"':''}><span class="sq">${ic(i.icon)}</span>${i.label}${i.badge?`<span class="n">${i.badge}</span>`:''}</button>`).join('');
    const appsNav=APPS.map(a=>`<button class="nv" data-app="${a.key}"><span class="sq c-${a.c}">${ic(a.icon)}</span>${a.name}${appReady(a.key)?'':'<span class="pill" style="margin-left:auto">ยังไม่เปิด</span>'}</button>`).join('');
    const adm=adminItems().map(i=>`<button class="nv" data-go="${i.id}"${S.page===i.id?' aria-current="page"':''}><span class="sq c-${i.c}">${ic(i.icon)}</span>${i.label}</button>`).join('');
    el.innerHTML=`<div class="d-shell"><nav class="side" aria-label="เมนูหลัก">
      <div class="brand"><div class="lg">Q</div><div><b>Q-Kawa</b><small>โรงเรียนบ้านกาวะ</small></div></div>
      ${canWrite()?`<button class="btn pri new" data-act="compose">${ic('plus',18)} เขียนประกาศ</button>`:''}
      ${nav}<div class="grp">แอปของโรงเรียน</div>${appsNav}${adm?`<div class="grp">ผู้ดูแลระบบ</div>${adm}`:''}
      <div style="flex:1"></div><p class="credit">ผู้พัฒนา: นายฮาฟีซี อูมา</p></nav>
      <main class="d-main">${body}</main></div>`;
  }else{
    const cur=S.page==='tasks'?'home':['link','switch'].includes(S.page)?'menu':S.page;
    const b=(id,label,icon)=>`<button data-go="${id}"${cur===id?' aria-current="page"':''}>${ic(icon,22)}${label}</button>`;
    el.innerHTML=`<div class="m-shell"><main class="m-main">${body}</main>
      <nav class="m-nav" aria-label="เมนูหลัก">${b('home','หน้าแรก','home')}${b('ann','ประกาศ','mega')}
        <button class="fab" data-act="compose" aria-label="เขียนประกาศ">${ic('plus')}</button>
        ${b('cal','ปฏิทิน','cal')}${b('menu','โปรไฟล์','user')}</nav></div>`;
  }
}
function avatar(){ const m=S.me; return `<div class="avatar">${m.picture?`<img src="${esc(m.picture)}" alt="">`:esc((m.name.replace(/^(นาย|นางสาว|นาง)/,'')||'?').charAt(0))}</div>`; }
function rolesText(){ const r=S.me.roles.filter(x=>x!=='ครู'); return r.length?r.join(' · '):(S.me.roles[0]||S.me.position||''); }
function appReady(k){ return !!(S.home.apps[k]&&CONFIG.APP_URLS[k]); }

function pageBody(){
  switch(S.page){
    case 'tasks': return pageTasks();
    case 'ann': return S.detail?pageAnnDetail():pageAnn();
    case 'cal': return pageCal();
    case 'menu': return pageMenu();
    case 'link': return pageLinkAdmin();
    case 'switch': return pageSwitch();
    default: return pageHome();
  }
}
function head(title,sub,extra,backTo){
  return `<div class="${wide.matches?'d-head':'m-top'}">${backTo?`<button class="back" data-go="${backTo}" aria-label="ย้อนกลับ">${ic('left')}</button>`:''}<div style="flex:1;min-width:0"><h1>${title}</h1>${sub?`<p style="color:var(--muted);font-size:14px;margin-top:2px">${sub}</p>`:''}</div>${extra||''}</div>`;
}

/* ---------- วันที่ ---------- */
function d8(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function thDate(s,opt){ try{ return d8(s).toLocaleDateString('th-TH',opt||{day:'numeric',month:'short',year:'2-digit'}); }catch(e){ return s; } }
function thDT(s){ if(!s) return ''; return thDate(s)+(s.length>10?' '+s.slice(11,16)+' น.':''); }
function daysBetween(a,b){ return Math.round((d8(b)-d8(a))/864e5); }
function greet(){ const h=new Date().getHours(); return h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น'; }

/* ---------- ชิ้นส่วน ---------- */
function ring(pct,big,small){
  const r=38,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring"><svg viewBox="0 0 92 92"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="v"><b>${big}</b><small>${small}</small></div></div>`;
}
function taskRow(t){
  const map={ack:['mega','c-h','pri'],approve:['check','c-w','warn'],link:['key','c-g',''],pending:['clock','c-w','warn'],checkin:['clock','c-t','pri'],'leave.hr':['check','c-w','warn'],'leave.dir':['check','c-w','warn'],'out.dir':['check','c-w','warn'],'out.sub':['refresh','c-p','warn'],mysub:['refresh','c-p',''],sub:['refresh','c-p','warn'],jan:['list','c-b','warn'],rate:['star','c-w',''],emg:['flag','c-r','bad'],work:['list','c-t',''],sup:['user','c-s',''],'leave.wait':['clock','c-g','']};
  const [icn,col,pc]=map[t.type]||['list','c-g',''];
  return `<button class="task" data-task="${esc(t.type)}" data-id="${esc(t.id||'')}" data-tapp="${esc(t.app||'')}"><span class="ic ${col}">${ic(icn)}</span><span class="tx"><span class="t1">${esc(t.title)}</span><span class="t2">${esc(t.sub||'')}</span></span><span class="pill ${pc}">${esc(APP_NAMES[t.app]||'')}</span></button>`;
}
function annCard(a){
  const pills=[];
  if(a.pinned) pills.push(`<span class="pill pri">${ic('tack',12)} ปักหมุด</span>`);
  if(a.status==='รออนุมัติ') pills.push('<span class="pill warn">รออนุมัติ</span>');
  if(a.status==='ไม่อนุมัติ') pills.push('<span class="pill bad">ไม่อนุมัติ</span>');
  if(a.status==='ยกเลิก') pills.push('<span class="pill bad">ยกเลิกแล้ว</span>');
  if(a.expired) pills.push('<span class="pill">หมดอายุ</span>');
  if(a.canAck) pills.push(a.acked?'<span class="pill ok">รับทราบแล้ว</span>':'<span class="pill bad">ยังไม่รับทราบ</span>');
  return `<button class="ann" data-ann="${esc(a.id)}"><h3>${esc(a.title)}</h3><p class="pv">${esc(a.body_th)}</p>
    <div class="meta">${pills.join('')}<span>${esc(a.audienceLabel)}</span><span>${esc(a.author)}</span><span>${esc(thDT(a.created_at))}</span></div></button>`;
}
function evRow(c){
  const d=d8(c.date);
  const cls=c.kind==='holiday'?' hol':c.kind==='term'?' term':'';
  const kind=c.kind==='holiday'?'วันหยุด':c.kind==='term'?'ภาคเรียน':(c.src?'กิจกรรม · จากประกาศ':'กิจกรรม');
  const canEd=c.kind==='event'&&!c.src&&S.me&&S.me.canEditCal;
  const attrs=c.kind!=='event'?'':c.src?`data-ann="${esc(c.src)}"`:canEd?`data-ev="${esc(c.id)}" data-evdate="${esc(c.date)}" data-evtitle="${esc(c.title)}" data-evkey="${esc(c.key||'')}"`:'';
  const tag=attrs?'button':'div';
  return `<${tag} class="ev" ${attrs}><div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString('th-TH',{month:'short'})}</span></div>
    <div class="c${cls}">${canEd?`<span class="edit">${ic('pen',16)}</span>`:''}<div style="font-weight:500">${esc(c.title)}</div><div class="t2">${esc(thDate(c.date,{weekday:'long'}))} · ${kind}</div></div></${tag}>`;
}
function eventForm(ev){
  const today=S.home.today.date;
  const date=ev?ev.date:(S.calDay||today);
  modal(`<form class="form" id="evForm">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">${ev?'แก้ไขกิจกรรม':'เพิ่มกิจกรรม'}</h2><button type="button" class="btn sm" data-act="close">ปิด</button></div>
    <label>วันที่<input type="date" name="date" required value="${esc(date)}"></label>
    <label>ชื่อกิจกรรม<input name="title" maxlength="120" required value="${ev?esc(ev.title):''}" placeholder="เช่น ประชุมครูประจำเดือน"></label>
    <p class="note">กิจกรรมจะแสดงในปฏิทินของบุคลากรทุกคน · ถ้าต้องการให้ครูกด "รับทราบ" ด้วย ให้เขียนเป็นประกาศและใส่วันที่กิจกรรมแทน</p>
    <p class="err" id="evErr" hidden></p>
    <button class="btn pri block" type="submit">${ev?'บันทึกการแก้ไข':'เพิ่มลงปฏิทิน'}</button>
    ${ev?'<button type="button" class="btn bad block" id="evDel">ลบกิจกรรมนี้</button>':''}
  </form>`);
  const f=document.getElementById('evForm');
  const fail=(e,b,label)=>{ const er=document.getElementById('evErr'); er.hidden=false; er.textContent=e.message; if(b){b.disabled=false; b.textContent=label;} };
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const data={date:f.date.value,title:f.title.value};
    const b=f.querySelector('button[type=submit]'); const label=b.textContent; b.disabled=true; b.textContent='กำลังบันทึก…';
    try{
      const r=ev?await api('cal.update',{id:ev.id,orig:ev,data}):await api('cal.add',{data});
      closeModal(); toast(ev?'แก้ไขกิจกรรมแล้ว':'เพิ่มกิจกรรมแล้ว'); S.calDay=null; applyHome(r.home);
    }catch(err){ fail(err,b,label); }
  });
  const del=document.getElementById('evDel');
  if(del) del.addEventListener('click',async()=>{
    if(!confirm('ลบกิจกรรม "'+ev.title+'" ?\nจะหายจากปฏิทินของทุกคน')) return;
    del.disabled=true; del.textContent='กำลังลบ…';
    try{ const r=await api('cal.delete',{id:ev.id,orig:ev}); closeModal(); toast('ลบกิจกรรมแล้ว'); applyHome(r.home); }
    catch(err){ fail(err,del,'ลบกิจกรรมนี้'); }
  });
}
function annOffNote(){ return (!S.annOn&&S.me.isAdmin)?`<p class="note warn">ระบบประกาศยังปิดอยู่ บุคลากรอื่นยังไม่เห็น เปิดได้ที่ "สวิตช์ฟีเจอร์"</p>`:''; }

function pageHome(){

  else if(t.term.next){
    const left=Math.max(0,daysBetween(t.date,t.term.next));

    <button class="stat" data-go="cal"><span class="ic c-s">${ic('cal',18)}</span><span><span class="k">กิจกรรม 45 วัน</span><span class="v" style="display:block">${(h.calendar||[]).length}</span></span></button>
    <button class="stat" data-go="cal"><span class="ic c-r">${ic('sun',18)}</span><span><span class="k">วันหยุดถัดไป</span><span class="v" style="display:block;font-size:16px">${nextHol?esc(thDate(nextHol.date,{day:'numeric',month:'short'})):'–'}</span></span></button>
  </div>`;

  const qs=[];
  if(canWrite()) qs.push(['compose','เขียนประกาศ','plus','t',1]);
  qs.push(['ann','ประกาศ','mega','h']);
  qs.push(['cal','ปฏิทิน','cal','s']);
  if(m.isAdmin){ qs.push(['link','ผูกบัญชี','key','b']); qs.push(['switch','สวิตช์','gear','p']); }
  else qs.push(['tasks','งานของฉัน','list','b']);
  const quick=`<section><div class="sec"><h3>เมนูด่วน</h3></div><div class="quick">${qs.slice(0,4).map(([id,l,i,c,act])=>`<button class="qa" ${act?'data-act':'data-go'}="${id}"><span class="ic c-${c}">${ic(i)}</span>${l}</button>`).join('')}</div></section>`;

  const tasks=`<section><div class="sec"><h3>สิ่งที่ต้องดำเนินการ</h3>${h.tasks.length?'<button data-go="tasks">ดูทั้งหมด</button>':''}</div>
    <div class="list">${h.tasks.length?h.tasks.slice(0,3).map(taskRow).join(''):`<div class="task"><span class="ic c-o">${ic('checkc')}</span><span class="tx"><span class="t1">ไม่มีงานค้าง</span><span class="t2">เยี่ยมมาก ทุกอย่างเรียบร้อย</span></span></div>`}</div></section>`;
  const apps=`<section><div class="sec"><h3>แอปของโรงเรียน</h3></div><div class="card"><div class="apps">${APPS.map(a=>`<button class="app${appReady(a.key)?'':' off'}" data-app="${a.key}"><span class="ic c-${a.c}">${ic(a.icon)}</span>${a.name}<small>${appReady(a.key)?esc(a.key==='teacher'&&S.teacherToday?(S.teacherToday.in?'มา '+S.teacherToday.in:'ยังไม่ลงเวลา'):a.sub):'ยังไม่เปิด'}</small></button>`).join('')}</div></div></section>`;
  const anns=(S.annOn||m.isAdmin)?`<section><div class="sec"><h3>ประกาศล่าสุด</h3><button data-go="ann">ดูทั้งหมด</button></div><div class="list">${annOffNote()}

  const cal=`<section><div class="sec"><h3>เร็ว ๆ นี้</h3><button data-go="cal">ปฏิทิน</button></div><div class="list">${h.calendar.length?h.calendar.slice(0,4).map(evRow).join(''):'<p class="note">ไม่มีกิจกรรมใน 45 วันข้างหน้า</p>'}</div></section>`;

function pageAnn(){
  if(!S.anns){ loadAnns(); return head('ประกาศ')+'<div class="spin"></div>'; }
  const m=S.me, f=S.annFilter;
  const chips=[['all','ทั้งหมด'],['unread','ยังไม่รับทราบ'],['pending','รออนุมัติ'],['mine','ของฉัน']];
  const list=S.anns.filter(a=>f==='all'?a.status==='เผยแพร่'||a.mine||m.isAdmin:f==='unread'?(a.canAck&&!a.acked):f==='pending'?a.status==='รออนุมัติ':a.mine);
  const btn=(canWrite()&&wide.matches)?`<button class="btn pri" data-act="compose">${ic('plus',16)} เขียนประกาศ</button>`:'';
  return head('ประกาศ','ประกาศกลางของโรงเรียน',btn)+`<div class="stack" style="gap:16px">${annOffNote()}
    ${!S.annOn&&!m.isAdmin?'<p class="note">ระบบประกาศยังไม่เปิดใช้</p>':''}
    <div class="chips" role="group" aria-label="กรองประกาศ">${chips.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
    <div class="list">${list.length?list.map(annCard).join(''):'<p class="note">ไม่มีประกาศในหมวดนี้</p>'}</div></div>`;
}

function composeForm(edit){
  const m=S.me; const E=edit||null;
  const rooms=S.home.rooms||[];
  const opts=[['staff','บุคลากร'],['all','ทุกคน (บุคลากร + ผู้ปกครอง)'],['parents','ผู้ปกครองทั้งโรงเรียน']].concat(rooms.map(r=>[r.room_id,'ผู้ปกครอง '+r.grade]));
  const today=S.home.today.date;
  const v=k=>E?esc(E[k]||''):'';
  modal(`<form class="form" id="annForm">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">${E?'แก้ไขประกาศ':'เขียนประกาศ'}</h2><button type="button" class="btn sm" data-act="close">ปิด</button></div>

    `<label>ผู้อ่าน<select name="audience" id="aud">${opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label>
    <p class="note" id="audNote"></p>`}
    <label>หัวเรื่อง<input name="title" maxlength="150" required value="${v('title')}"></label>
    <label>เนื้อหาภาษาไทย<textarea name="body_th" maxlength="5000" required>${v('body_th')}</textarea></label>

    <label>แสดงถึงวันที่<input type="date" name="expires_on" value="${v('expires_on')}"></label></div>

    <button class="btn pri block" type="submit">${E?'บันทึกการแก้ไข':'ส่งประกาศ'}</button>
  </form>`);
  const aud=document.getElementById('aud');
  const note=()=>{ if(!aud) return; const v=aud.value; const school=['staff','parents','all'].includes(v);
    document.getElementById('audNote').textContent = school&&!m.canPublishSchool ? 'ประกาศถึงทั้งโรงเรียน ต้องรอ ผอ. อนุมัติก่อนเผยแพร่' : 'เผยแพร่ทันที'+(v==='staff'||v==='all'?' · บุคลากรกด "รับทราบ" ได้':''); };
  if(aud) aud.addEventListener('change',note); note();
  const f=document.getElementById('annForm');
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const fd=new FormData(f); const data=Object.fromEntries(fd.entries()); data.pinned=!!fd.get('pinned');
    const b=f.querySelector('button[type=submit]'); b.disabled=true; b.textContent='กำลังบันทึก…';
    try{
      if(E){
        const r=await api('announce.update',{id:E.id,data});
        closeModal(); toast('บันทึกการแก้ไขแล้ว');
        S.page='ann'; S.detail=E.id; applyHome(r.home); return;
      }
      const r=await api('announce.create',{data});
      closeModal(); toast(r.announcement.status==='เผยแพร่'?'เผยแพร่ประกาศแล้ว':'ส่งให้ ผอ. อนุมัติแล้ว');
      S.page='ann'; S.detail=null; applyHome(r.home);
    }catch(e){ const er=document.getElementById('annErr'); er.hidden=false; er.textContent=e.message; b.disabled=false; b.textContent=E?'บันทึกการแก้ไข':'ส่งประกาศ'; }
  });
}

/* ---------- ปฏิทิน ---------- */
function pageCal(){
  if(!S.cal){ api('calendar').then(r=>{S.cal=r.calendar;render();}).catch(e=>toast(e.message)); return head('ปฏิทินโรงเรียน')+'<div class="spin"></div>'; }
  const today=d8(S.home.today.date);
  const has={}; S.cal.forEach(c=>{has[c.date]=true;});
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(today); d.setDate(d.getDate()+i); days.push(d); }
  const week=`<div class="week" role="group" aria-label="7 วันข้างหน้า">${days.map(d=>{const k=ymd(d);
    return `<button class="wd" data-day="${k}" aria-pressed="${S.calDay===k}"><small>${d.toLocaleDateString('th-TH',{weekday:'short'})}</small><b>${d.getDate()}</b><i class="${has[k]?'on':''}"></i></button>`;}).join('')}</div>`;
  const list=S.calDay?S.cal.filter(c=>c.date===S.calDay):S.cal;
  const label=S.calDay?thDate(S.calDay,{weekday:'long',day:'numeric',month:'long'}):'90 วันข้างหน้า';
  const monthTxt=today.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const addBtn=S.me.canEditCal?`<button class="btn pri sm" data-act="addEv">${ic('plus',16)} เพิ่มกิจกรรม</button>`:'';
  return head('ปฏิทิน',monthTxt,addBtn)+`<div class="stack" style="gap:18px">${week}
    <section><div class="sec"><h3>${esc(label)}</h3>${S.calDay?'<button data-day="">ดูทั้งหมด</button>':''}</div>
    <div class="list">${list.length?list.map(evRow).join(''):'<p class="note">ไม่มีรายการ</p>'}</div></section>
    <p class="note" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:var(--pri)">●</b> กิจกรรม</span><span><b style="color:var(--bad)">●</b> วันหยุด</span><span><b style="color:var(--s-c)">●</b> เปิด-ปิดภาคเรียน</span></p>
    ${S.me.canEditCal?'<p class="note">แตะกิจกรรมที่มีรูปดินสอเพื่อแก้ไขหรือลบ · กิจกรรมจากประกาศให้แก้ที่ประกาศ · วันหยุดและวันเปิด-ปิดภาคเรียนแก้ในทะเบียนกลาง (QK-Core)</p>':''}</div>`;
}

/* ---------- ตัวช่วย ---------- */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},3200); }
function modal(html){ const m=document.getElementById('modal'); m.hidden=false; m.innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; }
async function refresh(){ S.staff=null; S.settings=null; try{ await loadHome(); }catch(e){ toast(e.message); } }
function go(p){
  S.page=p; S.detail=null; render(); window.scrollTo(0,0);
  // เปิดหน้าทันทีจากข้อมูลที่มี แล้วค่อยอัปเดตเงียบๆ ถ้าข้อมูลเก่ากว่า 1 นาที
  if(['home','ann','cal','tasks'].includes(p) && Date.now()-(S.fetchedAt||0)>60000 && !S.loading){
    S.loading=true; loadHome().catch(()=>{}).finally(()=>{S.loading=false;});
  } else if(p==='home'||p==='tasks'){ loadExt();
  }
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-go],[data-act],[data-ann],[data-app],[data-task],[data-filter],[data-sw],[data-day],[data-ev]');
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.ev){ eventForm({id:t.dataset.ev,date:t.dataset.evdate,title:t.dataset.evtitle,key:t.dataset.evkey}); return; }
  if(t.dataset.day!==undefined){ S.calDay=(t.dataset.day&&S.calDay!==t.dataset.day)?t.dataset.day:null; render(); return; }
  if(t.dataset.filter){ S.annFilter=t.dataset.filter; render(); return; }
  if(t.dataset.ann){ S.page='ann'; S.detail=t.dataset.ann; if(!S.anns) await loadAnns(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.app){ const k=t.dataset.app; if(appReady(k)) location.href=CONFIG.APP_URLS[k]; else toast(APP_NAMES[k]+' ยังไม่เปิดใช้'); return; }
  if(t.dataset.task){
    const ty=t.dataset.task, id=t.dataset.id;
    if(t.dataset.tapp==='teacher'){ const TAB={'leave.hr':'endorse','leave.dir':'req','out.dir':'req','out.sub':'mysub',mysub:'mysub',sub:'sub',jan:'jan',rate:'fixreq',emg:'count',work:'mytasks',sup:'mydev','leave.wait':'myreq'}; location.href=CONFIG.APP_URLS.teacher+(TAB[ty]?'#tab='+TAB[ty]:''); return; }
    if(ty==='link'){ go('link'); return; }
    if(ty==='approve'){ S.annFilter='pending'; }
    S.page='ann'; S.detail=id||null; if(!S.anns) await loadAnns(); render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.sw){
    const [app,key]=t.dataset.sw.split('|'); const on=t.getAttribute('aria-checked')!=='true';
    t.disabled=true;
    try{ const r=await api('admin.setSetting',{app,key,enabled:on}); const s=S.settings.find(x=>x.app===app&&x.key===key); toast((on?'เปิด ':'ปิด ')+(s?s.name:key)); S.settings=r.settings||S.settings; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='overlay'){ if(ev.target===t) closeModal(); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='reload'){ location.reload(); return; }
  if(act==='refresh'){ await refresh(); toast('โหลดข้อมูลใหม่แล้ว'); return; }
  if(act==='logout'){ cacheClear(); liff.logout(); location.reload(); return; }
  if(act==='back'){ S.detail=null; render(); return; }
  if(act==='compose'){ if(canWrite()) composeForm(); else toast('ระบบประกาศยังไม่เปิดใช้'); return; }
  if(act==='readers'){ showReaders(id); return; }
  if(act==='addEv'){ eventForm(null); return; }
  if(act==='edit'){ const a=(S.anns||[]).find(x=>x.id===id); if(a) composeForm(a); return; }
  if(act==='cancelAnn'){
    const a=(S.anns||[]).find(x=>x.id===id);
    if(!confirm('ยกเลิกประกาศ "'+(a?a.title:id)+'" ?\nครูจะไม่เห็นประกาศนี้อีก และจะเอาออกจากปฏิทิน (ประวัติยังเก็บไว้)')) return;
    t.disabled=true;
    try{ const r=await api('announce.cancel',{id}); toast('ยกเลิกประกาศแล้ว'); S.page='ann'; S.detail=id; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='ack'||act==='approve'||act==='reject'){
    t.disabled=true;
    try{
      const r = act==='ack' ? await api('announce.ack',{id}) : await api('announce.approve',{id,approve:act==='approve'});
      toast(act==='ack'?'รับทราบแล้ว':act==='approve'?'อนุมัติและเผยแพร่แล้ว':'ไม่อนุมัติประกาศนี้');
      const keep=S.detail; S.page='ann'; S.detail=keep; applyHome(r.home);
    }catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='issue'){
    if(!confirm('ออกรหัสผูกบัญชีให้ '+((S.staff.find(s=>s.staff_id===id)||{}).name||id)+' ?\n(รหัสเดิมที่ยังไม่ใช้จะถูกยกเลิก)')) return;
    t.disabled=true;
    try{ const r=await api('admin.issueCode',{staffId:id}); issuedSheet(r); if(r.staff) S.staff=r.staff; render(); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='unlink'){
    const n=(S.staff.find(s=>s.staff_id===id)||{}).name||id;
    if(!confirm('ยกเลิกการผูก LINE ของ '+n+' ?\nเขาจะเข้าแอปไม่ได้จนกว่าจะผูกใหม่ด้วยรหัสใหม่')) return;
    t.disabled=true;
    try{ const r=await api('admin.unlink',{staffId:id}); toast('ยกเลิกการผูกแล้ว'); if(r.staff) S.staff=r.staff; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='copy'){
    const txt=document.getElementById('copyText').textContent;
    try{ await navigator.clipboard.writeText(txt); toast('คัดลอกแล้ว นำไปวางในไลน์ได้เลย'); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('copyText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('กดค้างที่ข้อความแล้วเลือก "คัดลอก"'); }
    return;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

boot();
