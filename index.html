<script>
/* ตัวเฝ้าหน้า: ถ้าค้างที่หน้า "กำลังเปิด…" เกิน 15 วินาที หรือมี error ก่อนหน้าแรกวาดเสร็จ ให้ขึ้นข้อความบอกสาเหตุ + ปุ่มลองใหม่ (ไม่ขึ้นกับสคริปต์หลัก) */
(function(){
  var W=window;W.__qkStage='script';W.__qkErr='';var T0=Date.now();
  var WHY={script:'ไฟล์หน้าเว็บโหลดไม่ครบ หรือสคริปต์ยังไม่เริ่มทำงาน (เน็ตช้า หรือไฟล์ที่ต้องใช้โหลดไม่ได้)',
    liff:'เชื่อมต่อ LINE (LIFF) ไม่สำเร็จหรือช้ามาก',login:'กำลังพาไปล็อกอิน LINE ไม่สำเร็จ',
    cache:'แสดงข้อมูลที่จำไว้ในเครื่องไม่ได้ (แคชเก่าไม่เข้ากับหน้าใหม่)',
    api:'รอหลังบ้าน (Google Apps Script) ตอบ ใช้เวลานานผิดปกติ อาจเป็นเน็ตช้า หรือหลังบ้านกำลังเริ่มทำงาน',
    render:'วาดหน้าจอไม่สำเร็จ (ข้อมูลที่ได้มาวาดไม่ได้)'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function splash(){return !!document.getElementById('qkSplash')}
  W.qkClear=function(){try{var k=[],i;for(i=0;i<localStorage.length;i++){var n=localStorage.key(i);if(n.indexOf('qk_home_')===0)k.push(n)}k.forEach(function(n){localStorage.removeItem(n)})}catch(e){}try{sessionStorage.clear()}catch(e){}location.reload()};
  W.qkFail=function(stage,err,wait){
    var st=stage||W.__qkStage,em=err&&err.message?err.message:(err?String(err):W.__qkErr);
    if(em)W.__qkErr=em;
    var host=document.getElementById('app');if(!host)return;
    
    host.innerHTML='<div class="center" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="max-width:420px;width:100%;background:#fff;color:#1B1F3B;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(44,48,110,.15);font-family:IBM Plex Sans Thai,Tahoma,sans-serif;text-align:center">'
     +'<div style="font-size:2rem">⚠️</div><h2 style="margin:6px 0;font-size:1.15rem">'+(wait?'Q-Kawa เปิดช้ากว่าปกติ':'Q-Kawa เปิดไม่สำเร็จ')+'</h2>'
     +'<p style="margin:6px 0 10px;color:#5E6385;font-size:.92rem">'+esc(WHY[st]||WHY.script)+'</p>'
     +'<p style="margin:0 0 14px;color:#8A8FAE;font-size:.76rem">ขั้นที่ค้าง: '+esc(st)+' · ผ่านมา '+Math.round((Date.now()-T0)/1000)+' วินาที'+(em?'<br>'+esc(em).slice(0,160):'')+'</p>'
     +'<button onclick="location.reload()" style="width:100%;border:0;border-radius:14px;padding:13px;background:#5B5BF0;color:#fff;font:600 1rem inherit;cursor:pointer;margin-bottom:8px">ลองใหม่</button>'
     +'<button onclick="qkClear()" style="width:100%;border:1.5px solid #E7E9F3;border-radius:14px;padding:11px;background:#fff;color:#1B1F3B;font:500 .9rem inherit;cursor:pointer">ล้างข้อมูลที่จำไว้ในเครื่อง แล้วลองใหม่</button>'
     +(wait?'<p style="margin:10px 0 0;color:#8A8FAE;font-size:.76rem">ถ้ารอได้ ปล่อยไว้สักครู่ หน้าจะเปิดเองเมื่อข้อมูลมาถึง</p>':'')+'</div></div>';
  };
  W.addEventListener('error',function(e){W.__qkErr=(e&&e.message)||'error';if(splash())W.qkFail(W.__qkStage,e&&e.error?e.error:{message:e.message},false)});
  W.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;W.__qkErr=(r&&r.message)||String(r||'rejection');if(splash())W.qkFail(W.__qkStage,r,false)});
  setTimeout(function(){if(splash())W.qkFail(W.__qkStage,null,true)},15000);
})();
</script>
<style>
/* หน้าตารุ่น 1.1 · โทนม่วงคราม การ์ดขาวขอบมน · มือถือ <1000px / คอมพิวเตอร์มีเมนูซ้าย */
:root{
  --bg:#F3F4FB; --bg-top:#ECEBFF; --card:#FFFFFF; --soft:#F2F3F9; --line:#E7E9F3; --ink:#1B1F3B; --muted:#6B7092; --faint:#A3A7C2;
  --pri:#5B5BF0; --pri2:#8B6CF7; --pri-soft:#ECEBFE; --on-pri:#FFFFFF; --navy:#1E2341; --navy2:#2C3263;
  --ok:#1E9E66; --ok-bg:#E2F6EC; --warn:#C27803; --warn-bg:#FFF1D9; --bad:#E04850; --bad-bg:#FDE8E9;
  --t-c:#5B5BF0; --t-bg:#ECEBFE; --b-c:#E9820C; --b-bg:#FFF0DC; --s-c:#11A188; --s-bg:#DDF5EF; --p-c:#E0498D; --p-bg:#FDE6F0; --h-c:#2C8CE6; --h-bg:#E2F0FD; --g-c:#5D6385; --g-bg:#EEF0F7;
  --shadow:0 8px 28px rgba(44,48,110,.07),0 1px 2px rgba(44,48,110,.04);
  --f:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif; --fh:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) no-repeat;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:23px;letter-spacing:-.01em} h2{font-size:18px} h3{font-size:15.5px}
p{margin:0}
a{color:var(--pri)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 10px}
.sec h3{font-size:16px}
.sec button{border:0;background:none;color:var(--pri);font-size:13.5px;font-weight:500;padding:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.pri{background:var(--pri-soft);color:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:13px 16px;font-size:15.5px;border-radius:16px}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.c-t{background:var(--t-bg);color:var(--t-c)} .c-b{background:var(--b-bg);color:var(--b-c)} .c-s{background:var(--s-bg);color:var(--s-c)} .c-p{background:var(--p-bg);color:var(--p-c)} .c-h{background:var(--h-bg);color:var(--h-c)} .c-g{background:var(--g-bg);color:var(--g-c)} .c-w{background:var(--warn-bg);color:var(--warn)} .c-r{background:var(--bad-bg);color:var(--bad)} .c-o{background:var(--ok-bg);color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:22px}
.list{display:flex;flex-direction:column;gap:10px}
/* แถวงาน */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.task .tx{flex:1;min-width:0}
.task .t1{font-weight:500;display:block}
.task .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.task .chev{color:var(--faint)}
/* ช่องสถิติ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.stat .ic{width:38px;height:38px;border-radius:50%}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
/* ปุ่มด่วน */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);text-align:center;line-height:1.25}
.qa .ic{width:54px;height:54px;border-radius:18px}
.qa .ic svg{width:24px;height:24px}
/* แอป */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.app{border:0;background:none;padding:6px 2px;text-align:center;font-size:12.5px;line-height:1.3;border-radius:14px;font-weight:500}
.app .ic{width:54px;height:54px;border-radius:18px;margin:0 auto 7px}
.app .ic svg{width:25px;height:25px}
.app small{display:block;color:var(--faint);font-size:11.5px;font-weight:400}
.app.off .ic{opacity:.55}
/* ประกาศ */
.ann{border:0;border-radius:18px;padding:14px 16px;background:var(--card);box-shadow:var(--shadow);display:block;width:100%;text-align:left}
.ann .pv{color:var(--muted);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 16px;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);font-weight:500}
/* สวิตช์ แถว ฟอร์ม */
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{left:21px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t2{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font-size:15px;color:var(--ink);text-decoration:none}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:12px}
.mrow .tx{flex:1}
.mrow .chev{color:var(--faint)}
.form{display:grid;gap:14px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:6px;font-weight:500}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);width:100%;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{min-height:120px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;align-items:center;gap:8px}
.check input{width:auto}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.err{font-size:14px;color:var(--bad);background:var(--bad-bg);border-radius:14px;padding:10px 14px}
.credit{font-size:12px;color:var(--faint);text-align:center;padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;max-width:min(92vw,460px);z-index:30;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.body{white-space:pre-wrap;word-wrap:break-word}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.code{font-size:36px;letter-spacing:.2em;font-weight:600;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--pri)}
.copybox{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-input{font-size:30px!important;letter-spacing:.35em;text-align:center;font-weight:600!important}
.overlay{position:fixed;inset:0;background:rgba(20,22,50,.4);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86vh}}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;overflow:hidden;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover}
.bell{position:relative;background:var(--card);border:0;box-shadow:var(--shadow);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center;font-weight:600}
/* การ์ดเด่น */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#4B47C9 100%);box-shadow:0 14px 34px rgba(40,40,120,.22)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,247,.55),rgba(139,108,247,0) 70%)}
.hero .in{position:relative;z-index:1;display:flex;align-items:center;gap:18px}
.hero .k{font-size:13px;opacity:.75}
.hero h2{font-size:19px;margin-top:3px}
.hero .s{font-size:13.5px;opacity:.8;margin-top:4px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .v b{font-size:26px;font-weight:600}
.ring .v small{font-size:12px;opacity:.8}
.hero-ic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.hero-ic svg{width:30px;height:30px}
/* ปฏิทิน */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:var(--shadow)}

/* ---------- เชื่อมหลังบ้าน ---------- */
async function api(action,payload){
  let r;
  try{
    r=await Promise.race([fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,idToken:liff.getIDToken()},payload||{}))}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),40000))]);
  }catch(e){ const to=e&&e.message==='TIMEOUT'; const er=new Error(to?'หลังบ้านไม่ตอบภายใน 40 วินาที ลองใหม่อีกครั้ง':ERR.NETWORK); er.code=to?'TIMEOUT':'NETWORK'; throw er; }
  let j;
  try{ j=await r.json(); }catch(e){ const er=new Error('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy Apps Script)'); er.code='BAD_RESPONSE'; throw er; }
  if(!j.ok){
    if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN'){ relogin(); }
    const er=new Error(ERR[j.code]||j.error||j.code); er.code=j.code; throw er;
  }
  return j;
}
function relogin(){
  let n=0; try{ n=Number(sessionStorage.getItem('qk_relogin')||0); sessionStorage.setItem('qk_relogin',String(n+1)); }catch(e){}
  if(n>1) return;
  if(liff.isInClient()) location.reload();
  else { try{ liff.logout(); }catch(e){} liff.login({redirectUri:location.href}); }
}

/* ---------- เริ่มต้น ---------- */
async function boot(){
  window.__qkStage='liff';
  if(!CONFIG.LIFF_ID||!CONFIG.API_URL) return screen(`<div class="intro" style="min-height:auto;padding:0"><div class="logo">Q</div></div><h2>Q-Kawa Hub</h2><p class="note">ยังไม่ได้ตั้งค่า LIFF_ID หรือ API_URL ในไฟล์ index.html</p>`);
  try{ await liff.init({liffId:CONFIG.LIFF_ID}); }
  catch(e){ return screen(errBox('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message)); }
  window.__qkStage='login';
  if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
  // แสดงข้อมูลครั้งล่าสุดที่เก็บไว้ในเครื่องทันที แล้วค่อยโหลดข้อมูลใหม่ตามมา
  const cached=cacheGet();
  window.__qkStage='cache';
  let cacheOk=!!cached;
  if(cached){
    try{ S.home=cached; S.me=cached.me; S.annOn=cached.annOn; S.anns=cached.allAnns||null; S.cal=cached.calendarAll||null; S.stale=true; render(); }
    catch(e){ /* แคชเก่าวาดไม่ได้: ทิ้งแคช แล้วโหลดข้อมูลสดแทน (กันค้างที่หน้าเปิดแอป) */
      cacheOk=false; window.__qkErr='cache: '+(e&&e.message); cacheClear(); S.home=null; S.me=null; S.anns=null; S.cal=null; S.stale=false; }
  }
  window.__qkStage='api';
  try{
    await loadHome();   // เรียกหลังบ้านครั้งเดียว (เดิม 2 ครั้ง)
    try{ sessionStorage.removeItem('qk_relogin'); }catch(e){}
  }catch(e){
    if(e.code==='NOT_LINKED'){ cacheClear(); return renderLink(); }
    if(cacheOk){ toast('ยังโหลดข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลครั้งก่อน'); return; }
    screen(errBox('โหลดข้อมูลไม่สำเร็จ',e.message));
  }
}
function cacheKey(){ try{ return 'qk_home_'+((liff.getDecodedIDToken()||{}).sub||''); }catch(e){ return ''; } }
function cacheGet(){ try{ const k=cacheKey(); if(!k) return null; const v=JSON.parse(localStorage.getItem(k)||'null'); return v&&v.me?v:null; }catch(e){ return null; } }
function cacheSet(v){ try{ const k=cacheKey(); if(k) localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function cacheClear(){ try{ const k=cacheKey(); if(k) localStorage.removeItem(k); }catch(e){} }

async function loadHome(){
  const my=++S.seq;
  const r=await api('home');
  if(my!==S.seq) return;          // คำขอเก่าตอบช้า ไม่ให้ทับข้อมูลใหม่
  applyHome(r);
  loadExt();
  loadPraise();
}
/** ดึงงานจาก Q-Teacher มารวมใน "งานของฉัน" · โหลดไม่ได้ก็ไม่กระทบหน้ากลาง */
async function loadExt(force){
  if(!S.home||!appReady('teacher')||!CONFIG.TEACHER_API||S.extLoading) return;
  if(!force&&S.ext&&Date.now()-(S.extAt||0)<60000) return;
  S.extLoading=true; if(!S.ext){ S.extState='loading'; render(); }
  try{
    const r=await fetch(CONFIG.TEACHER_API,{method:'POST',body:JSON.stringify({action:'tasks',idToken:liff.getIDToken()})});
    const j=await r.json();
    if(j.ok){ S.ext=j.tasks; S.extAt=Date.now(); S.extState='ok'; S.home.tasks=S.home.tasks.filter(t=>t.app!=='teacher').concat(j.tasks); cacheSet(S.home); }
    else S.extState='err';
  }catch(e){ S.extState='err'; }
  S.extLoading=false;
  try{ render(); }
  catch(e){ window.__qkErr='render(ext): '+(e&&e.message); S.ext=null; S.extState='err'; S.home.tasks=S.home.tasks.filter(t=>t.app!=='teacher'); cacheSet(S.home);
    try{ render(); }catch(e2){ if(window.qkFail)qkFail('render',e2); } }
}
/** คำชมครูจากระบบ + ดาวจากผู้ปกครอง: ดึงจาก Q-Teacher (ครูที่ทำได้ตามเป้า · ดาวล่าสุด · ดาวสะสมของฉัน) */
let PR=null,PRAT=0,PRLOAD=false;
async function loadPraise(force){
  if(!S.home||!appReady('teacher')||!CONFIG.TEACHER_API||PRLOAD) return;
  if(!force&&PR&&Date.now()-PRAT<60000) return;
  PRLOAD=true;
  try{
    const r=await fetch(CONFIG.TEACHER_API,{method:'POST',body:JSON.stringify({action:'sec',name:'praise',idToken:liff.getIDToken()})});
    const j=await r.json();
    if(j.ok&&j.sec){ PR=j.sec; PRAT=Date.now(); }
  }catch(e){}
  PRLOAD=false;
  try{ render(); }
  catch(e){ window.__qkErr='render(praise): '+(e&&e.message); PR=null; try{ render(); }catch(e2){ if(window.qkFail)qkFail('render',e2); } }
}

function praiseBoard(){

    return `<li><span class="ai" aria-hidden="true">${both?'🏆':'⭐'}</span><span><b>${esc(x.name)}</b> ${both?'มาตรงเวลาและเช็คชื่อกิจกรรมเช้าครบสัปดาห์':x.onTimeAll?'มาตรงเวลาครบสัปดาห์':'เช็คชื่อกิจกรรมเช้าครบสัปดาห์'}</span></li>`; }).join('');
  return (T.length?`<section class="hubb" aria-label="ครูที่ทำได้ตามเป้าวันนี้"><div class="sec" style="margin:0"><h3>ชื่นชมครูวันนี้</h3><span class="t2">ระบบคิดให้อัตโนมัติ</span></div><ul class="achv">${rows}</ul>${T.length>4?`<p class="t2">และอีก ${T.length-4} ท่าน</p>`:''}</section>`:`<section class="hubb" aria-label="ครูที่ทำได้ตามเป้าวันนี้"><div class="sec" style="margin:0"><h3>ชื่นชมครูวันนี้</h3><span class="t2">ระบบคิดให้อัตโนมัติ</span></div><p class="okline">วันนี้ยังไม่มีครูที่ทำได้ตามเป้า พรุ่งนี้เริ่มใหม่ได้</p></section>`)
   +(L?`<section class="starcard" aria-label="ดาวล่าสุดจากผู้ปกครอง"><span class="si" aria-hidden="true">⭐</span><div style="min-width:0"><p class="k">ดาวล่าสุดจากผู้ปกครอง</p><b>${esc(L.name)} ได้รับดาว</b>${L.msg?`<p>"${esc(L.msg)}"</p>`:''}<p class="t2">${esc(L.from)} · ${esc(thDT(L.at))} · ดาวสะสม ⭐ ${L.total}</p></div></section>`:`<section class="starcard" aria-label="ดาวล่าสุดจากผู้ปกครอง"><span class="si" aria-hidden="true">⭐</span><div style="min-width:0"><p class="k">ดาวล่าสุดจากผู้ปกครอง</p><b>ยังไม่มีดาวใหม่</b><p class="t2">เมื่อผู้ปกครองให้ดาว จะแสดงที่นี่</p></div></section>`);
}

function applyHome(r,noRender){
  if(!r) return;
  if(S.ext) r.tasks=r.tasks.filter(t=>t.app!=='teacher').concat(S.ext);
  S.home=r; S.me=r.me; S.annOn=r.annOn; S.stale=false; S.fetchedAt=Date.now();
  if(r.allAnns) S.anns=r.allAnns;
  if(r.calendarAll) S.cal=r.calendarAll;
  cacheSet(r);
  if(!noRender) render();
}

/* ---------- วันที่ ---------- */
function d8(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function thDate(s,opt){ try{ return d8(s).toLocaleDateString('th-TH',opt||{day:'numeric',month:'short',year:'2-digit'}); }catch(e){ return s; } }
function thDT(s){ if(!s) return ''; return thDate(s)+(s.length>10?' '+s.slice(11,16)+' น.':''); }
function daysBetween(a,b){ return Math.round((d8(b)-d8(a))/864e5); }
function greet(){ const h=new Date().getHours(); return h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น'; }

function ring(pct,big,small){
  const r=38,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring"><svg viewBox="0 0 92 92"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="v"><b>${big}</b><small>${small}</small></div></div>`;
}
/** แปลงวันที่ ISO ในข้อความเป็นภาษาไทยสั้น เช่น 22 ต.ค. 69 */
const TH_ISO=s=>String(s==null?'':s).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,m=>thDate(m,{day:'numeric',month:'short',year:'2-digit'}));
/** ไฟจราจร: แดง = ด่วน · เหลือง = ใกล้ครบกำหนด · เขียว = เสร็จแล้ว */
const URGENT_TYPES=['emg','checkin','out.dir','out.sub','mysub'];
const WAIT_TYPES=['leave.wait','pending'];
function taskLevel(t){
  if(t.done) return 'g';
  if(t.wait||WAIT_TYPES.includes(t.type)) return 'p';
  if(URGENT_TYPES.includes(t.type)) return 'r';
  if(t.due){ const d=daysBetween(S.home.today.date,t.due); if(d<=1) return 'r'; if(d<=3) return 'y'; }
  return 'b';
}
function taskRow(t){
  const map={ack:['mega','c-h'],approve:['check','c-w'],link:['key','c-g'],pending:['clock','c-w'],checkin:['clock','c-t'],'leave.hr':['check','c-w'],'leave.dir':['check','c-w'],'out.dir':['check','c-w'],'out.sub':['refresh','c-p'],mysub:['refresh','c-p'],sub:['refresh','c-p'],jan:['list','c-b'],rate:['star','c-w'],emg:['flag','c-r'],notif:['list','c-b'],inbox:['list','c-w'],work:['list','c-t'],sup:['user','c-s'],'leave.wait':['clock','c-g']};
  const [icn,col]=map[t.type]||['list','c-g'];
  const lv=taskLevel(t);
  const src=t.app==='hub'?(SRC[t.type]||'หน้ากลาง'):(APP_NAMES[t.app]||'');
  const due=t.due?' · กำหนด '+thDate(t.due,{day:'numeric',month:'short',year:'2-digit'}):'';
  const inner=`<span class="ic ${col}">${ic(icn)}</span><span class="tx"><span class="t1">${esc(TH_ISO(t.title))}</span><span class="t2">${esc(src)} · ${esc(TH_ISO(t.sub||''))}${esc(due)}</span></span>`
    +(lv==='g'?`<span class="go g">✓ เสร็จแล้ว</span>`:lv==='p'?`<span class="go p">รอผู้อื่น ›</span>`:`<span class="go ${lv}">กดเพื่อทำงานนี้ ›</span>`);
  return t.done?`<div class="task lv-g">${inner}</div>`
    :`<button class="task lv-${lv}" data-task="${esc(t.type)}" data-id="${esc(t.id||'')}" data-tapp="${esc(t.app||'')}">${inner}</button>`;
}
/** ปุ่มลิงก์ในประกาศ: ลิงก์ในรายการ links (ถ้ามี) และลิงก์ไฟล์แนบ (attachments) ที่เป็น https */
function linkBtns(a){
  const ls=(a.links||[]).filter(l=>/^https?:\/\/\S+$/i.test(l.url||''));
  if(a.attachments&&/^https?:\/\/\S+$/i.test(a.attachments)) ls.push({url:a.attachments,label:'เปิดไฟล์แนบ'});
  return ls.length?`<div class="lks">${ls.map(l=>`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span><small style="opacity:.85;font-weight:500">กดลิงก์ &gt;</small> ${esc(l.label||'เปิดลิงก์')}</span>${ic('ext',18)}</a>`).join('')}</div>`:'';
}

/* เวลาละหมาด: คำนวณจากพิกัดโรงเรียน (home.school ← แท็บ settings gps_lat/gps_lng ของ QK-Hub) ด้วยสูตรดาราศาสตร์มาตรฐาน
 * ค่าเริ่มต้น: ซุบฮิ 20° · อิชาอ์ 18° · อัสริแบบชาฟิอี (เงา 1 เท่า) · เขตเวลา +7 — ต้องให้โรงเรียนยืนยันวิธีคำนวณที่ใช้ */
const PRAY_CFG={fajr:20,isha:18,asrFactor:1,tz:7};
function prayerTimes(date,lat,lng){
  const R=Math.PI/180,sin=a=>Math.sin(a*R),cos=a=>Math.cos(a*R),tan=a=>Math.tan(a*R),acos=x=>Math.acos(x)/R,asin=x=>Math.asin(x)/R,atan2=(a,b)=>Math.atan2(a,b)/R,acot=x=>Math.atan(1/x)/R;
  const fa=a=>a-360*Math.floor(a/360), fh=h=>h-24*Math.floor(h/24);
  let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lng/360;
  const sp=t=>{ const D=jd+t-2451545.0,g=fa(357.529+0.98560028*D),q=fa(280.459+0.98564736*D),L=fa(q+1.915*sin(g)+0.020*sin(2*g)),e=23.439-0.00000036*D,RA=fh(atan2(cos(e)*sin(L),cos(L))/15); return {decl:asin(sin(e)*sin(L)),eqt:q/15-RA}; };
  const mid=t=>fh(12-sp(t).eqt);
  const ang=(a,t,ccw)=>{ const dc=sp(t).decl, v=acos((-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat)))/15; return mid(t)+(ccw?-v:v); };
  const asr=(f,t)=>ang(-acot(f+tan(Math.abs(lat-sp(t).decl))),t);
  let T={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for(let i=0;i<2;i++){ const p=k=>T[k]/24; T={fajr:ang(PRAY_CFG.fajr,p('fajr'),true),sunrise:ang(0.833,p('sunrise'),true),dhuhr:mid(p('dhuhr')),asr:asr(PRAY_CFG.asrFactor,p('asr')),sunset:ang(0.833,p('sunset')),isha:ang(PRAY_CFG.isha,p('isha'))}; }
  const adj=PRAY_CFG.tz-lng/15, mins=h=>Math.round((h+adj)*60);
  return [['ซุบฮิ',mins(T.fajr)],['ซุฮรี',mins(T.dhuhr)+1],['อัสริ',mins(T.asr)],['มัฆริบ',mins(T.sunset)+1],['อิชาอ์',mins(T.isha)]];
}
const hhmm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function prayerCard(){
  const sc=S.home&&S.home.school;
  if(!sc) return isDir()?'<section class="pray"><div class="sec"><h3>เวลาละหมาดวันนี้</h3></div><p class="okline">ยังไม่มีพิกัดโรงเรียน · ตั้งค่า GPS ใน Q-Teacher เพื่อแสดงเวลาละหมาด</p></section>':'';
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  const P=prayerTimes(now,sc.lat,sc.lng);
  const nx=P.findIndex(p=>p[1]>cur), tom=nx<0, ni=tom?0:nx;
  const left=P[ni][1]+(tom?1440:0)-cur, lh=Math.floor(left/60), lm=left%60;
  return `<section class="pray" aria-label="เวลาละหมาดวันนี้"><div class="sec"><h3>เวลาละหมาดวันนี้</h3><span class="t2">คำนวณจากพิกัดโรงเรียน</span></div>
   <p class="nxl">ถัดไป: <b>${P[ni][0]}${tom?' (พรุ่งนี้)':''}</b> ${hhmm(P[ni][1])} น. · อีก ${lh?lh+' ชม. ':''}${lm} นาที</p>
   <div class="pray-g">${P.map((p,i)=>`<div class="${i===ni?'nx':(tom||i<ni)?'ps':''}">${p[0]}<b>${hhmm(p[1])}</b></div>`).join('')}</div></section>`;
}

/* ---------- ตัวช่วย ---------- */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},3200); }
function modal(html){ const m=document.getElementById('modal'); m.hidden=false; m.innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; }
async function refresh(){ S.staff=null; S.settings=null; S.line=null; try{ await loadHome(); }catch(e){ toast(e.message); } }
function go(p){
  if(p==='cal'&&S.page!=='cal'){ S.calWin=0; }
  S.page=p; S.detail=null; render(); window.scrollTo(0,0);
  // เปิดหน้าทันทีจากข้อมูลที่มี แล้วค่อยอัปเดตเงียบๆ ถ้าข้อมูลเก่ากว่า 1 นาที
  if(['home','ann','cal','tasks'].includes(p) && Date.now()-(S.fetchedAt||0)>60000 && !S.loading){
    S.loading=true; loadHome().catch(()=>{}).finally(()=>{S.loading=false;});
  } else if(p==='home'||p==='tasks'){ loadExt(); loadPraise();
  } else if(p==='menu'){ loadPraise();
  }
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-go],[data-act],[data-ann],[data-app],[data-task],[data-filter],[data-sw],[data-tf],[data-atab],[data-lcfg],[data-day],[data-ev],[data-win]');
  if(!t) return;
  if(t.dataset.tf){ S.taskApp=t.dataset.tf; render(); return; }
  if(t.dataset.atab){ S.adminTab=t.dataset.atab; render(); return; }
  if(t.dataset.lcfg){
    const k=t.dataset.lcfg, on=t.getAttribute('aria-checked')!=='true'; t.disabled=true;
    try{ const r=await api('admin.setSetting',{app:'hub',key:k,enabled:on}); S.line=r.line||S.line; S.settings=r.settings||S.settings; toast('บันทึกแล้ว'); render(); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.ev){ eventForm({id:t.dataset.ev,date:t.dataset.evdate,title:t.dataset.evtitle,key:t.dataset.evkey}); return; }
  if(t.dataset.win){ S.calWin=Math.max(0,Math.min(2,(S.calWin||0)+Number(t.dataset.win))); render(); return; }
  if(t.dataset.day!==undefined){ S.calDay=(t.dataset.day&&S.calDay!==t.dataset.day)?t.dataset.day:null; render(); return; }
  if(t.dataset.filter){ S.annFilter=t.dataset.filter; render(); return; }
  if(t.dataset.ann){ S.page='ann'; S.detail=t.dataset.ann; if(!S.anns) await loadAnns(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.app){ const k=t.dataset.app; if(appReady(k)) location.href=CONFIG.APP_URLS[k]; else toast(APP_NAMES[k]+' · '+appState(k)); return; }
  if(t.dataset.task){
    const ty=t.dataset.task, id=t.dataset.id;
    if(t.dataset.tapp==='teacher'){ const TAB={'leave.hr':'endorse','leave.dir':'req','out.dir':'req','out.sub':'mysub',mysub:'mysub',sub:'sub',jan:'jan',rate:'fixreq',emg:'count',work:'mytasks',sup:'mydev','leave.wait':'myreq',notif:'mywork',inbox:'tasks',pa:'pachal',eval:'eval'}; location.href=CONFIG.APP_URLS.teacher+(TAB[ty]?'#tab='+TAB[ty]:''); return; }
    if(ty==='link'){ go('link'); return; }
    if(ty==='approve'){ S.annFilter='pending'; }
    S.page='ann'; S.detail=id||null; if(!S.anns) await loadAnns(); render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.sw){
    const [app,key]=t.dataset.sw.split('|'); const on=t.getAttribute('aria-checked')!=='true';
    t.disabled=true;
    try{ const r=await api('admin.setSetting',{app,key,enabled:on}); const s=S.settings.find(x=>x.app===app&&x.key===key); toast((on?'เปิด ':'ปิด ')+(s?s.name:key)); S.settings=r.settings||S.settings; S.line=r.line||S.line; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='overlay'){ if(ev.target===t) closeModal(); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='reload'){ location.reload(); return; }
  if(act==='extRetry'){ loadExt(true); return; }
  if(act==='refresh'){ await refresh(); toast('โหลดข้อมูลใหม่แล้ว'); return; }
  if(act==='logout'){ logoutSheet(); return; }
  if(act==='logoutYes'){ cacheClear(); S.ext=null; liff.logout(); location.reload(); return; }
  if(act==='report'){ reportSheet(); return; }
  if(act==='back'){ S.detail=null; render(); return; }
  if(act==='thanks'){ const w=t.parentNode; for(let k=0;k<10;k++){ const a=k/10*2*Math.PI, r=34+Math.random()*22, e=document.createElement('span'); e.className='st'; e.textContent='★'; e.style.setProperty('--dx',Math.round(Math.cos(a)*r)+'px'); e.style.setProperty('--dy',Math.round(Math.sin(a)*r)+'px'); w.appendChild(e); setTimeout(()=>e.remove(),900); } return; }
  if(act==='compose'){ if(canWrite()) composeForm(); else toast('ระบบประกาศยังไม่เปิดใช้'); return; }
  if(act==='readers'){ showReaders(id); return; }
  if(act==='addEv'){ eventForm(null); return; }
  if(act==='edit'){ const a=(S.anns||[]).find(x=>x.id===id); if(a) composeForm(a); return; }
  if(act==='cancelAnn'){
    const a=(S.anns||[]).find(x=>x.id===id);
    if(!confirm('ยกเลิกประกาศ "'+(a?a.title:id)+'" ?\nครูจะไม่เห็นประกาศนี้อีก และจะเอาออกจากปฏิทิน (ประวัติยังเก็บไว้)')) return;
    t.disabled=true;
    try{ const r=await api('announce.cancel',{id}); toast('ยกเลิกประกาศแล้ว'); S.page='ann'; S.detail=id; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='ack'||act==='approve'||act==='reject'){
    t.disabled=true;
    let rollback=null;
    if(act==='ack'){ const a=(S.anns||[]).find(x=>x.id===id); if(a){
      const prev={acked:a.acked,ackedAt:a.ackedAt,n:a.ackCount,tasks:S.home.tasks};
      a.acked=true; a.ackedAt=S.home.today.date+' '+new Date().toTimeString().slice(0,5); a.ackCount=(a.ackCount||0)+1;
      S.doneTasks=(S.doneTasks||[]).filter(x=>x.id!==id).concat([{type:'ack',id:a.id,title:'รับทราบประกาศ',sub:a.title,app:'hub',done:true}]);
      S.home.tasks=S.home.tasks.filter(x=>!(x.type==='ack'&&x.id===id));
      rollback=()=>{ Object.assign(a,{acked:prev.acked,ackedAt:prev.ackedAt,ackCount:prev.n}); S.home.tasks=prev.tasks; S.doneTasks=S.doneTasks.filter(x=>x.id!==id); };
      render(); } }
    try{
      const r = act==='ack' ? await api('announce.ack',{id}) : await api('announce.approve',{id,approve:act==='approve'});
      toast(act==='ack'?'รับทราบแล้ว':act==='approve'?'อนุมัติและเผยแพร่แล้ว':'ไม่อนุมัติประกาศนี้');
      const keep=S.detail; S.page='ann'; S.detail=keep; applyHome(r.home);
    }catch(e){ if(rollback){ rollback(); render(); } toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='issue'){
    if(!confirm('ออกรหัสผูกบัญชีให้ '+((S.staff.find(s=>s.staff_id===id)||{}).name||id)+' ?\n(รหัสเดิมที่ยังไม่ใช้จะถูกยกเลิก)')) return;
    t.disabled=true;
    try{ const r=await api('admin.issueCode',{staffId:id}); issuedSheet(r); if(r.staff) S.staff=r.staff; render(); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='unlink'){
    const n=(S.staff.find(s=>s.staff_id===id)||{}).name||id;
    if(!confirm('ยกเลิกการผูก LINE ของ '+n+' ?\nเขาจะเข้าแอปไม่ได้จนกว่าจะผูกใหม่ด้วยรหัสใหม่')) return;
    t.disabled=true;
    try{ const r=await api('admin.unlink',{staffId:id}); toast('ยกเลิกการผูกแล้ว'); if(r.staff) S.staff=r.staff; applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='copy'){
    const txt=document.getElementById('copyText').textContent;
    try{ await navigator.clipboard.writeText(txt); toast('คัดลอกแล้ว นำไปวางในไลน์ได้เลย'); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('copyText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('กดค้างที่ข้อความแล้วเลือก "คัดลอก"'); }
    return;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('input',e=>{ if(e.target.id==='annQ'){ S.annQ=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById('annQ'); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(_){} } } });

boot().catch(e=>{ if(window.qkFail)qkFail(window.__qkStage,e); });

</script>
<script>
/* ป็อปอัพแนะนำแอปครั้งแรก: ขึ้นครั้งเดียว (จำใน localStorage) · ไม่แตะโค้ดส่วนอื่นของแอป */
(function(){
  var KEY='qk_welcome_hub_v1';
  try{ if(localStorage.getItem(KEY)) return; }catch(e){ return; }
  var css='.wl-ov{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,22,50,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:wlf .25s ease}'
   +'.wl-card{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:auto;border-radius:28px;background:var(--card,var(--surface,#fff));color:var(--ink,#1B1F3B);box-shadow:0 24px 60px rgba(20,22,60,.35);font-family:var(--f,"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif);animation:wlu .35s cubic-bezier(.2,.8,.2,1)}'
   +'.wl-top{padding:28px 22px 22px;text-align:center;color:#fff;background:linear-gradient(135deg,#1E2341 0%,#2C3263 55%,#4B47C9 100%);border-radius:28px 28px 0 0}'
   +'.wl-logo{width:72px;height:72px;margin:0 auto 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:600 36px/1 Kanit,"IBM Plex Sans Thai",sans-serif;color:#fff;background:linear-gradient(135deg,#5B5BF0,#8B6CF7);box-shadow:0 10px 24px rgba(91,91,240,.5),inset 0 2px 3px rgba(255,255,255,.45)}'
   +'.wl-brand{margin:0;font:500 13px/1.3 inherit;letter-spacing:.14em;opacity:.8}.wl-name{margin:2px 0 4px;font:600 26px/1.2 Kanit,"IBM Plex Sans Thai",sans-serif}.wl-tag{margin:0;font-size:14px;opacity:.85}'
   +'.wl-body{padding:18px 20px 6px}.wl-body h2{margin:0 0 10px;font-size:15px;font-weight:600}'
   +'.wl-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}.wl-list li{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:var(--soft,var(--sunk,#F2F3F9));font-size:14px;line-height:1.4}.wl-list .i{font-size:22px;line-height:1;flex:none}'
   +'.wl-dev{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--pri-soft,var(--accent-soft,#ECEBFE));text-align:center;font-size:13px;color:var(--muted,#6B7092)}.wl-dev b{display:block;font-size:15px;color:var(--ink,#1B1F3B);font-weight:600}'
   +'.wl-act{padding:16px 20px 22px}.wl-btn{width:100%;border:0;border-radius:16px;padding:14px 18px;font:600 16px/1.2 inherit;color:#fff;background:linear-gradient(135deg,#5B5BF0,#8B6CF7);box-shadow:0 8px 20px rgba(91,91,240,.35);cursor:pointer}.wl-btn:focus-visible{outline:3px solid #1B1F3B;outline-offset:2px}'
   +'@keyframes wlf{from{opacity:0}to{opacity:1}}@keyframes wlu{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}'
   +'@media (prefers-reduced-motion:reduce){.wl-ov,.wl-card{animation:none}}@media (max-width:380px){.wl-name{font-size:23px}.wl-top{padding:22px 16px 18px}}';
  function show(){
    if(document.getElementById('wlOv'))return;
    var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    var ov=document.createElement('div');ov.className='wl-ov';ov.id='wlOv';
    ov.innerHTML='<div class="wl-card" role="dialog" aria-modal="true" aria-labelledby="wlT">'
     +'<div class="wl-top"><div class="wl-logo" aria-hidden="true">Q</div><p class="wl-brand">Q-KAWA · โรงเรียนบ้านกาวะ</p><h1 class="wl-name" id="wlT">Q-Kawa Hub</h1><p class="wl-tag">หน้ากลางของโรงเรียนบ้านกาวะ รวมทุกอย่างไว้ในที่เดียว</p></div>'
     +'<div class="wl-body"><h2>แอปนี้ทำอะไรได้บ้าง</h2><ul class="wl-list"><li><span class="i" aria-hidden="true">📢</span><span>ประกาศจากโรงเรียน พร้อมกดรับทราบและดูว่าใครอ่านแล้ว</span></li><li><span class="i" aria-hidden="true">📅</span><span>ปฏิทินโรงเรียน วันหยุด และกำหนดส่งงาน</span></li><li><span class="i" aria-hidden="true">✅</span><span>งานของฉัน: สิ่งที่ต้องรับทราบ อนุมัติ หรือทำวันนี้</span></li><li><span class="i" aria-hidden="true">🧩</span><span>เปิดแอปอื่นของโรงเรียน เช่น Q-Teacher ได้จากหน้านี้</span></li><li><span class="i" aria-hidden="true">🔑</span><span>ผูกบัญชี LINE ด้วยรหัสจาก ผอ. และตั้งค่าสำหรับผู้ดูแล</span></li></ul>'
     +'<div class="wl-dev">พัฒนาโดย<b>นายฮาฟีซี อูมา</b>ผู้อำนวยการโรงเรียนบ้านกาวะ</div></div>'
     +'<div class="wl-act"><button type="button" class="wl-btn" id="wlGo">เริ่มใช้งาน</button></div></div>';
    document.body.appendChild(ov);
    var btn=document.getElementById('wlGo');
    function close(){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}document.removeEventListener('keydown',key);ov.remove()}
    function key(e){if(e.key==='Escape'||e.key==='Enter'&&document.activeElement===btn)close()}
    btn.addEventListener('click',close);document.addEventListener('keydown',key);
    try{btn.focus()}catch(e){}
  }
  if(document.readyState==='complete')setTimeout(show,500);else window.addEventListener('load',function(){setTimeout(show,500)});
})();
</script>
