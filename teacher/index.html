     <div class="fld"><span class="lbl">นับได้ที่จุดรวมพล</span><div class="stepper"><button data-ec="${rm.room_id}:-1" aria-label="ลด">−</button><output class="num">${c}/${T||'?'}</output><button data-ec="${rm.room_id}:1" aria-label="เพิ่ม">+</button></div></div>
     ${c<(T||0)?`<div class="fld"><label for="em1${rm.room_id}">ใครยังไม่พบ (ระบุชื่อ)</label><input type="text" id="em1${rm.room_id}" placeholder="เช่น ด.ช.อาดัม (ไปห้องน้ำ)"></div>`:''}
     <div class="fld"><label for="em2${rm.room_id}">บาดเจ็บ (คน)</label><input type="number" inputmode="numeric" id="em2${rm.room_id}" min="0" value="0"></div>
     <button class="btn big ${c<(T||0)?'red':'good'} wide" data-emgrep="${rm.room_id}">ส่งยอด ${c}/${T||'?'}${c<(T||0)?' · แจ้งยังไม่พบ':' · ครบ'}</button></section>`}).join('');
  if(isDir&&!mine.length)return head+board;
  return head+(forms||'<section class="panel"><p class="sub">ท่านไม่ได้เป็นครูประจำชั้น · ช่วยดูแลจุดรวมพลและแจ้ง ผอ. ถ้าพบนักเรียนที่หลง</p></section>')+board}
function emgHist(H){return H&&H.length?`<section class="panel"><div class="ph"><h2>ประวัติล่าสุด</h2></div><ul class="list">${H.map(h=>`<li><span class="pill ${h.mode==='drill'?'p-warn':'p-bad'}">${h.mode==='drill'?'ซ้อม':'จริง'}</span><div class="main">${esc(h.type)}<div class="sub">${esc(thDT(h.start))} – ${esc((h.end||'').slice(11,16))} น. · รายงาน ${h.rooms} ห้อง · ${h.present}/${h.total} คน</div></div></li>`).join('')}</ul></section>`:''}
function emgText(){const reps=CLASSES.map(([c,t,n,room])=>({c,r:EMG.rep[room]}));
  return`${EMG.mode==='drill'?'[การซ้อม] ':'[เหตุจริง] '}${EMG.type} เริ่ม ${EMG.start} น.\nจุดรวมพล: ${EMG.point||'-'}\nครูประจำชั้นเปิด Q-Teacher รายงานยอดนักเรียนทันที\nรายงานแล้ว ${reps.filter(x=>x.r).length}/${reps.length} ห้อง\nยังไม่รายงาน: ${reps.filter(x=>!x.r).map(x=>x.c).join(', ')||'-'}`}
function actStatus(a){return a.cur<0?['ยังไม่เริ่ม','p-mute']:a.cur>=a.cps.length?['จบกิจกรรม','p-good']:['กำลังดำเนินการ','p-warn']}
const gN=g=>g.students.length||g.count||0;
function actBoard(a){const tot=a.groups.reduce((x,g)=>x+gN(g),0);
  return`<section class="panel"><div class="ph"><h2>${esc(a.name)}</h2><span class="pill ${actStatus(a)[1]}">${actStatus(a)[0]}</span></div>
   <p class="sub">เริ่ม ${thDY(a.start)} · ${a.days} วัน · ${a.places.map((p,i)=>`วันที่ ${i+1}: ${esc(p)}`).join(' · ')}</p>
   <div class="kv"><div><span>ผู้รับผิดชอบ/กลุ่ม</span><b class="num">${a.groups.length}</b></div><div><span>นักเรียนที่มีกลุ่มแล้ว</span><b class="num">${tot}</b></div><div><span>จุดเช็คปัจจุบัน</span><b class="num">${a.cur>=0&&a.cur<a.cps.length?a.cur+1:'–'}/${a.cps.length}</b></div></div>
   <div class="scroll"><div class="tripgrid" style="grid-template-columns:minmax(140px,1.4fr) repeat(${a.cps.length},minmax(58px,1fr))"><span></span>${a.cps.map((s,i)=>`<span class="h" ${i===a.cur?'style="color:var(--accent);font-weight:600"':''}>${i+1}. ${esc(s)}</span>`).join('')}
   ${a.groups.map(g=>`<span><b>${esc(g.name)}</b><br><small class="sub">${esc(nm(g.lead))} · ${gN(g)} คน</small></span>${a.cps.map((c,i)=>{const v=g.checks[i];const n=gN(g);return`<span class="cell ${!n?'':v==null?(i===a.cur?'due':''):v<n?'miss':'ok'}">${!n?'–':v==null?(i===a.cur?'รอ':''):v+'/'+n}</span>`}).join('')}`).join('')}</div></div>
   ${a.groups.filter(g=>g.note).map(g=>`<div class="callout c-warn"><b>${esc(g.name)} ยอดไม่ครบ</b>${esc(g.note)}</div>`).join('')}
   ${ME.isAdmin?`<div class="row">${a.cur<0?`<button class="btn pri" data-actgo="${a.id}">เริ่มกิจกรรม (จุดเช็คแรก)</button>`:a.cur<a.cps.length?`<button class="btn pri" data-actgo="${a.id}">${a.cur+1<a.cps.length?'ไปจุดเช็คถัดไป':'จบกิจกรรม'}</button>`:''}<button class="btn sm danger" data-actdel="${a.id}">ยกเลิกกิจกรรม</button></div>`:''}</section>`}
function actForm(){const d=st.draft2;if(!d.start)d.start=addDays(TODAY_ISO,7);if(!d.rows.length){const T=REAL.filter(s=>s.teacher);d.rows=[{lead:(T[0]||{}).id,name:'กลุ่ม 1',duty:'ดูแลนักเรียนและเช็คยอด'}]}
  return`<section class="panel"><div class="ph"><h2>สร้างกิจกรรมนอกสถานที่</h2><button class="btn sm" data-actnew="0">ปิด</button></div><form class="f" id="actForm">
   <div class="fld"><label for="ac1">ชื่อกิจกรรม</label><input type="text" id="ac1" value="${esc(d.name)}" placeholder="เช่น ทัศนศึกษา ป.4–ป.6" required></div>
   <div class="fgrid"><div class="fld"><label for="ac2">วันเริ่ม</label><input type="date" id="ac2" value="${d.start}"></div><div class="fld"><label for="ac3">จำนวนวัน</label><input type="number" inputmode="numeric" id="ac3" min="1" max="7" value="${d.days}"></div></div>
   <div class="fld"><span class="lbl">สถานที่แต่ละวัน</span><div id="acPlaces" style="display:grid;gap:6px">${placeInputs(d)}</div></div>
   <div class="fld"><label for="ac4">จุดเช็คยอดนักเรียน (บรรทัดละจุด ใส่ ว1/ว2 นำหน้าเพื่อบอกวัน)</label><textarea id="ac4" rows="5">${esc(d.cps)}</textarea></div>
   <div class="fld"><span class="lbl">ผู้รับผิดชอบและหน้าที่</span><div id="acRows" style="display:grid;gap:10px">${dutyRows(d)}</div><div><button type="button" class="btn sm" data-drow="add">+ เพิ่มผู้รับผิดชอบ</button></div></div>
   <div><button class="btn pri" type="submit">สร้างกิจกรรม</button></div></form></section>`}
function placeInputs(d){return Array.from({length:clamp(+d.days||1,1,7)},(_,i)=>`<input type="text" id="acp${i}" value="${esc(d.places[i]||'')}" placeholder="วันที่ ${i+1}: สถานที่" aria-label="สถานที่วันที่ ${i+1}">`).join('')}
function dutyRows(d){const T=REAL.filter(s=>s.teacher);return d.rows.map((r,i)=>`<div class="drow"><div class="fld"><label for="dl${i}">ครู</label><select id="dl${i}">${T.map(s=>`<option value="${s.id}" ${s.id===r.lead?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <div class="fld"><label for="dg${i}">กลุ่ม</label><input type="text" id="dg${i}" value="${esc(r.name)}" placeholder="เช่น รถคันที่ 1"></div>
   <div class="fld dutyfld"><label for="dd${i}">รับผิดชอบอะไร</label><input type="text" id="dd${i}" value="${esc(r.duty)}" placeholder="เช่น ดูแลนักเรียน เช็คยอด"></div>
   <button type="button" class="btn sm danger" data-drow="del:${i}" aria-label="ลบแถว">ลบ</button></div>`).join('')}
function syncDraft(){const d=st.draft2;if(!$('#ac1'))return;d.name=$('#ac1').value;d.start=$('#ac2').value;d.days=+$('#ac3').value||1;d.places=Array.from({length:d.days},(_,i)=>$('#acp'+i)?.value??d.places[i]??'');d.cps=$('#ac4').value;d.rows=d.rows.map((r,i)=>({lead:$('#dl'+i)?.value||r.lead,name:$('#dg'+i)?.value??r.name,duty:$('#dd'+i)?.value??r.duty}))}
const groupOf=(a,sid)=>a.groups.find(g=>g.students.includes(sid));
const STU=()=>(SEC.students||{list:[]}).list;
const STUN=id=>(STU().find(x=>x.id===id)||{name:id}).name;
function pickList(a,g){const q=(st.pq||'').trim(),c=st.pc||'all';const sel=st.pickSel;
  const list=STU().filter(x=>(c==='all'||x.cls===c)&&(!q||x.name.includes(q)));
  return`<div class="kids">${list.map(x=>{const og=groupOf(a,x.id);const other=og&&og.id!==g.id;return`<button class="kid" data-pick="${x.id}" aria-pressed="${!!sel[x.id]}" ${other?'disabled':''}><i></i><span>${esc(x.name)}<small>${esc(x.cls)}${other?' · '+esc(og.name):''}</small></span></button>`}).join('')||'<p class="sub">ไม่พบนักเรียน</p>'}</div>`}
function tripView(){
  const isDir=ME.isAdmin,m=me();
  if(!ACTS.find(a=>a.id===st.act))st.act=ACTS[0]?ACTS[0].id:null;
  const a=ACTS.find(x=>x.id===st.act);
  const cards=ACTS.length?`<div class="actions">${ACTS.map(x=>{const t=x.groups.reduce((s,g)=>s+gN(g),0);return`<button class="actcard" data-act="${x.id}" aria-pressed="${x.id===st.act}"><span class="row between"><b>${esc(x.name)}</b><span class="pill ${actStatus(x)[1]}">${actStatus(x)[0]}</span></span><span class="sub">${thDY(x.start)} · ${x.days} วัน · ${x.groups.length} ผู้รับผิดชอบ · นักเรียน ${t} คน</span></button>`}).join('')}</div>`:empty('ยังไม่มีกิจกรรม');
  if(isDir)return`${st.newAct?actForm():`<div><button class="btn pri" data-actnew="1">+ สร้างกิจกรรมนอกสถานที่</button></div>`}${cards}${a?actBoard(a):''}`;
  const myActs=ACTS.filter(x=>x.groups.some(g=>g.lead===m));
  if(!a)return empty('ยังไม่มีกิจกรรมนอกสถานที่');
  const mine=a.groups.filter(g=>g.lead===m);
  const needStu=mine.length&&mine.some(g=>g.students.length||st.picking===g.id);
  let body='';
  mine.forEach(g=>{const n=gN(g),sel=st.roll[g.id]||{},cnt=g.students.filter(id=>sel[id]).length,started=a.cur>=0&&a.cur<a.cps.length;
    body+=`<section class="panel"><div class="ph"><h2>${esc(g.name)}</h2><span class="pill p-info">${n} คน</span></div><p class="sub">หน้าที่: ${esc(g.duty)}</p>
    ${secBox('students',S=>S.list.length?`<div class="row"><button class="btn ${st.picking===g.id?'pri':''}" data-picking="${g.id}">${st.picking===g.id?'บันทึกรายชื่อ':'จัดการรายชื่อนักเรียนที่ดูแล'}</button>${st.picking===g.id?'<button class="btn" data-pickcancel="1">ยกเลิก</button>':''}</div>`
     :`<form class="row" id="cntForm" data-g="${g.id}"><label class="sub" for="gc${g.id}">ยังไม่มีรายชื่อนักเรียนในระบบ · จำนวนที่ดูแล</label><input type="number" min="0" inputmode="numeric" id="gc${g.id}" value="${g.count||''}" style="width:110px"><button class="btn sm pri" type="submit">บันทึก</button></form>`)}
    ${st.picking===g.id?`<div class="fgrid"><div class="fld"><label for="pq">ค้นหาชื่อ</label><input type="text" id="pq" value="${esc(st.pq||'')}" placeholder="พิมพ์ชื่อนักเรียน"></div><div class="fld"><label for="pc">ชั้น</label><select id="pc"><option value="all">ทั้งโรงเรียน</option>${CLASSES.map(c=>`<option ${st.pc===c[0]?'selected':''}>${esc(c[0])}</option>`).join('')}</select></div></div>
     <div class="row"><button class="btn sm" data-pickall="${g.id}">เลือกทั้งหมดที่แสดง</button><button class="btn sm danger" data-pickclear="${g.id}">ล้างรายชื่อของฉัน</button><span class="num" id="pickN" style="margin-left:auto">${Object.keys(st.pickSel).length} คน</span></div>
     <div id="pickBox" data-g="${g.id}">${pickList(a,g)}</div><p class="note">นักเรียนที่อยู่กลุ่มอื่นแล้วเลือกซ้ำไม่ได้ ป้องกันนับซ้ำ</p>`
     :g.students.length?`<div class="sub">${g.students.slice(0,12).map(id=>esc(STUN(id))).join(', ')}${g.students.length>12?` และอีก ${g.students.length-12} คน`:''}</div>`:''}
    ${started&&n&&st.picking!==g.id?`<div class="callout c-info"><b>จุดเช็คที่ ${a.cur+1}: ${esc(a.cps[a.cur])}</b>${g.checks[a.cur]!=null?'ยืนยันแล้ว '+g.checks[a.cur]+'/'+n:(g.students.length?'แตะชื่อนักเรียนที่อยู่ครบ':'กรอกจำนวนที่นับได้')}</div>
     ${g.students.length?`<div class="row"><button class="btn sm" data-rollall="${g.id}">เลือกทั้งหมด</button><button class="btn sm" data-rollnone="${g.id}">ล้าง</button><span class="num" style="margin-left:auto;font-size:1.1rem">${cnt}/${n}</span></div>
     <div class="kids">${g.students.map(id=>`<button class="kid" data-roll="${g.id}:${id}" aria-pressed="${!!sel[id]}"><i></i><span>${esc(STUN(id))}</span></button>`).join('')}</div>
     <button class="btn big wide ${cnt<n?'red':'good'}" data-rollok="${g.id}">ยืนยันยอด ${cnt}/${n}${cnt<n?' · แจ้งยังไม่ครบ':''}</button>`
     :`<div class="fgrid"><div class="fld"><label for="rn${g.id}">นับได้ (คน)</label><input type="number" inputmode="numeric" min="0" max="${n}" id="rn${g.id}" value="${n}"></div><div class="fld"><label for="rm${g.id}">ใครยังไม่พบ</label><input type="text" id="rm${g.id}" placeholder="ระบุชื่อ (ถ้ามี)"></div></div><button class="btn big wide pri" data-rollnum="${g.id}">ยืนยันยอด</button>`}`:(!started&&n?'<p class="note">กิจกรรมยังไม่เริ่ม เมื่อ ผอ. กดเริ่มแล้วจะมีปุ่มเช็คยอดที่นี่</p>':'')}</section>`});
  if(needStu)ensureSec('students',600000);
  return`${myActs.length?`<div class="actions">${myActs.map(x=>`<button class="actcard" data-act="${x.id}" aria-pressed="${x.id===st.act}"><span class="row between"><b>${esc(x.name)}</b><span class="pill ${actStatus(x)[1]}">${actStatus(x)[0]}</span></span><span class="sub">${x.groups.filter(g=>g.lead===m).map(g=>esc(g.name)).join(', ')}</span></button>`).join('')}</div>`:empty('ท่านยังไม่มีกิจกรรมที่รับผิดชอบ')}${body}${actBoard(a)}`}

/* ---------- พัฒนาครู ---------- */
V.dev=()=>{
  const over=ME.isAdmin||ME.isAcad||ME.isHR,mineOk=ME.isTeacher;
  const view=!mineOk?'all':!over?'mine':st.devView;
  return`<div class="row topacts">${mineOk?`<button class="btn pri" data-devopen="1">${svg('plus','i16')} บันทึกการพัฒนา</button><button class="btn" data-plc="1">${svg('plc','i16')} บันทึก PLC</button>`:''}</div>
   ${st.devOpen?devForm():''}${st.plcOpen?plcForm():''}
   ${mineOk&&over?seg('devView',[['mine','ของฉัน'],['all','ภาพรวมครู']],view):''}
   ${secBox('dev',D=>view==='all'?devAll(D):devMine(D))}`};
function hoursOf(d){return Math.round(((d.train||0)+(d.online||0)+(d.plc||0))*10)/10}
function devTargetTxt(D){return`เป้าหมาย ${D.target} ชั่วโมง/${esc(D.totals.label)}${D.targetSample?' <span class="pill p-warn">ค่าตั้งตัวอย่าง ยังไม่ยืนยัน</span>':''}`}
function devMine(D){
  const d=D.totals.tot[me()]||{train:0,online:0,plc:0,sup:0,ev:0},tot=hoursOf(d);
  const myHelpLog=D.myLog;
  return`<section class="panel"><div class="ph"><h2>ความก้าวหน้าของฉัน</h2><p>${devTargetTxt(D)}</p></div>
   <div class="bigtot"><b class="num">${tot}</b><span>/ ${D.target} ชั่วโมง</span></div><div class="prog"><i style="width:${clamp(tot/D.target*100,0,100)}%"></i></div>
   <div class="kv"><div><span>อบรม/ไปราชการ</span><b class="num">${d.train} ชม.</b></div><div><span>อบรมออนไลน์</span><b class="num">${d.online} ชม.</b></div><div><span>PLC</span><b class="num">${d.plc} ชม.</b></div></div>
   <p class="note">มีหลักฐานแล้ว ${d.ev} จาก ${tot} ชั่วโมง (เกียรติบัตร รายงานหลังอบรม หรือบันทึก PLC) · กิจกรรมเดียวกันไม่นับซ้ำ · ชั่วโมงจากไปราชการนับเมื่อส่งรายงาน ไม่ใช่ตอนอนุมัติ</p></section>
  <section class="panel"><div class="ph"><h2>บันทึกการอบรม</h2><span class="count">${myHelpLog.length}</span></div>
   ${myHelpLog.length?`<ul class="list">${myHelpLog.map(x=>`<li><span class="sw" style="background:${x.kind==='online'?'var(--c-teal)':'var(--c-blue)'}"></span><div class="main">${x.cert?`<a href="${esc(x.cert)}" target="_blank" rel="noopener">${esc(x.t)}</a>`:esc(x.t)}<div class="sub">${thDY(x.d)} · ${x.kind==='online'?'ออนไลน์':'อบรม/ไปราชการ'} · ${x.report?'มีรายงาน':x.cert?'มีเกียรติบัตร':'ยังไม่มีหลักฐาน'}</div></div><span class="num pill p-mute">${x.h} ชม.</span>${x.report||x.ref?'':`<button class="btn sm danger" data-devdel="${x.id}" aria-label="ลบ">ลบ</button>`}</li>`).join('')}</ul>`:empty('ยังไม่มีบันทึก','กด "บันทึกการพัฒนา" ด้านบน')}</section>
  ${linkCard('academic','นิเทศและผลนิเทศ','ย้ายไป Q-Academic แล้ว')}
  <section class="panel"><div class="ph"><h2>PLC ที่เข้าร่วม</h2></div>${plcList(D.plc)}</section>
  <section class="panel"><div class="ph"><h2>แผนพัฒนารายบุคคล (IDP)</h2><button class="btn sm" data-idpopen="1">${st.idpOpen?'ปิด':'+ เป้าหมาย'}</button></div>
    ${st.idpOpen?`<form class="f boxed" id="idpForm"><div class="fld"><label for="ip1">เป้าหมาย</label><input type="text" id="ip1" required placeholder="เช่น ใช้ Phonics ช่วยนักเรียน ป.1"></div><div class="fld"><label for="ip2">สมรรถนะ</label><select id="ip2">${D.compNames.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select></div><div class="fld"><label for="ip3">วิธีพัฒนา</label><input type="text" id="ip3"></div><div class="fld"><label for="ip4">ตัวชี้วัด</label><input type="text" id="ip4"></div><div><button class="btn pri" type="submit">เพิ่ม</button></div></form>`:''}
    ${D.idp.length?D.idp.map(g=>`<div class="card"><b>${esc(g.g)}</b><span class="sub">${esc(D.compNames[g.comp]||'')}${g.act?' · '+esc(g.act):''}</span>${g.ind?`<span class="sub">ตัวชี้วัด: ${esc(g.ind)}</span>`:''}<div class="prog"><i style="width:${g.pct}%"></i></div><div class="row">${[25,50,75,100].map(v=>`<button class="chip" data-idp="${g.id}:${v}" aria-pressed="${g.pct===v}">${v}%</button>`).join('')}<button class="btn sm danger" data-idpdel="${g.id}">ลบ</button></div></div>`).join(''):empty('ยังไม่มีเป้าหมาย')}</section>
  <details class="panel howto"><summary><b>ประเมินสมรรถนะตนเอง 8 ด้าน</b></summary>
   <div class="comp">${D.compNames.map((c,i)=>{const draft=st.compDraft||D.comp.self||[];return`<span>${esc(c)}</span><span class="dotset">${[1,2,3,4,5].map(v=>`<button class="${v<=(draft[i]||0)?'s':''}" data-comp="${i}:${v}" aria-label="${esc(c)} ระดับ ${v}"></button>`).join('')}</span>`}).join('')}</div>
   ${st.compDraft?'<div><button class="btn pri sm" data-compsave="1">บันทึกการประเมินตนเอง</button></div>':''}</details>
  <p class="note">บันทึกโค้ชส่วนตัว (Coaching & Mentoring) แยกจากข้อมูลประเมินทางการ · ยังไม่เปิดใช้</p>`}
function devAll(D){
  const T=REAL.filter(s=>s.teacher).map(s=>({s,d:D.totals.tot[s.id]||{train:0,online:0,plc:0,sup:0,ev:0}})).map(x=>Object.assign(x,{h:hoursOf(x.d)})).sort((a,b)=>b.h-a.h);
  const reach=T.filter(x=>x.h>=D.target).length,avg=T.length?Math.round(T.reduce((a,x)=>a+x.h,0)/T.length*10)/10:0;
  return`<section class="panel"><div class="ph"><h2>ชั่วโมงพัฒนารายบุคคล</h2><p>${devTargetTxt(D)}</p></div>
   <div class="kv"><div><span>เฉลี่ยต่อคน</span><b class="num">${avg} ชม.</b></div><div><span>ถึงเป้าหมาย</span><b class="num">${reach}/${T.length} คน</b></div></div>
   ${isMobile()?`<ul class="slist">${T.map(x=>{const open=st.open['d'+x.s.id];return`<li><button class="srow" data-open="d${x.s.id}" aria-expanded="${!!open}"><span class="main"><b>${esc(x.s.name)}</b><span class="prog thin"><i style="width:${clamp(x.h/D.target*100,0,100)}%"></i></span></span><span class="num t">${x.h}/${D.target}</span></button>${open?`<div class="sdet"><div>อบรม/ไปราชการ ${x.d.train} · ออนไลน์ ${x.d.online} · PLC ${x.d.plc} ชม.</div><div>มีหลักฐาน ${x.d.ev} ชม.</div></div>`:''}</li>`}).join('')}</ul>`

function workDays(a,b,part){if(!a||!b||b<a)return 0;const hol=new Set(B.holidays||[]);if(part&&part!=='เต็มวัน'){const w=d8(a).getDay();return w&&w<6&&!hol.has(a)?.5:0}let n=0;for(let d=d8(a);ymd(d)<=b;d.setDate(d.getDate()+1)){const w=d.getDay();if(w&&w<6&&!hol.has(ymd(d)))n++}return n}

    if(!confirm('บันทึกเกณฑ์ติดตาม? มีผลกับการแสดงผลตั้งแต่ตอนนี้ (ไม่แก้ข้อมูลเดิม)'))return;await act('admin.rules',{data:o},btn)}
  if(f.id==='sfDev'){if(!(+v('#s6')>=0)){toast('กรอกชั่วโมงให้ถูกต้อง');return}await act('admin.rules',{data:{dev_hours_target:v('#s6')}},btn)}
  if(f.id==='sfRounds'){const r=v('#s7').split(/[,\s]+/).filter(Boolean);if(!r.length||!r.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x))){toast('รูปแบบเวลาไม่ถูกต้อง เช่น 20:00, 23:00, 02:00');return}await act('admin.rules',{data:{patrol_rounds:r.join(',')}},btn)}
  if(f.id==='locForm'){await act('loc.add',{data:{name:v('#lc1'),lat:v('#lc2'),lng:v('#lc3'),radius:v('#lc4'),kind:$('input[name="lk"]:checked').value,from:v('#lc5'),to:v('#lc6')}},btn);st.locOpen=false;render()}
  if(f.id==='gpsForm'){if(!confirm('แก้พิกัดจุดหลักของโรงเรียน? มีผลกับการลงเวลาของทุกคน'))return;await act('admin.gps',{data:{lat:v('#lc2'),lng:v('#lc3'),radius:v('#lc4')}},btn);st.gpsOpen=false;render()}
  if(f.id==='qrAddForm'){if(!v('#qa1')){toast('พิมพ์ชื่อจุด');return}await act('admin.qrAdd',{name:v('#qa1')},btn)}
  }catch(er){if(er&&er.message&&!/กำลังบันทึก/.test(er.message)&&!['NETWORK','DUP_REQ'].includes(er.code)&&!er.code)toast(er.message)/* ข้อความจากหลังบ้านแสดงแล้วใน act() · ข้อมูลที่กรอกยังอยู่ */}
});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clockNow()},15000);
/** ตรวจข้อมูลใหม่อัตโนมัติเฉพาะตอนมีเหตุฉุกเฉินและเปิดหน้าเช็คยอดอยู่ (ทุก 30 วินาที) */
setInterval(()=>{if(B&&EMG.on&&st.tab==='count'&&st.countTab==='emg'&&!document.hidden&&!st.dirty)refresh(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&B&&Date.now()-st.fetchedAt>180000)refresh(true)});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='loadYm'){st.loadYm=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='reqQ'){st.reqQ=e.target.value;const pos=e.target.selectionStart;render();const el=$('#reqQ');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='paFy'){st.paFy=Number(e.target.value);render()}});
document.addEventListener('change',e=>{const id=e.target&&e.target.id;if(id==='evRound'){st.evRound=e.target.value;st.evStaff=st.evStaff||'';render()}if(id==='evStaff'){st.evStaff=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='evaRound'){st.evaRound=e.target.value;render()}});
boot().catch(e=>{ if(window.qkFail)qkFail(window.__qkStage,e); });
})();

</script>
<script>
/* ป็อปอัพแนะนำแอปครั้งแรก: ขึ้นครั้งเดียว (จำใน localStorage) · ไม่แตะโค้ดส่วนอื่นของแอป */
(function(){
  var KEY='qk_welcome_teacher_v1';
  try{ if(localStorage.getItem(KEY)) return; }catch(e){ return; }
  var css='.wl-ov{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,22,50,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:wlf .25s ease}'
   +'.wl-card{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:auto;border-radius:28px;background:var(--card,var(--surface,#fff));color:var(--ink,#1B1F3B);box-shadow:0 24px 60px rgba(20,22,60,.35);font-family:var(--f,"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif);animation:wlu .35s cubic-bezier(.2,.8,.2,1)}'
   +'.wl-top{padding:28px 22px 22px;text-align:center;color:#fff;background:linear-gradient(135deg,#1E2341 0%,#2C3263 55%,#4B47C9 100%);border-radius:28px 28px 0 0}'
   +'.wl-logo{width:72px;height:72px;margin:0 auto 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:600 36px/1 Kanit,"IBM Plex Sans Thai",sans-serif;color:#fff;background:linear-gradient(135deg,#5B5BF0,#8B6CF7);box-shadow:0 10px 24px rgba(91,91,240,.5),inset 0 2px 3px rgba(255,255,255,.45)}'
   +'.wl-brand{margin:0;font:500 13px/1.3 inherit;letter-spacing:.14em;opacity:.8}.wl-name{margin:2px 0 4px;font:600 26px/1.2 Kanit,"IBM Plex Sans Thai",sans-serif}.wl-tag{margin:0;font-size:14px;opacity:.85}'
   +'.wl-body{padding:18px 20px 6px}.wl-body h2{margin:0 0 10px;font-size:15px;font-weight:600}'
   +'.wl-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}.wl-list li{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:var(--soft,var(--sunk,#F2F3F9));font-size:14px;line-height:1.4}.wl-list .i{font-size:22px;line-height:1;flex:none}'
   +'.wl-dev{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--pri-soft,var(--accent-soft,#ECEBFE));text-align:center;font-size:13px;color:var(--muted,#6B7092)}.wl-dev b{display:block;font-size:15px;color:var(--ink,#1B1F3B);font-weight:600}'
   +'.wl-act{padding:16px 20px 22px}.wl-btn{width:100%;border:0;border-radius:16px;padding:14px 18px;font:600 16px/1.2 inherit;color:#fff;background:linear-gradient(135deg,#5B5BF0,#8B6CF7);box-shadow:0 8px 20px rgba(91,91,240,.35);cursor:pointer}.wl-btn:focus-visible{outline:3px solid #1B1F3B;outline-offset:2px}'
   +'@keyframes wlf{from{opacity:0}to{opacity:1}}@keyframes wlu{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}'
   +'@media (prefers-reduced-motion:reduce){.wl-ov,.wl-card{animation:none}}@media (max-width:380px){.wl-name{font-size:23px}.wl-top{padding:22px 16px 18px}}';
  function show(){
    if(document.getElementById('wlOv'))return;
    var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    var ov=document.createElement('div');ov.className='wl-ov';ov.id='wlOv';
    ov.innerHTML='<div class="wl-card" role="dialog" aria-modal="true" aria-labelledby="wlT">'
     +'<div class="wl-top"><div class="wl-logo" aria-hidden="true">Q</div><p class="wl-brand">Q-KAWA · โรงเรียนบ้านกาวะ</p><h1 class="wl-name" id="wlT">Q-Teacher</h1><p class="wl-tag">บริหารงานบุคคลและพัฒนาครู โรงเรียนบ้านกาวะ</p></div>'
     +'<div class="wl-body"><h2>แอปนี้ทำอะไรได้บ้าง</h2><ul class="wl-list"><li><span class="i" aria-hidden="true">📍</span><span>ลงเวลามา-กลับ ด้วย GPS หรือสแกน QR</span></li><li><span class="i" aria-hidden="true">📝</span><span>ยื่นใบลา 11 ประเภท ไปราชการ และขออกนอกบริเวณ ดูสิทธิคงเหลือได้ทันที</span></li><li><span class="i" aria-hidden="true">🔄</span><span>สอนแทน งานมอบหมาย และติดตามความคืบหน้า</span></li><li><span class="i" aria-hidden="true">🛠</span><span>แจ้งซ่อม ผู้มาติดต่อ และเช็คยอดนักเรียนฉุกเฉิน</span></li><li><span class="i" aria-hidden="true">🌱</span><span>บันทึกชั่วโมงพัฒนาตนเองและการนิเทศ</span></li></ul>'
     +'<div class="wl-dev">พัฒนาโดย<b>นายฮาฟีซี อูมา</b>ผู้อำนวยการโรงเรียนบ้านกาวะ</div></div>'
     +'<div class="wl-act"><button type="button" class="wl-btn" id="wlGo">เริ่มใช้งาน</button></div></div>';
    document.body.appendChild(ov);
    var btn=document.getElementById('wlGo');
    function close(){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}document.removeEventListener('keydown',key);ov.remove()}
    function key(e){if(e.key==='Escape'||e.key==='Enter'&&document.activeElement===btn)close()}
    btn.addEventListener('click',close);document.addEventListener('keydown',key);
    try{btn.focus()}catch(e){}
  }
  if(document.readyState==='complete')setTimeout(show,500);else window.addEventListener('load',function(){setTimeout(show,500)});
})();
</script>
</body>
