<html lang="th">
<head>
<meta charset="utf-8">

<meta name="description" content="บริหารงานบุคคลและพัฒนาครู โรงเรียนบ้านกาวะ · ผู้พัฒนา นายฮาฟีซี อูมา">
<meta name="theme-color" content="#F3F4FB">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600&display=swap">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============ ตั้งค่า ============ */
const CONFIG = {
  LIFF_ID: '2012013981-CUuRUfnG',   // LIFF เดียวกับหน้ากลาง
  API_URL: 'https://script.google.com/macros/s/AKfycbzF6I2oQGbhtf42zxyaWDvX3labWdWJW1zBMSkWiS2dLKeqyJ5eoDwQhaBm5mivPsfQGg/exec',   // Q-Teacher (ลิงก์เดิม)
  HUB_URL: '../'                     // กลับหน้ากลาง Q-Kawa
};

<style>
:root{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: Q-Kawa suite. Phone + iPad (<1000px) = app shell: greeting header, cards, icon shortcuts, fixed bottom bar + menu sheet.
   Computer (>=1000px) = header + left sidebar + content grid (same as v.2). */
/* โทนเดียวกับหน้ากลาง Q-Kawa (ม่วงคราม · Kanit + IBM Plex Sans Thai) */
:root{
  --bg:#F3F4FB; --bg-top:#ECEBFF; --surface:#FFFFFF; --sunk:#F2F3F9; --ink:#1B1F3B; --muted:#6B7092; --faint:#A3A7C2; --line:#E7E9F3;
  --accent:#5B5BF0; --accent2:#8B6CF7; --accent-ink:#FFFFFF; --accent-soft:#ECEBFE; --navy:#1E2341; --navy2:#2C3263;
  --good:#1E9E66; --warn:#C27803; --bad:#E04850;
  --good-soft:#E2F6EC; --warn-soft:#FFF1D9; --bad-soft:#FDE8E9;
  --c-blue:#2C8CE6; --c-blue-s:#E2F0FD; --c-teal:#11A188; --c-teal-s:#DDF5EF; --c-amber:#E9820C; --c-amber-s:#FFF0DC;
  --c-coral:#EA5B3F; --c-coral-s:#FDE7E1; --c-green:#1E9E66; --c-green-s:#E2F6EC; --c-rose:#E0498D; --c-rose-s:#FDE6F0;
  --c-violet:#7B5CF0; --c-violet-s:#EEE9FE; --c-slate:#5D6385; --c-slate-s:#EEF0F7;
  --shadow:0 8px 28px rgba(44,48,110,.07),0 1px 2px rgba(44,48,110,.04);
  --f-display:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --f-data:"Kanit","IBM Plex Sans Thai",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --bg-top:#171A3A; --surface:#171A31; --sunk:#1F2340; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296; --line:#2A2E50;
  --accent:#8C8CFF; --accent2:#B39BFF; --accent-ink:#0E1022; --accent-soft:#262A5C; --navy:#0A0C1C; --navy2:#1B1F45;
  --good:#6BD6A3; --warn:#F5C26B; --bad:#FF8F95; --good-soft:#15352A; --warn-soft:#3A2D12; --bad-soft:#40191D;
  --c-blue:#86C2FF; --c-blue-s:#16304A; --c-teal:#6EE0C7; --c-teal-s:#123A33; --c-amber:#FFB866; --c-amber-s:#3A2A14;
  --c-coral:#FF9A85; --c-coral-s:#3D2019; --c-green:#6BD6A3; --c-green-s:#15352A; --c-rose:#FF93C0; --c-rose-s:#401B2E;
  --c-violet:#B39BFF; --c-violet-s:#2A2458; --c-slate:#C3C6E0; --c-slate-s:#262A45; --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.2rem}h2{font-size:1.06rem}h3{font-size:.95rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* ---- desktop chrome ---- */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:none}
.brand small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.roles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.roles>span{font-size:.8rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding-inline:16px}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;padding-top:18px;display:grid;gap:2px}
.mi{border:0;background:none;padding:8px 10px;color:var(--ink);font-weight:500;display:flex;gap:10px;align-items:center;border-radius:10px;text-align:left;width:100%}
.mi:hover{background:var(--sunk)}
.mi[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.mi .ic{width:30px;height:30px}
.mi .ic svg{width:17px;height:17px}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;font-family:var(--f-data);line-height:1.5;margin-left:auto}
.credit{font-size:.78rem;color:var(--muted);padding:14px 10px 0;border-top:1px solid var(--line);margin-top:12px;line-height:1.5}
.credit b{color:var(--ink);font-weight:600}
main{padding-block:18px 56px;display:grid;gap:16px;min-width:0}
main.wrap{padding-inline:0;max-width:none;margin:0;width:100%}

/* ---- phone / iPad app shell ---- */
.app-top,.bottom,.sheet,.mrole{display:none}
@media (max-width:999.98px){
  header.top{display:none}
  .shell{display:block;padding-inline:0}
  nav.side{display:none}
  main.wrap{padding-inline:16px;max-width:760px;margin:0 auto;padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
  .app-top{display:block;max-width:760px;margin:0 auto;padding:14px 16px 6px}
  .app-top .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .app-top .eyebrow{font-size:.74rem;letter-spacing:.12em;color:var(--muted);font-weight:600}
  .app-top h1{font-size:1.45rem}
  .bell{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 1px 3px rgba(20,30,50,.12);display:grid;place-items:center;flex:none}
  .bell svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bell .badge{position:absolute;top:2px;right:0;margin:0}
  .mrole{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted)}
  .mrole select{width:auto;padding:4px 8px;border-radius:999px;font-size:.84rem}
  .bottom{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .bottom button{border:0;background:none;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:.72rem;color:var(--muted);position:relative;min-width:0}
  .bottom button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottom svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bottom button[aria-current="page"]{color:var(--ink);font-weight:600}
  .bottom .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
  .sheet{position:fixed;inset:0;z-index:25;background:rgba(10,16,26,.45);align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet .card{background:var(--bg);width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
}

/* ---- shared components ---- */
.note{font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 10px}
.ph p{color:var(--muted);font-size:.84rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}
.pill{display:inline-block;font-size:.75rem;padding:1px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--sunk);color:var(--muted)}.p-calm{background:var(--c-teal-s);color:var(--c-teal)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.77rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:.88rem;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.8rem}
.btn.big{padding:13px 18px;font-size:1.02rem;font-family:var(--f-display);border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.list{display:grid;margin:0;padding:0;list-style:none}
.list>li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list>li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.82rem}
.sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.flow{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.78rem;color:var(--muted)}
.flow .d{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.flow .d.on{background:var(--good)}.flow .d.no{background:var(--bad)}.flow .d.wait{background:var(--warn)}
.f{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.lbl{font-weight:500;font-size:.86rem}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);width:100%;max-width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;background:var(--surface);position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opts label:has(input:focus-visible){outline:2px solid var(--accent)}
.callout{border-radius:12px;padding:10px 12px;font-size:.9rem;display:grid;gap:4px}
.c-good{background:var(--good-soft)}.c-warn{background:var(--warn-soft)}.c-bad{background:var(--bad-soft)}.c-info{background:var(--accent-soft)}
.lock{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.86rem;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.span2{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (min-width:1000px){.toast{bottom:24px}}

/* colored icon tiles */
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h-blue{background:var(--c-blue-s);color:var(--c-blue)}.h-teal{background:var(--c-teal-s);color:var(--c-teal)}.h-amber{background:var(--c-amber-s);color:var(--c-amber)}
.h-coral{background:var(--c-coral-s);color:var(--c-coral)}.h-green{background:var(--c-green-s);color:var(--c-green)}.h-rose{background:var(--c-rose-s);color:var(--c-rose)}
.h-violet{background:var(--c-violet-s);color:var(--c-violet)}.h-slate{background:var(--c-slate-s);color:var(--c-slate)}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
@media (min-width:600px){.shortcuts{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}}
.sc{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:.78rem;text-align:center;line-height:1.3;padding:0}
.sc .ic{width:54px;height:54px;border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.sc .ic svg{width:25px;height:25px}

/* home cards */
.hero{background:var(--hero);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.hero .ava{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.hero .ava svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.hero b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.3}
.status{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start;box-shadow:0 1px 3px rgba(20,30,50,.06);border:1px solid var(--line)}
.status .big{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.12rem;font-weight:600}
.status .big svg{width:22px;height:22px;stroke:var(--good);fill:none;stroke-width:2}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.split.four{grid-template-columns:repeat(4,1fr)}
.split span{font-size:.8rem;color:var(--muted);display:block}
.split b{font-family:var(--f-display);font-size:1.25rem}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.sec h2{font-size:1.08rem}
.count{background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.action{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.action .ic{width:40px;height:40px;border-radius:12px}
.action .ic svg{width:20px;height:20px}
.action .main{flex:1;min-width:0}
.action b{display:block;font-weight:600;line-height:1.35}
.action .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.actions{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.sos{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;border:0;border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.sos svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;flex:none}
.sos b{font-family:var(--f-display);font-size:1.05rem;display:block}
.sos small{opacity:.9}
.alertband{background:var(--bad);color:#fff;border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.alertband b{font-family:var(--f-display);font-size:1.05rem}
.alertband .btn{background:#fff;color:#a12a1c;border-color:#fff}

/* features */
.clockbig{font-family:var(--f-data);font-size:2.2rem;font-weight:600;line-height:1.1}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.punch b{display:block;font-family:var(--f-data);font-size:1.35rem}
.punch span{font-size:.8rem;color:var(--muted)}
.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;display:grid;gap:2px}
.slot b{font-family:var(--f-data);font-size:.76rem;color:var(--muted);font-weight:500}
.slot.teach{background:var(--accent-soft);border-color:transparent}
.slot.free{color:var(--muted)}
.slot.now{outline:2px solid var(--accent)}
.rank{list-style:none;margin:0;padding:0;display:grid}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-size:.78rem;font-weight:600;background:var(--sunk)}
.m1{background:#ecc65c;color:#3a2b00}.m2{background:#cbd2db;color:#20262e}.m3{background:#d89f6e;color:#2e1a08}
.period{font-size:.8rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}
.job{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.steps3 i{height:6px;border-radius:3px;background:var(--line);display:block}
.steps3 i.on{background:var(--good)}

const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const d8=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const thD=s=>{if(!s)return'';const d=d8(s);return d.getDate()+' '+MON[d.getMonth()]};
const thDY=s=>{if(!s)return'';const d=d8(s);return d.getDate()+' '+MON[d.getMonth()]+' '+(d.getFullYear()+543)};
const thDT=s=>s?thD(s)+(s.length>10?' '+s.slice(11,16)+' น.':''):'';
const thRange=(a,b)=>a===b?thD(a):thD(a)+' – '+thD(b);
const addDays=(s,n)=>{const d=d8(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=iso=>Math.round((d8(iso)-d8(TODAY_ISO))/864e5);
const toMin=hm=>{const[h,m]=String(hm).split(':').map(Number);return h*60+m};
const clockNow=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

/* ---------- ข้อมูลจริงจากหลังบ้าน ---------- */
let B=null,ME=null,TODAY='',TODAY_ISO='',NOW_HM='';
let STAFF=[],SM={},CLASSES=[],PERIODS=[],MY_TT={},FREE={},ATT={},ATT_OUT={},ATT_INFO={},ATT_LOC={},ONLEAVE={},OUTNOW={};
let REQ=[],LEAVE_USED={},LATE_TERM={},RULE={n:10,d:23},LATE_RULE=8,SUBS=[],SUBCOUNT={},SUBTERM={},ROUTINE=[],JOBS=[],KPI=null;
let CPS=[],ROUNDS=[],PATROL=[],TONIGHT=[],INCIDENTS=[],VISIT=[],TASKS=[],DEV={},DEV_TARGET=50,MY_IDP=[],MY_LOG=[],PLC=[],SUP=[],COMP=[];
let EMG={on:false},STU=[],SM_STU={},ACTS=[],LOCS=[];
const nm=id=>SM[id]?.name||(id?'–':'–');
const me=()=>ME.staff_id;
const myCls=()=>ME.cls||'';

function load(b){
  B=b;ME=b.me;TODAY_ISO=b.today.date;NOW_HM=b.today.hm;
  const d=d8(TODAY_ISO);TODAY=DOW[d.getDay()]+' '+thDY(TODAY_ISO);
  STAFF=b.staff;SM=Object.fromEntries(STAFF.map(s=>[s.id,s]));
  if(!SM[ME.staff_id])SM[ME.staff_id]={id:ME.staff_id,name:ME.call,full:ME.name,pos:ME.position,cls:ME.cls};
  CLASSES=b.classes.map(c=>[c.cls,c.t,c.n,c.room]);
  PERIODS=b.periods.map(p=>[p.p,p.from+'–'+p.to,p.from,p.to]);
  MY_TT={};(b.myTT||[]).forEach(x=>{MY_TT[x.p]=((x.subj||'สอน')+' '+(x.cls||'')).trim()});
  FREE=b.freeNow||{};
  ATT={};ATT_OUT={};ATT_INFO={};ATT_LOC={};
  Object.entries(b.att||{}).forEach(([id,x])=>{if(x.in){ATT[id]=x.in.time;ATT_INFO[id]=x.in;if(x.in.point&&x.in.method==='gps')ATT_LOC[id]=x.in.point}if(x.out)ATT_OUT[id]=x.out.time});
  ONLEAVE={};Object.entries(b.onleave||{}).forEach(([id,l])=>{ONLEAVE[id]=l.type+(l.part&&l.part!=='เต็มวัน'?' ('+l.part+')':'')+(l.status!=='อนุมัติ'?' · '+l.status:'')});
  OUTNOW=b.outnow||{};
  REQ=b.reqs||[];LEAVE_USED=b.leaveUsed||{};LATE_TERM=b.lateRound||{};RULE={n:b.quota.times,d:b.quota.days};LATE_RULE=b.quota.late;
  SUBS=b.subs||[];SUBCOUNT=b.subCounts.month||{};SUBTERM=b.subCounts.term||{};
  ROUTINE=b.routine||[];JOBS=b.jobs||[];KPI=b.janKpi;
  const P=b.patrol;CPS=P?P.cps.filter(c=>c.active):[];ROUNDS=P?P.rounds:[];PATROL=P?P.last:[];TONIGHT=P?P.tonight:[];
  INCIDENTS=b.incidents||[];VISIT=b.visits||[];
  TASKS=(b.works||[]).map(w=>Object.assign({},w,{dueTx:thD(w.due)}));
  DEV=b.dev.totals.tot||{};DEV_TARGET=b.dev.target;MY_IDP=b.dev.idp||[];MY_LOG=b.dev.myLog||[];PLC=b.dev.plc||[];SUP=b.dev.sup||[];COMP=b.dev.compNames||[];
  EMG=b.emg||{on:false};STU=b.students||[];SM_STU=Object.fromEntries(STU.map(x=>[x.id,x]));ACTS=b.acts||[];LOCS=b.locations||[];
  if(st.round==null&&ROUNDS.length){const hm=clockNow();let i=0;ROUNDS.forEach((r,k)=>{const rm=toMin(r),nm2=toMin(hm);if((nm2>=rm&&rm>=720)||(nm2<720&&rm<720&&nm2>=rm))i=k});st.round=i}
}

/* ---------- เชื่อมหลังบ้าน ---------- */
let BUSY=0;
function busyBar(on){BUSY+=on?1:-1;let el=$('#lbar');if(BUSY>0&&!el){el=document.createElement('div');el.id='lbar';el.className='loading-bar';document.body.appendChild(el)}if(BUSY<=0&&el){el.remove();BUSY=0}}
async function api(action,payload){
  let r;busyBar(true);
  try{r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,idToken:liff.getIDToken()},payload||{}))});}
  catch(e){busyBar(false);const er=new Error('เชื่อมต่อไม่ได้ ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่');er.code='NETWORK';throw er}
  let j;try{j=await r.json()}catch(e){busyBar(false);const er=new Error('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy)');er.code='BAD_RESPONSE';throw er}
  busyBar(false);
  if(!j.ok){if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN')relogin();const er=new Error(j.error||j.code);er.code=j.code;throw er}
  st.speed={action,server:j.ms||0};
  return j;
}
/** ส่งคำสั่ง แล้วใช้ข้อมูลชุดใหม่ที่ได้กลับมาทันที (รอบเดียว) */
async function act(action,payload,btn){
  if(btn){btn.disabled=true}
  try{const j=await api(action,payload);if(j.data){load(j.data);cacheSet(j.data);st.fetchedAt=Date.now()}render();toast(j.msg);return j}
  catch(e){toast(e.message);if(btn)btn.disabled=false;throw e}
}
function relogin(){let n=0;try{n=Number(sessionStorage.getItem('qt_relogin')||0);sessionStorage.setItem('qt_relogin',String(n+1))}catch(e){}if(n>1)return;if(liff.isInClient())location.reload();else{try{liff.logout()}catch(e){}liff.login({redirectUri:location.href})}}
function cacheKey(){try{return'qt2_'+((liff.getDecodedIDToken()||{}).sub||'')}catch(e){return''}}
function cacheGet(){try{const k=cacheKey();if(!k)return null;const v=JSON.parse(localStorage.getItem(k)||'null');return v&&v.me&&v.today&&v.today.date===ymd(new Date())?v:null}catch(e){return null}}
function cacheSet(v){try{const k=cacheKey();if(k)localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cacheClear(){try{const k=cacheKey();if(k)localStorage.removeItem(k)}catch(e){}}
async function refresh(quiet){try{const j=await api('boot');load(j);cacheSet(j);st.fetchedAt=Date.now();st.stale=false;render();if(!quiet)toast('โหลดข้อมูลใหม่แล้ว')}catch(e){if(!quiet)toast(e.message)}}

function screen(html){document.body.classList.add('plain');$('#view').innerHTML='';$('#boot').innerHTML=`<div class="center"><section class="panel" style="gap:14px"><div class="mark" style="width:56px;height:56px;font-size:1.5rem;margin:0 auto">T</div>${html}<p class="foot">Q-Teacher · ผู้พัฒนา ${DEV_NAME}</p></section></div>`;$('#boot').hidden=false}
async function boot(){
  if(!CONFIG.API_URL)return screen('<h2>ยังไม่ได้ตั้งค่า API_URL</h2>');
  try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return screen(`<h2>เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ</h2><p class="err">${esc(e.message)}</p>`)}
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  const c=cacheGet();
  if(c){load(c);st.stale=true;start()}
  try{const j=await api('boot');load(j);cacheSet(j);st.fetchedAt=Date.now();st.stale=false;try{sessionStorage.removeItem('qt_relogin')}catch(e){}if(!c)start();else render();openHash()}
  catch(e){
    if(e.code==='NOT_LINKED'){cacheClear();return screen(`<h2>ยังไม่ได้ผูกบัญชี</h2><p class="note">ผูกบัญชี LINE กับโรงเรียนที่หน้ากลาง Q-Kawa ก่อน (กรอกรหัส 6 หลักจาก ผอ.) แล้วกลับมาที่นี่</p><a class="btn pri big wide" style="text-align:center;text-decoration:none" href="${esc(CONFIG.HUB_URL)}">ไปหน้ากลาง Q-Kawa</a>`)}
    if(e.code==='APP_OFF'){cacheClear();return screen(`<h2>Q-Teacher ยังไม่เปิดใช้</h2><p class="note">${esc(e.message)}</p><a class="btn wide" style="text-align:center;text-decoration:none" href="${esc(CONFIG.HUB_URL)}">กลับหน้ากลาง</a>`)}
    if(c){toast('ยังโหลดข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลครั้งก่อน');return}
    screen(`<h2>โหลดข้อมูลไม่สำเร็จ</h2><p class="err">${esc(e.message)}</p><button class="btn pri big wide" data-reload="1">ลองใหม่</button>`)
  }
}
function start(){$('#boot').hidden=true;document.body.classList.remove('plain');render()}
/** เปิดจากหน้ากลาง: #leave=LV69-0001 / #tab=sub */
function openHash(){
  const h=decodeURIComponent(location.hash||'');if(!h)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  const m=/^#(\w+)(?:=(.+))?$/.exec(h);if(!m)return;
  const map={leave:ME.isAdmin?'req':ME.isHR?'endorse':'myreq',tab:m[2]};
  const t=m[1]==='tab'?m[2]:map[m[1]];
  if(t&&visibleTabs().includes(t))go(t);
}

const TABS={
 home:['หน้าหลัก','home','blue','m'],dash:['ภาพรวม','dash','blue','d'],today:['วันนี้','today','blue','d'],
 req:['อนุมัติคำขอ','req','amber'],endorse:['เห็นชอบคำขอ','endorse','green'],myreq:['ยื่นคำขอ','leave','coral'],
 att:['ลงเวลา','clock','teal'],sub:['จัดสอนแทน','sub','violet'],mysub:['สอนแทนของฉัน','sub','violet'],count:['เช็คยอดนักเรียน','count','rose'],
 ops:['งานภารโรง/รปภ.','ops','amber'],jan:['งานของฉัน','job','amber'],patrol:['เดินตรวจ','guard','slate'],
 fixreq:['แจ้งซ่อม','fix','coral'],visit:['ผู้มาติดต่อ','visit','teal'],

function roleTabs(){
  const t=ROLES[ME.role].slice();const add=x=>{if(!t.includes(x))t.push(x)};
  if(ME.isAcad)add('sub');if(ME.isClerk){add('visit');add('tasks')}if(ME.isGuard){add('patrol');add('visit')}if(ME.isJan)add('jan');
  if(ME.isTeacher&&ME.role!=='dir'){add('mysub');add('count');add('mydev');add('mytasks')}
  if(ME.isHR&&ME.role!=='head')add('endorse');
  return t}
const st={round:null,act:null,roll:{},picking:null,pq:'',pc:'all',newAct:false,
  draft2:{name:'',start:'',days:1,places:[''],cps:'ว1 ขึ้นรถที่โรงเรียน\nว1 ถึงที่หมาย\nว1 ขึ้นรถกลับ\nว1 ถึงโรงเรียน',rows:[]},
  qx:{},copied:false,subRank:'m',tab:'home',rank:'w',reqF:'todo',kind:'leave',plcOpen:false,countTab:'emg',emgCount:null,emgMissing:'',emgInjured:0,sheet:false,

function normalizeTab(){const v=visibleTabs();if(!v.includes(st.tab)){if(['home','dash','today'].includes(st.tab))st.tab=v[0];else if(!roleTabs().includes(st.tab))st.tab=v[0]}}
const isWork=()=>!B.today.holiday;

function pending(){
  const r=ME.role,m=me(),a=[];
  const myRoom=ME.rooms||[];
  if(EMG.on)myRoom.forEach(rm=>{if(!EMG.rep[rm.room_id])a.push({ic:'sos',h:'rose',t:'รายงานยอดนักเรียน '+rm.grade+' ทันที',s:'เหตุฉุกเฉิน: '+EMG.type,go:'count',ct:'emg'})});
  if(!B.my.in&&isWork()&&!B.my.leaveToday&&NOW_HM<=B.rules.general.out)a.push({ic:'clock',h:'teal',t:'ยังไม่ได้ลงเวลามา',s:'แตะเพื่อลงเวลา (GPS)',go:isMobile()?'home':(r==='dir'?'att':'today')});
  REQ.filter(x=>x.canDir&&x.st==='dir').forEach(x=>a.push({ic:'req',h:'amber',t:`${x.kind==='leave'?'อนุมัติ'+x.type:x.kind==='out'?'อนุมัติออกนอกบริเวณ':'อนุมัติไปราชการ'} · ${nm(x.who)}`,s:x.over?'เกินเกณฑ์ มีหลักฐาน':(x.headNote?'หัวหน้างานบุคคลเห็นชอบแล้ว':'รอการอนุมัติ'),go:'req'}));
  if(ME.isAdmin&&!B.hasHR)REQ.filter(x=>x.canDir&&x.st==='head').forEach(x=>a.push({ic:'req',h:'amber',t:`อนุมัติ${x.type} · ${nm(x.who)}`,s:'รอการอนุมัติ',go:'req'}));
  REQ.filter(x=>x.canHR).forEach(x=>a.push({ic:'endorse',h:'green',t:`เห็นชอบ${x.type} · ${nm(x.who)}`,s:thRange(x.from,x.to)+' · รอการตอบรับ',go:'endorse'}));
  if(ME.isAdmin||ME.isAcad){const n=SUBS.filter(s=>!s.done&&s.date>=TODAY_ISO).length;if(n)a.push({ic:'sub',h:'violet',t:`จัดครูสอนแทน ${n} คาบ`,s:'ดูหรือคัดลอกข้อความสอนแทน',go:'sub'})}
  REQ.filter(x=>x.canSub).forEach(x=>a.push({ic:'sub',h:'violet',t:`ขอให้สอนแทนคาบ ${x.period} (${thD(x.from)})`,s:nm(x.who)+' ออกนอกบริเวณ · กดรับหรือไม่สะดวก',go:'mysub'}));
  SUBS.filter(s=>s.done&&s.pick===m&&s.date===TODAY_ISO).forEach(s=>a.push({ic:'sub',h:'violet',t:`สอนแทนคาบ ${s.p} ${s.cls} วันนี้`,s:`แทน ${nm(s.for)} · ได้รับมอบหมาย`,go:'mysub'}));
  SUBS.filter(s=>s.for===m&&!s.work&&s.date>=TODAY_ISO).slice(0,1).forEach(s=>a.push({ic:'sub',h:'violet',t:'ฝากงานให้ครูสอนแทน',s:thD(s.date)+' · คาบ '+s.p,go:'myreq'}));
  REQ.filter(x=>x.canBack).forEach(x=>a.push({ic:'out',h:'teal',t:'กดเมื่อกลับถึงโรงเรียน',s:'ออกนอกบริเวณ '+x.time,go:'myreq'}));
  REQ.filter(x=>x.who===m&&x.kind==='gov'&&x.st==='approved'&&!x.report&&x.to<=TODAY_ISO).forEach(x=>a.push({ic:'gov',h:'violet',t:'เขียนรายงานหลังไปราชการ/อบรม',s:x.why,go:'myreq',kind:'gov'}));
  SUP.filter(s=>s.who===m&&s.st==='นัดแล้ว'&&s.d>=TODAY_ISO).forEach(s=>a.push({ic:'dev',h:'green',t:'ยืนยันนัดรับการนิเทศ '+thD(s.d)+(s.p?' คาบ '+s.p:''),s:'ผู้นิเทศ '+nm(s.by),go:'mydev'}));
  TASKS.filter(t=>t.own===m&&t.pct<100&&dayDiff(t.due)<=3).forEach(t=>a.push({ic:'tasks',h:'blue',t:t.t,s:'ครบกำหนด '+t.dueTx,go:roleTabs().includes('mytasks')?'mytasks':'tasks'}));
  if(ME.isAdmin){JOBS.filter(j=>j.st===0&&j.prio==='ด่วน').forEach(j=>a.push({ic:'fix',h:'coral',t:'แจ้งซ่อมด่วน: '+j.t,s:j.where+' · รอรับงาน',go:'ops'}));
    TASKS.filter(t=>t.pct<100&&dayDiff(t.due)<0).forEach(t=>a.push({ic:'tasks',h:'rose',t:'เลยกำหนด: '+t.t,s:nm(t.own),go:'tasks'}));
    JOBS.filter(j=>j.st===2&&!j.rDir).slice(0,3).forEach(j=>a.push({ic:'job',h:'amber',t:'ให้คะแนนงานภารโรง: '+j.t,s:j.id+' · เสร็จ '+thDT(j.doneAt),go:'ops'}));
    INCIDENTS.filter(x=>x.st==='แจ้ง ผอ. แล้ว').forEach(x=>a.push({ic:'sos',h:'rose',t:'รปภ. แจ้งเหตุ: '+x.what,s:x.where+' · '+x.t+' น.',go:'ops'}))}
  JOBS.filter(j=>j.st===2&&j.by===m&&!j.rReq).forEach(j=>a.push({ic:'fix',h:'coral',t:'ให้คะแนนงานซ่อม: '+j.t,s:j.id+' · ซ่อมเสร็จแล้ว',go:'fixreq'}));
  ACTS.forEach(ac=>ac.groups.filter(g=>g.lead===m).forEach(g=>{const n=g.students.length||g.count;if(ac.cur>=0&&ac.cur<ac.cps.length&&n&&g.checks[ac.cur]==null)a.push({ic:'count',h:'rose',t:'เช็คยอด '+g.name,s:ac.name+' · '+ac.cps[ac.cur],go:'count',ct:'trip',act:ac.id});else if(ac.cur<0&&!n)a.push({ic:'count',h:'rose',t:'เพิ่มรายชื่อนักเรียนที่ดูแล · '+g.name,s:ac.name,go:'count',ct:'trip',act:ac.id})}));
  if(ME.isJan)JOBS.filter(j=>j.st===0).forEach(j=>a.push({ic:'job',h:'amber',t:'รับงาน: '+j.t,s:j.where+' · ภายใน '+thD(j.due),go:'jan'}));
  if(ME.isGuard&&CPS.length)a.push({ic:'guard',h:'slate',t:'เวรเดินตรวจคืนนี้ '+ROUNDS.length+' รอบ',s:'รอบแรก '+(ROUNDS[0]||'')+' น.',go:'patrol'});
  return a}
function badgeFor(t){
  if(t==='req')return REQ.filter(x=>x.canDir).length;
  if(t==='endorse')return REQ.filter(x=>x.canHR).length;
  if(t==='sub')return SUBS.filter(s=>!s.done&&s.date>=TODAY_ISO).length;
  if(t==='jan')return JOBS.filter(j=>j.st===0).length;
  if(t==='mysub')return REQ.filter(x=>x.canSub).length;
  if(t==='count')return EMG.on?1:0;
  if(t==='ops')return INCIDENTS.filter(x=>x.st==='แจ้ง ผอ. แล้ว').length;
  return 0}

function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){const e=new Error('เครื่องนี้ไม่รองรับการหาตำแหน่ง');e.code='NO_GEO';return rej(e)}
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),
      e=>{const er=new Error(e.code===1?'LINE ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง':e.code===3?'หาตำแหน่งนานเกินไป (สัญญาณ GPS อ่อน)':'หาตำแหน่งไม่ได้');er.code=e.code===1?'DENIED':'NO_POS';rej(er)},
      {enableHighAccuracy:true,timeout:15000,maximumAge:0})});
}

async function scanCode(label,prefix){
  try{if(liff.isInClient()&&liff.isApiAvailable&&liff.isApiAvailable('scanCodeV2')){const r=await liff.scanCodeV2();if(r&&r.value)return r.value;return null}}catch(e){}
  return await askCode(label,prefix);
}
function askCode(label,prefix){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;res(v)};
    modal(`<form class="f" id="qrForm"><h2>สแกน QR ${esc(label)}</h2>
     <label class="btn pri big wide" for="qrPhoto" style="text-align:center">${svg('cam').replace('<svg','<svg style="width:20px;height:20px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.8"')} ถ่ายรูป QR</label><input type="file" id="qrPhoto" accept="image/*" capture="environment" hidden>
     <p class="sub" id="qrMsg">หรือพิมพ์รหัส 6 ตัวที่อยู่ใต้รูป QR (ต่อจาก ${esc(prefix)})</p>
     <input type="text" id="qrCode" class="big-input" maxlength="20" autocomplete="off" autocapitalize="characters" aria-label="รหัสใต้ QR">
     <button class="btn wide" type="submit">ตกลง</button><button type="button" class="btn wide" data-close="1">ยกเลิก</button></form>`);
    $('#qrForm').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();const v=$('#qrCode').value.trim();if(v)fin(v)});
    $('#qrPhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readQrFile(f).then(v=>{if(v)fin(v);else $('#qrMsg').textContent='อ่าน QR ไม่ได้ ถ่ายใหม่ให้ QR อยู่กลางภาพ หรือพิมพ์รหัสแทน'})});
    const obs=new MutationObserver(()=>{if($('#modal').hidden){obs.disconnect();fin(null)}});obs.observe($('#modal'),{attributes:true});
  });
}
function readQrFile(file){return new Promise(res=>{if(typeof jsQR==='undefined')return res(null);const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);URL.revokeObjectURL(url);res(r?r.data.trim():null)};
  img.onerror=()=>res(null);img.src=url})}
/** ย่อรูปก่อนส่ง (กว้างสุด 1280 px) */
function shrinkPhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=()=>rej(new Error('เปิดรูปไม่ได้'));img.src=url})}

function nextPeriod(){const hm=clockNow();const p=PERIODS.find(x=>x[3]>hm&&MY_TT[x[0]]);return p?`คาบ ${p[0]} · ${MY_TT[p[0]]}`:(B.hasTT?'วันนี้ไม่มีคาบสอนแล้ว':'ยังไม่มีตารางสอน')}
function punchCard(compact){
  const my=B.my,R=B.rules;
  const box=(lab,x)=>`<div><span>${lab}</span><b>${x?esc(x.time):'––:––'}</b>${x?`<span>${stPill(x.status)} ${x.method==='qr'?'QR':x.method==='admin'?'ลงแทน':'GPS'}${x.point?' · '+esc(x.point):''}</span>`:''}</div>`;
  let btn;
  if(!my.in)btn=`<label class="row" style="justify-content:center;font-size:.9rem;color:var(--muted)"><input type="checkbox" id="duty" ${st.duty?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"> วันนี้ฉันเป็นครูเวร</label>
     <button class="btn big pri wide punchbtn" data-punch="in">${svg('pin')}ลงเวลาเข้า (GPS)</button><button class="btn wide" data-punchqr="in">${svg('qr').replace('<svg','<svg style="width:18px;height:18px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.8"')} สแกน QR แทน</button>`;
  else if(!my.out)btn=`<button class="btn big wide punchbtn" data-punch="out" style="background:var(--navy);color:#fff;border-color:var(--navy)">${svg('out')}ลงเวลาออก</button><button class="btn wide" data-punchqr="out">สแกน QR แทน</button>`;
  else btn=`<div class="callout c-good" style="text-align:center">ลงเวลาครบแล้ววันนี้ ขอบคุณครับ</div>`;
  const duty=my.in?my.in.duty:st.duty,x=duty?R.duty:R.general;
  return`<div class="punch">${box('เวลาเข้า',my.in)}${box('เวลาออก',my.out)}</div>
   ${B.today.holiday?`<div class="note">วันนี้เป็น${esc(B.today.holiday)} · ถ้ามาปฏิบัติงานก็ลงเวลาได้</div>`:''}
   ${my.leaveToday?`<div class="callout c-info">วันนี้มีใบ${esc(my.leaveToday.type)}${my.leaveToday.part!=='เต็มวัน'?' ('+esc(my.leaveToday.part)+')':''} · ${esc(my.leaveToday.status)}</div>`:''}
   ${btn}<span class="sub" style="text-align:center">${duty?'ครูเวร':'ครูทั่วไป'} มาไม่เกิน ${x.on} · ถึง ${R.late} ไฟเหลือง · หลัง ${R.late} แจ้งเข้าสาย · กลับ ${x.out} น.</span>`}

const whyOf=s=>s.kind==='out'?'ออกนอกบริเวณ':s.kind==='gov'?'ไปราชการ':s.kind==='manual'?'ไม่อยู่':'ลา';
const perTime=p=>(PERIODS.find(x=>x[0]===p)||[])[1]||'';
function subGroups(dt){const list=SUBS.filter(s=>s.date===dt);const m={};list.filter(s=>s.done).forEach(s=>{const k=s.pick||'merge';(m[k]=m[k]||[]).push(s)});
  const g=Object.entries(m).sort((a,b)=>b[1].length-a[1].length||nm(a[0]).localeCompare(nm(b[0]),'th')).map(([k,v])=>[k,v.sort((a,b)=>String(a.p).localeCompare(String(b.p)))]);
  const un=list.filter(s=>!s.done);if(un.length)g.push([null,un]);return g}
const subDates=()=>[...new Set(SUBS.filter(s=>s.date>=TODAY_ISO).map(s=>s.date))].sort();
function subSummary(){const dates=subDates();
  return`<section class="panel"><div class="ph"><h2>สรุปตามครูสอนแทน</h2><p>เรียงจากคนที่สอนแทนมากที่สุด</p></div>${dates.length?dates.map(dt=>`<h3>${thD(dt)}${dt===TODAY_ISO?' (วันนี้)':''}</h3><ul class="list">${subGroups(dt).map(([who,l])=>`<li style="align-items:flex-start"><span class="sw" style="background:${who?'var(--c-violet)':'var(--warn)'}"></span><div class="main"><b>${who?(who==='merge'?'รวมชั้น':esc(nm(who))):'ยังไม่มีผู้สอนแทน'}</b> <span class="pill ${who?'p-info':'p-warn'}">${l.length} คาบ</span><div class="sub">${l.map(s=>`${esc(s.cls)} คาบ ${esc(s.p)}`).join(' · ')}</div></div></li>`).join('')}</ul>`).join(''):'<p class="sub">ยังไม่มีคาบสอนแทน</p>'}</section>`}
function subMessage(){
  const lines=['ตารางสอนแทน โรงเรียนบ้านกาวะ'];
  subDates().forEach(dt=>{lines.push('','วันที่ '+thDY(dt)+(dt===TODAY_ISO?' (วันนี้)':''));
    subGroups(dt).forEach(([who,list],gi)=>{
      lines.push(who?`${gi+1}) ${who==='merge'?'รวมชั้น':nm(who)} สอนแทน ${list.length} คาบ`:'ยังไม่มีผู้สอนแทน');
      list.forEach(s=>{lines.push(`   • ${s.cls} คาบ ${s.p}${perTime(s.p)?' ('+perTime(s.p)+')':''} ${s.subj}${s.merge?' (รวมชั้น)':''} · แทน ${nm(s.for)} (${whyOf(s)})`);
        if(s.work)lines.push(`     งานที่ฝาก: ${s.work}`)})})});
  lines.push('','ครูที่ได้รับมอบหมายกรุณาเข้าสอนตามตาราง ขอบคุณครับ/ค่ะ','ฝ่ายวิชาการ');
  return lines.join('\n')}

  if(isDir)return`${st.newAct?actForm():`<div><button class="btn pri" data-actnew="1">+ สร้างกิจกรรมนอกสถานที่</button></div>`}${cards}${a?actBoard(a):''}`;
  const myActs=ACTS.filter(x=>x.groups.some(g=>g.lead===m));
  if(!a)return'<section class="panel"><p class="sub">ยังไม่มีกิจกรรมนอกสถานที่</p></section>';
  const mine=a.groups.filter(g=>g.lead===m);
  let body='';
  mine.forEach(g=>{const n=gN(g),sel=st.roll[g.id]||{},cnt=g.students.filter(id=>sel[id]).length,started=a.cur>=0&&a.cur<a.cps.length;
    body+=`<section class="panel"><div class="ph"><h2>${esc(g.name)}</h2><span class="pill p-info">${n} คน</span></div><p class="sub">หน้าที่: ${esc(g.duty)}</p>
    ${STU.length?`<div class="row"><button class="btn ${st.picking===g.id?'pri':''}" data-picking="${g.id}">${st.picking===g.id?'บันทึกรายชื่อ':'จัดการรายชื่อนักเรียนที่ดูแล'}</button>${st.picking===g.id?'<button class="btn" data-pickcancel="1">ยกเลิก</button>':''}</div>`
     :`<form class="row" id="cntForm" data-g="${g.id}"><label class="sub" for="gc${g.id}">ยังไม่มีรายชื่อนักเรียนในระบบ · จำนวนนักเรียนที่ดูแล</label><input type="number" min="0" id="gc${g.id}" value="${g.count||''}" style="width:110px"><button class="btn sm pri" type="submit">บันทึก</button></form>`}
    ${st.picking===g.id?`<div class="fgrid"><div class="fld"><label for="pq">ค้นหาชื่อ</label><input type="text" id="pq" value="${esc(st.pq||'')}" placeholder="พิมพ์ชื่อนักเรียน"></div><div class="fld"><label for="pc">ชั้น</label><select id="pc"><option value="all">ทั้งโรงเรียน</option>${CLASSES.map(c=>`<option ${st.pc===c[0]?'selected':''}>${esc(c[0])}</option>`).join('')}</select></div></div>
     <div class="row"><button class="btn sm" data-pickall="${g.id}">เลือกทั้งหมดที่แสดง</button><button class="btn sm" data-pickschool="${g.id}">เลือกทั้งโรงเรียนที่ยังไม่มีกลุ่ม</button><button class="btn sm danger" data-pickclear="${g.id}">ล้างรายชื่อของฉัน</button><span class="num" id="pickN" style="margin-left:auto">${Object.keys(st.pickSel).length} คน</span></div>
     <div id="pickBox" data-g="${g.id}">${pickList(a,g)}</div><p class="note">นักเรียนที่อยู่กลุ่มอื่นแล้วเลือกซ้ำไม่ได้ ป้องกันนับซ้ำ</p>`
     :g.students.length?`<div class="sub">${g.students.slice(0,12).map(id=>esc((SM_STU[id]||{name:id}).name)).join(', ')}${g.students.length>12?` และอีก ${g.students.length-12} คน`:''}</div>`:''}
    ${started&&n&&st.picking!==g.id?`<div class="callout c-info"><b>จุดเช็คที่ ${a.cur+1}: ${esc(a.cps[a.cur])}</b>${g.checks[a.cur]!=null?'ยืนยันแล้ว '+g.checks[a.cur]+'/'+n:(g.students.length?'แตะชื่อนักเรียนที่อยู่ครบ':'กรอกจำนวนที่นับได้')}</div>
     ${g.students.length?`<div class="row"><button class="btn sm" data-rollall="${g.id}">เลือกทั้งหมด</button><button class="btn sm" data-rollnone="${g.id}">ล้าง</button><span class="num" style="margin-left:auto;font-size:1.1rem">${cnt}/${n}</span></div>
     <div class="kids">${g.students.map(id=>`<button class="kid" data-roll="${g.id}:${id}" aria-pressed="${!!sel[id]}"><i></i><span>${esc((SM_STU[id]||{name:id}).name)}<small>${esc((SM_STU[id]||{}).cls||'')}</small></span></button>`).join('')}</div>
     <button class="btn big wide ${cnt<n?'red':'good'}" data-rollok="${g.id}">ยืนยันยอด ${cnt}/${n}${cnt<n?' · แจ้งยังไม่ครบ':''}</button>`
     :`<div class="fgrid"><div class="fld"><label for="rn${g.id}">นับได้ (คน)</label><input type="number" min="0" max="${n}" id="rn${g.id}" value="${n}"></div><div class="fld"><label for="rm${g.id}">ใครยังไม่พบ</label><input type="text" id="rm${g.id}" placeholder="ระบุชื่อ (ถ้ามี)"></div></div><button class="btn big wide pri" data-rollnum="${g.id}">ยืนยันยอด</button>`}`:(!started&&n?'<p class="note">กิจกรรมยังไม่เริ่ม เมื่อ ผอ. กดเริ่มแล้วจะมีปุ่มเช็คยอดที่นี่</p>':'')}</section>`});
  return`${myActs.length?`<p class="sub">กิจกรรมที่ท่านรับผิดชอบ</p><div class="actions">${myActs.map(x=>`<button class="actcard" data-act="${x.id}" aria-pressed="${x.id===st.act}"><span class="row between"><b>${esc(x.name)}</b><span class="pill ${actStatus(x)[1]}">${actStatus(x)[0]}</span></span><span class="sub">${x.groups.filter(g=>g.lead===m).map(g=>esc(g.name)).join(', ')}</span></button>`).join('')}</div>`:'<p class="sub">ท่านยังไม่มีกิจกรรมที่รับผิดชอบ</p>'}${body}${actBoard(a)}`}

   <div class="scroll"><table><thead><tr><th>ครู</th><th class="r">อบรม</th><th class="r">ออนไลน์</th><th class="r">PLC</th><th class="r">นิเทศ</th><th>เทียบเป้า</th><th class="r">รวม</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <div class="g2">
   <section class="panel"><div class="ph"><h2>นิเทศชั้นเรียน</h2><button class="btn sm" data-supopen="1">${st.supOpen?'ปิด':'+ นัดนิเทศ'}</button></div>${st.supOpen?supForm():''}${supList(true)}</section>

   <section class="panel span2"><div class="lock">บันทึกโค้ชส่วนตัว (Coaching & Mentoring) แยกจากข้อมูลประเมินทางการ · ระยะแรกยังไม่เปิดใช้</div></section>
  </div>`;
};
function supForm(){const T=STAFF.filter(s=>s.teacher);return`<form class="f" id="supForm" style="border:1px dashed var(--line);border-radius:14px;padding:12px"><div class="fgrid"><div class="fld"><label for="su1">ครู</label><select id="su1">${T.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="fld"><label for="su2">วันที่</label><input type="date" id="su2" value="${addDays(TODAY_ISO,7)}"></div><div class="fld"><label for="su3">คาบ</label><input type="text" id="su3" placeholder="เช่น 1"></div></div>

function supList(admin){const L=SUP.filter(s=>admin?true:s.who===me());return L.length?`<ul class="list">${L.map(s=>`<li style="flex-wrap:wrap"><span class="sw" style="background:${s.st==='ให้ข้อเสนอแนะแล้ว'?'var(--good)':'var(--c-blue)'}"></span><div class="main">${admin?esc(nm(s.who))+' · ':''}${thDY(s.d)}${s.p?' · คาบ '+esc(s.p):''}<div class="sub">${esc(s.focus)} · ผู้นิเทศ ${esc(nm(s.by))}</div>${s.feedback?`<div class="sub">ข้อเสนอแนะ: ${esc(s.feedback)}</div>`:''}</div>
  ${s.who===me()&&s.st==='นัดแล้ว'?`<button class="btn sm good" data-supok="${s.id}">ยืนยันนัด</button>`:`<span class="pill ${s.st==='ให้ข้อเสนอแนะแล้ว'?'p-good':'p-info'}">${esc(s.st)}</span>`}
  ${(s.by===me()||ME.isAdmin)&&s.st!=='ให้ข้อเสนอแนะแล้ว'?`<div class="row" style="width:100%"><input type="text" id="fb${s.id}" placeholder="ข้อเสนอแนะหลังนิเทศ" style="flex:1 1 200px"><button class="btn sm pri" data-supfb="${s.id}">บันทึก</button></div>`:''}</li>`).join('')}</ul>`:'<p class="sub">ยังไม่มีนัดนิเทศ</p>'}
function plcList(){return PLC.length?`<ul class="list">${PLC.map(p=>`<li style="display:grid;gap:4px"><div class="row between"><b>${thDY(p.d)} · ${esc(p.grp)}</b><span class="num pill p-mute">${p.h} ชม. · ${p.who.length} คน</span></div>
  <div class="sub">${p.who.map(x=>esc(nm(x))).join(', ')}</div><div style="font-size:.88rem"><b>ปัญหา:</b> ${esc(p.prob)}</div>${p.find?`<div style="font-size:.88rem"><b>ข้อค้นพบ:</b> ${esc(p.find)}</div>`:''}${p.next?`<div class="sub"><b>ทำต่อ:</b> ${esc(p.next)}</div>`:''}</li>`).join('')}</ul>`:'<p class="sub">ยังไม่มีบันทึก PLC</p>'}

function subPick(free){return`<div class="fld"><label for="o4">ครูสอนแทน (ระบบแนะนำคนที่สอนแทนน้อยที่สุด)</label><select id="o4">${free.map((x,i)=>`<option value="${x}">${esc(nm(x))} (${SUBCOUNT[x]||0})${i===0?' ★':''}</option>`).join('')||'<option value="">ไม่มีครูว่างคาบนี้</option>'}</select></div><div class="fld"><label for="o5">งานที่ฝากให้นักเรียน</label><input type="text" id="o5" placeholder="เช่น ทำแบบฝึกหัดหน้า 12"></div>`}
function workDays(a,b,part){if(!a||!b||b<a)return 0;if(part&&part!=='เต็มวัน')return .5;const hol=new Set(B.holidays||[]);let n=0;for(let d=d8(a);ymd(d)<=b;d.setDate(d.getDate()+1)){const w=d.getDay();if(w&&w<6&&!hol.has(ymd(d)))n++}return n}

  const t=e.target.closest('button,[data-reload]');if(!t)return;const d=t.dataset;
  if(d.reload){location.reload();return}

  if(d.sheet){st.sheet=d.sheet==='1';renderChrome();return}
  if(d.refresh){st.sheet=false;refresh(false);return}
  if(d.tab){go(d.tab);return}
  if(d.bell){go('home');setTimeout(()=>$('#actions')?.scrollIntoView({behavior:'smooth'}),30);return}
  if(d.go){if(d.gct)st.countTab=d.gct;if(d.gact)st.act=d.gact;if(d.kind)st.kind=d.kind;if(d.go==='patrol'&&t.textContent.includes('แจ้งเหตุ'))setTimeout(()=>$('#incForm')?.scrollIntoView(),30);go(d.go);return}
  if(d.punch){closeModal();startCheck(d.punch,false);return}
  if(d.punchqr){closeModal();startCheck(d.punchqr,true);return}
  if(d.halfleave){closeModal();st.kind='leave';go('myreq');setTimeout(()=>{if($('#l5')){$('#l5').value='ครึ่งวันเช้า';$('input[name="lt"][value="ลากิจส่วนตัว"]')&&($('input[name="lt"][value="ลากิจส่วนตัว"]').checked=true)}},50);return}
  if(d.rank){st.rank=d.rank;render();return}
  if(d.rf){st.reqF=d.rf;render();return}
  if(d.kind){st.kind=d.kind;render();return}
  if(d.ct){st.countTab=d.ct;render();return}
  if(d.sr){st.subRank=d.sr;render();return}
  if(d.qx){st.qx[d.qx]=!st.qx[d.qx];render();return}
  if(d.forcheck){forCheckForm(d.forcheck);return}
  if(d.copyatt){copyTxt(attText());return}
  if(d.copy){copyTxt($('#'+d.copy).value);return}
  if(d.print){const c=document.getElementById(d.print);if(!c)return;c.classList.add('printme');window.print();setTimeout(()=>c.classList.remove('printme'),600);return}
  /* คำขอ */
  if(d.ap){const[id,a,kind]=d.ap.split(':');const note=($('#nt'+id)?.value||'').trim();if(a==='no'&&!note){toast('กรุณาใส่เหตุผลในช่องความเห็น');$('#nt'+id)?.focus();return}
    act(kind==='out'?'out.dir':'leave.dir',{id,approve:a==='ok',note},t).catch(()=>{});return}
  if(d.hd){const[id,a]=d.hd.split(':');const note=($('#nt'+id)?.value||'').trim();if(a==='no'&&!note){toast('กรุณาใส่เหตุผลในช่องความเห็น');return}act('leave.hr',{id,approve:a==='ok',note},t).catch(()=>{});return}
  if(d.sa){const[id,a]=d.sa.split(':');act('out.sub',{id,approve:a==='ok'},t).catch(()=>{});return}
  if(d.rcancel){const[id,kind]=d.rcancel.split(':');if(!confirm('ยกเลิกคำขอนี้?'))return;act(kind==='out'?'out.cancel':'leave.cancel',{id},t).catch(()=>{});return}
  if(d.back){act('out.back',{id:d.back},t).catch(()=>{});return}
  if(d.report){const r=REQ.find(x=>x.id===d.report);if(r)reportForm(r);return}
  if(d.mkdraft){const r=REQ.find(x=>x.id===d.mkdraft);$('#rp2').value=makeDraft(r,$('#rp1').value);return}
  /* สอนแทน */
  if(d.sub){const v=($(`input[name="pk${d.sub}"]:checked`)||{}).value;if(!v){toast('เลือกครูสอนแทนก่อน');return}act('sub.assign',{id:d.sub,pick:v},t).then(()=>{st.copied=false}).catch(()=>{});return}
  if(d.subdel){if(!confirm('ลบคาบนี้ออกจากรายการสอนแทน?'))return;act('sub.del',{id:d.subdel},t).catch(()=>{});return}
  if(d.addsub){st.addSub=!st.addSub;render();return}
  if(d.subwork){act('sub.work',{id:d.subwork,work:$('#wk'+d.subwork).value},t).catch(()=>{});return}
  /* หน้ารวมงาน */
  if(d.step){const[id,i]=d.step.split(':');act('work.edit',{data:{wid:id,op:'step',i:+i}},t).catch(()=>{});return}
  if(d.log){const v=($('#lg'+d.log)?.value||'').trim();if(!v){toast('พิมพ์บันทึกสั้น ๆ ก่อน');return}act('work.edit',{data:{wid:d.log,op:'log',text:v,link:$('#lk'+d.log)?.value||''}},t).catch(()=>{});return}
  if(d.tp){const[id,v]=d.tp.split(':');act('work.edit',{data:{wid:id,op:'pct',v:+v}},t).catch(()=>{});return}
  if(d.mode){const[id,mode]=d.mode.split(':');act('work.edit',{data:{wid:id,op:'mode',mode}},t).catch(()=>{});return}
  if(d.addstep){const v=($('#ns'+d.addstep)?.value||'').trim();if(!v){toast('พิมพ์ชื่อขั้นตอนก่อน');return}act('work.edit',{data:{wid:d.addstep,op:'addStep',text:v}},t).catch(()=>{});return}
  if(d.wdel){if(!confirm('ลบงานนี้?'))return;act('work.del',{id:d.wdel},t).catch(()=>{});return}
  /* ภารโรง รปภ. */
  if(d.rt){act('routine.tick',{data:{rid:d.rt}},t).catch(()=>{});return}
  if(d.rtdel){if(!confirm('นำงานประจำนี้ออก?'))return;act('routine.del',{id:d.rtdel},t).catch(()=>{});return}
  if(d.job){act('job.next',{data:{jid:d.job}},t).catch(()=>{});return}
  if(d.jobx){if(!confirm('ยกเลิกงานนี้?'))return;act('job.cancel',{id:d.jobx},t).catch(()=>{});return}
  if(d.rate){const[id,who,n]=d.rate.split(':');act('job.rate',{data:{jid:id,who,n:+n}},t).catch(()=>{});return}
  if(d.cptoggle){act('cp.toggle',{code:d.cptoggle},t).catch(()=>{});return}
  if(d.incdone){act('incident.done',{id:d.incdone},t).catch(()=>{});return}
  if(d.round!==undefined){st.round=+d.round;render();return}
  if(d.scancp){const code=await scanCode('จุดตรวจ','QKAWA-CP-');if(!code)return;closeModal();let pos={};try{pos=await Promise.race([getPos(),new Promise(r=>setTimeout(()=>r({}),6000))])}catch(_){}
    act('patrol.scan',{data:{code,round:st.round||0,lat:pos.lat,lng:pos.lng}}).then(()=>{const r=st.round||0;if(TONIGHT.every(x=>typeof x[r]==='string')&&r<ROUNDS.length-1){st.round=r+1;render()}}).catch(()=>{});return}
  if(d.vout){act('visit.out',{id:d.vout},t).catch(()=>{});return}
  /* เช็คยอด */
  if(d.emg){
    if(d.emg==='open'){st.countTab='emg';go('count');return}
    if(d.emg==='start'){if(!confirm('แจ้งเหตุตอนนี้?'))return;act('emg.start',{data:{type:$('input[name="et"]:checked')?.value,point:$('#ep').value}},t).catch(()=>{});return}
    if(d.emg==='end'){if(!confirm('ยุติเหตุ / จบการซ้อม?'))return;act('emg.end',{},t).catch(()=>{});return}}
  if(d.ec){const[room,dv]=d.ec.split(':');const rm=(ME.rooms||[]).find(r=>r.room_id===room);const T=rm.n||+(st['et'+room]||0);st['ec'+room]=clamp((st['ec'+room]??(rm.n||0))+(+dv),0,T||999);render();return}
  if(d.emgredo){st['redo'+d.emgredo]=true;render();return}
  if(d.emgrep){const room=d.emgrep;const rm=(ME.rooms||[]).find(r=>r.room_id===room);const total=rm.n||+(st['et'+room]||0);if(!total){toast('กรอกจำนวนนักเรียนทั้งห้องก่อน');return}
    act('emg.report',{data:{room,present:st['ec'+room]??total,total,missing:$('#em1'+room)?.value||'',injured:$('#em2'+room)?.value||0}},t).then(()=>{st['redo'+room]=false}).catch(()=>{});return}
  if(d.act){st.act=d.act;st.picking=null;render();return}
  if(d.actnew!==undefined){st.newAct=d.actnew==='1';render();return}
  if(d.drow){syncDraft();const T=STAFF.filter(s=>s.teacher);if(d.drow==='add')st.draft2.rows.push({lead:(T[0]||{}).id,name:'กลุ่ม '+(st.draft2.rows.length+1),duty:''});else st.draft2.rows.splice(+d.drow.split(':')[1],1);$('#acRows').innerHTML=dutyRows(st.draft2);return}
  if(d.actgo){act('act.next',{id:d.actgo},t).then(()=>{st.roll={}}).catch(()=>{});return}
  if(d.actdel){if(!confirm('ยกเลิกกิจกรรมนี้?'))return;act('act.del',{id:d.actdel},t).catch(()=>{});return}
  if(d.picking){const a=ACTS.find(x=>x.id===st.act),g=a.groups.find(x=>x.id===d.picking);
    if(st.picking===d.picking){act('act.pick',{data:{gid:g.id,students:Object.keys(st.pickSel)}},t).then(()=>{st.picking=null;render()}).catch(()=>{});return}
    st.picking=d.picking;st.pickSel=Object.fromEntries(g.students.map(x=>[x,1]));render();return}
  if(d.pickcancel){st.picking=null;render();return}
  if(d.pick){if(st.pickSel[d.pick])delete st.pickSel[d.pick];else st.pickSel[d.pick]=1;t.setAttribute('aria-pressed',String(!!st.pickSel[d.pick]));const n=$('#pickN');if(n)n.textContent=Object.keys(st.pickSel).length+' คน';return}
  if(d.pickall||d.pickschool||d.pickclear){const a=ACTS.find(x=>x.id===st.act),gid=d.pickall||d.pickschool||d.pickclear;
    if(d.pickclear)st.pickSel={};else{const pool=d.pickschool?STU:STU.filter(x=>(st.pc==='all'||x.cls===st.pc)&&(!st.pq||x.name.includes(st.pq)));pool.forEach(x=>{const og=groupOf(a,x.id);if(!og||og.id===gid)st.pickSel[x.id]=1})}
    updatePick();const n=$('#pickN');if(n)n.textContent=Object.keys(st.pickSel).length+' คน';return}
  if(d.roll){const[gid,sid]=d.roll.split(':');st.roll[gid]=st.roll[gid]||{};st.roll[gid][sid]=!st.roll[gid][sid];render();return}
  if(d.rollall||d.rollnone){const gid=d.rollall||d.rollnone,a=ACTS.find(x=>x.id===st.act),g=a.groups.find(x=>x.id===gid);st.roll[gid]={};if(d.rollall)g.students.forEach(id=>st.roll[gid][id]=true);render();return}
  if(d.rollok){const sel=st.roll[d.rollok]||{};act('act.check',{data:{gid:d.rollok,present:Object.keys(sel).filter(k=>sel[k])}},t).then(()=>{st.roll[d.rollok]={}}).catch(()=>{});return}
  if(d.rollnum){act('act.check',{data:{gid:d.rollnum,n:$('#rn'+d.rollnum).value,missing:$('#rm'+d.rollnum).value}},t).catch(()=>{});return}
  /* พัฒนาครู */
  if(d.plc){st.plcOpen=!st.plcOpen;render();return}
  if(d.devopen){st.devOpen=!st.devOpen;render();return}
  if(d.idpopen){st.idpOpen=!st.idpOpen;render();return}
  if(d.supopen){st.supOpen=!st.supOpen;render();return}
  if(d.devdel){if(!confirm('ลบรายการนี้?'))return;act('dev.del',{id:d.devdel},t).catch(()=>{});return}
  if(d.idp){const[id,v]=d.idp.split(':');const g=MY_IDP.find(x=>x.id===id);act('idp.save',{data:{id,pct:clamp(g.pct+(+v),0,100)}},t).catch(()=>{});return}
  if(d.idpdel){if(!confirm('ลบเป้าหมายนี้?'))return;act('idp.save',{data:{id:d.idpdel,del:true}},t).catch(()=>{});return}
  if(d.comp){const[i,v]=d.comp.split(':').map(Number);st.compDraft=(st.compDraft||(B.dev.comp.self||[0,0,0,0,0,0,0,0])).slice();st.compDraft[i]=v;render();return}
  if(d.compsave){if(st.compDraft.some(x=>!x)){toast('ประเมินให้ครบ 8 ด้านก่อน');return}act('comp.save',{data:{self:st.compDraft}},t).then(()=>{st.compDraft=null;render()}).catch(()=>{});return}
  if(d.supok){act('sup.update',{data:{sid:d.supok,op:'confirm'}},t).catch(()=>{});return}
  if(d.supfb){const v=($('#fb'+d.supfb)?.value||'').trim();if(!v){toast('พิมพ์ข้อเสนอแนะก่อน');return}act('sup.update',{data:{sid:d.supfb,op:'feedback',text:v}},t).catch(()=>{});return}
  /* ตั้งค่า */
  if(d.locopen){st.locOpen=!st.locOpen;st.gpsOpen=false;render();return}
  if(d.gpsmain){st.gpsOpen=!st.gpsOpen;st.locOpen=false;render();return}
  if(d.loctoggle){act('loc.toggle',{id:d.loctoggle},t).catch(()=>{});return}
  if(d.qrtoggle){if(!confirm('เปลี่ยนสถานะจุด QR นี้?'))return;act('admin.qrToggle',{code:d.qrtoggle},t).catch(()=>{});return}
  if(d.usehere){t.disabled=true;const lab=t.textContent;t.textContent='กำลังหาตำแหน่ง…';try{const p=await getPos();$('#lc2').value=p.lat.toFixed(7);$('#lc3').value=p.lng.toFixed(7);toast('ใส่ตำแหน่งแล้ว (คลาดเคลื่อน ±'+p.acc+' ม.) กด "บันทึก"')}catch(er){toast(er.message)}t.disabled=false;t.textContent=lab;return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='duty'){st.duty=t.checked;return}
  if(t.id==='o3'){st.outTeach=t.checked;after();return}
  if(t.id==='pc'){st.pc=t.value;updatePick();return}
  if(t.id==='ac3'){syncDraft();$('#acPlaces').innerHTML=placeInputs(st.draft2);return}
  if(t.dataset.et){st['et'+t.dataset.et]=+t.value||0;return}
  if(t.dataset.photo&&t.files?.length){try{const ph=await shrinkPhoto(t.files[0]);act('routine.tick',{data:{rid:t.dataset.photo,photo:ph}}).catch(()=>{})}catch(er){toast(er.message)}return}
  if(t.dataset.jobdone&&t.files?.length){try{const ph=await shrinkPhoto(t.files[0]);act('job.next',{data:{jid:t.dataset.jobdone,photo:ph}}).catch(()=>{})}catch(er){toast(er.message)}return}
});
document.addEventListener('input',e=>{if(e.target.id==='pq'){st.pq=e.target.value;updatePick()}});
function updatePick(){const box=$('#pickBox');if(!box)return;const a=ACTS.find(x=>x.id===st.act),g=a.groups.find(x=>x.id===box.dataset.g);box.innerHTML=pickList(a,g)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(st.sheet){st.sheet=false;renderChrome()}}});
document.addEventListener('submit',async e=>{
  const f=e.target;if(f.closest('#modal')&&['rsForm','qrForm','fcForm','repForm'].includes(f.id))return;
  e.preventDefault();const btn=e.submitter||f.querySelector('button[type=submit]');
  const v=s=>($(s)?.value||'').trim();
  try{
  if(f.id==='fLeave'){const ph=await withPhoto($('#l4'));await act('leave.create',{data:{type:$('input[name="lt"]:checked').value,start:v('#l1'),end:v('#l2'),part:$('#lpart').hidden?'เต็มวัน':$('#l5').value,reason:v('#l3'),photo:ph}},btn)}
  if(f.id==='fOut'){const teach=B.hasTT?!!MY_TT[v('#o1')]:!!st.outTeach;await act('out.create',{data:{period:v('#o1'),why:v('#o2'),teaching:teach,sub:teach?v('#o4'):'',work:teach?v('#o5'):''}},btn);st.outTeach=false}
  if(f.id==='fGov'){await act('leave.create',{data:{type:'ไปราชการ',start:v('#g3'),end:v('#g6')||v('#g3'),reason:v('#g1'),place:v('#g2'),proj:v('#g4'),cost:v('#g5'),attachment:v('#g7')}},btn)}
  if(f.id==='myTaskForm'){const mode=$('input[name="mtm"]:checked').value;await act('work.addMine',{data:{title:v('#mt1'),to:v('#mt2'),due:v('#mt3'),mode,steps:mode==='steps'?$('#mt4').value:''}},btn)}
  if(f.id==='taskForm'){await act('work.add',{data:{title:v('#tk1'),to:v('#tk2'),owner:v('#tk3'),due:v('#tk4'),steps:$('#tk6').value,proj:v('#tk5')}},btn)}
  if(f.id==='cpForm'){if(!v('#cp1')){toast('พิมพ์ชื่อจุดตรวจ');return}await act('cp.add',{name:v('#cp1')},btn)}
  if(f.id==='actForm'){syncDraft();const d=st.draft2;await act('act.create',{data:{name:d.name,start:d.start,days:d.days,places:d.places,cps:d.cps,rows:d.rows}},btn);st.newAct=false;st.draft2={name:'',start:'',days:1,places:[''],cps:st.draft2.cps,rows:[]};render()}
  if(f.id==='cntForm'){await act('act.pick',{data:{gid:f.dataset.g,students:[],count:$('#gc'+f.dataset.g).value}},btn)}
  if(f.id==='jobForm'){await act('job.add',{data:{title:v('#jb1'),place:v('#jb2'),due:v('#jb3'),prio:$('input[name="jp"]:checked').value}},btn)}
  if(f.id==='routineForm'){if(!v('#rt1')){toast('พิมพ์ชื่องานประจำ');return}await act('routine.add',{data:{title:v('#rt1'),when:v('#rt2')}},btn)}
  if(f.id==='fixForm'){const ph=await withPhoto($('#fx3'));await act('fix.add',{data:{title:v('#fx1'),place:v('#fx2'),prio:$('input[name="fp"]:checked').value,photo:ph}},btn)}
  if(f.id==='plcForm'){await act('plc.add',{data:{date:v('#p1'),hours:v('#p2'),grp:v('#p6'),who:$$('input[name="pw"]:checked').map(x=>x.value),prob:v('#p3'),find:v('#p4'),next:v('#p5')}},btn);st.plcOpen=false;render()}
  if(f.id==='devForm'){await act('dev.add',{data:{title:v('#dv1'),date:v('#dv2'),hours:v('#dv3'),kind:v('#dv4'),cert:v('#dv5')}},btn);st.devOpen=false;render()}
  if(f.id==='idpForm'){await act('idp.save',{data:{goal:v('#ip1'),comp:v('#ip2'),act:v('#ip3'),ind:v('#ip4'),pct:0}},btn);st.idpOpen=false;render()}
  if(f.id==='supForm'){await act('sup.add',{data:{who:v('#su1'),date:v('#su2'),period:v('#su3'),focus:v('#su4')}},btn);st.supOpen=false;render()}
  if(f.id==='incForm'){const ph=await withPhoto($('#i3'));await act('incident.add',{data:{place:$('input[name="iw"]:checked')?.value||'',what:v('#i2'),photo:ph}},btn)}
  if(f.id==='visForm'){await act('visit.add',{data:{name:v('#v1'),why:v('#v2'),meet:v('#v3')}},btn)}
  if(f.id==='addSubForm'){await act('sub.add',{data:{date:v('#as1'),period:v('#as2'),absent:v('#as3'),cls:v('#as4'),subj:v('#as5'),work:v('#as6')}},btn);st.addSub=false;render()}
  if(f.id==='ruleForm'){await act('admin.rules',{data:{warn_after:v('#s1'),late_after:v('#s2'),halfday_after:v('#s9'),leave_time_general:v('#s3'),leave_time_duty:v('#s10'),leave_quota_times:v('#s4'),leave_quota_days:v('#s5'),late_quota:v('#s8'),dev_hours_target:v('#s6'),patrol_rounds:v('#s7').replace(/\s+/g,'')}},btn)}
  if(f.id==='locForm'){await act('loc.add',{data:{name:v('#lc1'),lat:v('#lc2'),lng:v('#lc3'),radius:v('#lc4'),kind:$('input[name="lk"]:checked').value,from:v('#lc5'),to:v('#lc6')}},btn);st.locOpen=false;render()}
  if(f.id==='gpsForm'){await act('admin.gps',{data:{lat:v('#lc2'),lng:v('#lc3'),radius:v('#lc4')}},btn);st.gpsOpen=false;render()}
  if(f.id==='qrAddForm'){if(!v('#qa1')){toast('พิมพ์ชื่อจุด');return}await act('admin.qrAdd',{name:v('#qa1')},btn)}
  }catch(er){/* แสดงข้อความแล้วใน act() */}
});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clockNow()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&B&&Date.now()-st.fetchedAt>60000)refresh(true)});
boot();
})();

</script>
</body>
