<style>
/* หน้าตาเดียวกับหน้ากลาง Q-Kawa 1.5 · โทนม่วงคราม การ์ดขาวขอบมน · มือถือ <1000px / คอมพิวเตอร์มีเมนูซ้าย */
:root{
  --bg:#F3F4FB; --bg-top:#ECEBFF; --card:#FFFFFF; --soft:#F2F3F9; --line:#E7E9F3; --ink:#1B1F3B; --muted:#6B7092; --faint:#A3A7C2;
  --pri:#5B5BF0; --pri2:#8B6CF7; --pri-soft:#ECEBFE; --on-pri:#FFFFFF; --navy:#1E2341; --navy2:#2C3263;
  --ok:#1E9E66; --ok-bg:#E2F6EC; --warn:#C27803; --warn-bg:#FFF1D9; --bad:#E04850; --bad-bg:#FDE8E9;
  --t-c:#5B5BF0; --t-bg:#ECEBFE; --b-c:#E9820C; --b-bg:#FFF0DC; --s-c:#11A188; --s-bg:#DDF5EF; --p-c:#E0498D; --p-bg:#FDE6F0; --h-c:#2C8CE6; --h-bg:#E2F0FD; --g-c:#5D6385; --g-bg:#EEF0F7;
  --shadow:0 8px 28px rgba(44,48,110,.07),0 1px 2px rgba(44,48,110,.04);
  --f:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif; --fh:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1022; --bg-top:#171A3A; --card:#171A31; --soft:#1F2340; --line:#2A2E50; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296;
  --pri:#8C8CFF; --pri2:#B39BFF; --pri-soft:#262A5C; --on-pri:#0E1022; --navy:#0A0C1C; --navy2:#1B1F45;
  --ok:#6BD6A3; --ok-bg:#15352A; --warn:#F5C26B; --warn-bg:#3A2D12; --bad:#FF8F95; --bad-bg:#40191D;
  --t-c:#A3A3FF; --t-bg:#262A5C; --b-c:#FFB866; --b-bg:#3A2A14; --s-c:#6EE0C7; --s-bg:#123A33; --p-c:#FF93C0; --p-bg:#401B2E; --h-c:#86C2FF; --h-bg:#16304A; --g-c:#C3C6E0; --g-bg:#262A45;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) no-repeat;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:23px;letter-spacing:-.01em} h2{font-size:18px} h3{font-size:15.5px}
p{margin:0}
a{color:var(--pri)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 10px}
.sec h3{font-size:16px}
.sec button{border:0;background:none;color:var(--pri);font-size:13.5px;font-weight:500;padding:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.pri{background:var(--pri-soft);color:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:13px 16px;font-size:15.5px;border-radius:16px}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.c-t{background:var(--t-bg);color:var(--t-c)} .c-b{background:var(--b-bg);color:var(--b-c)} .c-s{background:var(--s-bg);color:var(--s-c)} .c-p{background:var(--p-bg);color:var(--p-c)} .c-h{background:var(--h-bg);color:var(--h-c)} .c-g{background:var(--g-bg);color:var(--g-c)} .c-w{background:var(--warn-bg);color:var(--warn)} .c-r{background:var(--bad-bg);color:var(--bad)} .c-o{background:var(--ok-bg);color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:22px}
.list{display:flex;flex-direction:column;gap:10px}
/* แถวงาน */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.task .tx{flex:1;min-width:0}
.task .t1{font-weight:500;display:block}
.task .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.task .chev{color:var(--faint)}
/* ช่องสถิติ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.stat .ic{width:38px;height:38px;border-radius:50%}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
/* ปุ่มด่วน */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);text-align:center;line-height:1.25}
.qa .ic{width:54px;height:54px;border-radius:18px}
.qa .ic svg{width:24px;height:24px}
/* แอป */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.app{border:0;background:none;padding:6px 2px;text-align:center;font-size:12.5px;line-height:1.3;border-radius:14px;font-weight:500}
.app .ic{width:54px;height:54px;border-radius:18px;margin:0 auto 7px}
.app .ic svg{width:25px;height:25px}
.app small{display:block;color:var(--faint);font-size:11.5px;font-weight:400}
.app.off .ic{opacity:.55}
/* ประกาศ */
.ann{border:0;border-radius:18px;padding:14px 16px;background:var(--card);box-shadow:var(--shadow);display:block;width:100%;text-align:left}
.ann .pv{color:var(--muted);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 16px;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);font-weight:500}
/* สวิตช์ แถว ฟอร์ม */
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{left:21px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t2{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font-size:15px;color:var(--ink);text-decoration:none}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:12px}
.mrow .tx{flex:1}
.mrow .chev{color:var(--faint)}
.form{display:grid;gap:14px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:6px;font-weight:500}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);width:100%;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{min-height:120px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;align-items:center;gap:8px}
.check input{width:auto}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.err{font-size:14px;color:var(--bad);background:var(--bad-bg);border-radius:14px;padding:10px 14px}
.credit{font-size:12px;color:var(--faint);text-align:center;padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;max-width:min(92vw,460px);z-index:30;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.body{white-space:pre-wrap;word-wrap:break-word}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.code{font-size:36px;letter-spacing:.2em;font-weight:600;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--pri)}
.copybox{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-input{font-size:30px!important;letter-spacing:.35em;text-align:center;font-weight:600!important}
.overlay{position:fixed;inset:0;background:rgba(20,22,50,.4);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86vh}}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;overflow:hidden;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover}
.bell{position:relative;background:var(--card);border:0;box-shadow:var(--shadow);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center;font-weight:600}
/* การ์ดเด่น */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#4B47C9 100%);box-shadow:0 14px 34px rgba(40,40,120,.22)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,247,.55),rgba(139,108,247,0) 70%)}
.hero .in{position:relative;z-index:1;display:flex;align-items:center;gap:18px}
.hero .k{font-size:13px;opacity:.75}
.hero h2{font-size:19px;margin-top:3px}
.hero .s{font-size:13.5px;opacity:.8;margin-top:4px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .v b{font-size:26px;font-weight:600}
.ring .v small{font-size:12px;opacity:.8}
.hero-ic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.hero-ic svg{width:30px;height:30px}
/* ปฏิทิน */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:var(--shadow)}
.wd{border:0;background:none;border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.wd small{font-size:11.5px;color:var(--muted)}
.wd b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.on{background:var(--pri)}
.wd[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.wd[aria-pressed="true"] small{color:var(--on-pri);opacity:.85}
.wd[aria-pressed="true"] i.on{background:var(--on-pri)}
.ev{display:flex;gap:14px;align-items:stretch}
button.ev{border:0;background:none;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
.ev .c .edit{float:right;color:var(--muted);margin-left:8px}
.ev .d{width:52px;flex:none;text-align:center;padding-top:10px;line-height:1.15}
.ev .d b{display:block;font-size:20px;font-weight:600}
.ev .d span{font-size:12px;color:var(--muted)}
.ev .c{flex:1;border-radius:16px;padding:12px 14px;border-left:4px solid var(--pri);background:var(--pri-soft)}
.ev .c.hol{border-color:var(--bad);background:var(--bad-bg)}
.ev .c.term{border-color:var(--s-c);background:var(--s-bg)}
.ev .c .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
/* โปรไฟล์ */
.prof{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:26px;padding:22px 20px 16px;box-shadow:0 14px 34px rgba(30,35,65,.25)}
.prof .avatar{width:72px;height:72px;font-size:28px;border:3px solid rgba(255,255,255,.25)}
.prof .pst{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 0}
.prof .pst div{text-align:center;border-left:1px solid rgba(255,255,255,.12)}
.prof .pst div:first-child{border-left:0}
.prof .pst b{display:block;font-size:20px;font-weight:600}
.prof .pst span{font-size:12px;opacity:.75}
/* หน้าเข้าสู่ระบบ */
.intro{min-height:100vh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.intro .logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:26px;box-shadow:0 10px 24px rgba(91,91,240,.35)}
.intro h1{font-size:32px;line-height:1.2;margin-top:22px}
.intro h1 em{font-style:normal;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .lead{color:var(--muted);margin-top:10px}
.intro .art{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0;min-height:150px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.center .card{max-width:420px;width:100%}
/* มือถือ / iPad */
.m-shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.m-main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.m-top{display:flex;align-items:center;gap:12px;padding:4px 0 18px}
.m-nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(44,48,110,.08);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.m-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--faint);padding:4px 0;position:relative}
.m-nav button[aria-current="page"]{color:var(--pri);font-weight:600}
.m-nav .fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin:-30px auto 2px;padding:0;justify-content:center;box-shadow:0 10px 22px rgba(91,91,240,.4)}
.m-nav .fab svg{width:26px;height:26px;stroke-width:2.2}
.m-nav .dot{top:-2px;right:calc(50% - 22px)}
/* คอมพิวเตอร์ */
.d-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .lg{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.side .new{margin:0 4px 12px}

<script>
'use strict';
const ICON={

const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${s?` style="width:${s}px;height:${s}px"`:''}>${ICON[n]||''}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


Object.assign(ICON,{
pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
qr:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2M18 18h2v2M20 14v2"/>',
doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
board:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15v-3M12 15V9M16 15v-5"/>',
hist:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4M12 8v4l3 2"/>',
grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
print:'<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
car:'<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3zM7 19v1M17 19v1"/>'
});
const ERR={NETWORK:'เชื่อมต่อไม่ได้ ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่'};
const S={home:null,page:'home',leaveFilter:'mine',board:null,boardDate:null,boardView:'today'};
const wide=matchMedia('(min-width:1000px)');
wide.addEventListener('change',()=>render());

/* ---------- เชื่อมหลังบ้าน ---------- */
async function api(action,payload){
  let r;
  try{ r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,idToken:liff.getIDToken()},payload||{}))}); }
  catch(e){ const er=new Error(ERR.NETWORK); er.code='NETWORK'; throw er; }
  let j;
  try{ j=await r.json(); }catch(e){ const er=new Error('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy Apps Script)'); er.code='BAD_RESPONSE'; throw er; }
  if(!j.ok){
    if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN') relogin();
    const er=new Error(ERR[j.code]||j.error||j.code); er.code=j.code; throw er;
  }
  return j;
}
function relogin(){
  let n=0; try{ n=Number(sessionStorage.getItem('qt_relogin')||0); sessionStorage.setItem('qt_relogin',String(n+1)); }catch(e){}
  if(n>1) return;
  if(liff.isInClient()) location.reload(); else { try{ liff.logout(); }catch(e){} liff.login({redirectUri:location.href}); }
}

/* ---------- เริ่มต้น ---------- */
async function boot(){
  if(!CONFIG.LIFF_ID||!CONFIG.API_URL) return screen(`<h2>Q-Teacher</h2><p class="note">ยังไม่ได้ตั้งค่า API_URL ในไฟล์ teacher/index.html</p>`);
  try{ await liff.init({liffId:CONFIG.LIFF_ID}); }
  catch(e){ return screen(errBox('เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ',e.message)); }
  if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
  const cached=cacheGet();
  if(cached){ S.home=cached; S.stale=true; render(); }
  try{ await loadHome(); try{ sessionStorage.removeItem('qt_relogin'); }catch(e){} }
  catch(e){
    if(e.code==='NOT_LINKED'){ cacheClear(); return screen(`<h2 style="text-align:center">ยังไม่ได้ผูกบัญชี</h2><p class="note">ผูกบัญชี LINE กับโรงเรียนที่หน้ากลาง Q-Kawa ก่อน (กรอกรหัส 6 หลักจาก ผอ.) แล้วกลับมาที่นี่</p><a class="btn pri block" href="${esc(CONFIG.HUB_URL)}">ไปหน้ากลาง Q-Kawa</a>`); }
    if(e.code==='APP_OFF'){ cacheClear(); return screen(`<h2 style="text-align:center">Q-Teacher ยังไม่เปิดใช้</h2><p class="note">${esc(e.message)}</p><a class="btn block" href="${esc(CONFIG.HUB_URL)}">กลับหน้ากลาง</a>`); }
    if(cached){ toast('ยังโหลดข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลครั้งก่อน'); return; }
    screen(errBox('โหลดข้อมูลไม่สำเร็จ',e.message));
  }
}
function cacheKey(){ try{ return 'qt_home_'+((liff.getDecodedIDToken()||{}).sub||''); }catch(e){ return ''; } }
function cacheGet(){ try{ const k=cacheKey(); if(!k) return null; const v=JSON.parse(localStorage.getItem(k)||'null'); return v&&v.me&&v.today&&v.today.date===todayLocal()?v:null; }catch(e){ return null; } }
function cacheSet(v){ try{ const k=cacheKey(); if(k) localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function cacheClear(){ try{ const k=cacheKey(); if(k) localStorage.removeItem(k); }catch(e){} }
function screen(html){ document.getElementById('app').innerHTML=`<div class="center"><div class="card stack" style="gap:14px"><div class="intro" style="min-height:auto;padding:0;align-items:center"><div class="logo">T</div></div>${html}<p class="credit">Q-Teacher · ผู้พัฒนา: นายฮาฟีซี อูมา</p></div></div>`; }
function errBox(t,m){ return `<h2 style="text-align:center">${esc(t)}</h2><p class="err">${esc(m)}</p><button class="btn pri block" data-act="reload">ลองใหม่</button>`; }
async function loadHome(){ applyHome(await api('home')); }
function applyHome(r,noRender){ if(!r) return; S.home=r; S.stale=false; S.fetchedAt=Date.now(); cacheSet(r); if(!noRender) render(); }

/* ---------- วันที่ ---------- */
function d8(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayLocal(){ return ymd(new Date()); }
function thDate(s,opt){ try{ return d8(s).toLocaleDateString('th-TH',opt||{day:'numeric',month:'short',year:'2-digit'}); }catch(e){ return s; } }
function thDT(s){ if(!s) return ''; return thDate(s)+(s.length>10?' '+s.slice(11,16)+' น.':''); }
function greet(){ const h=new Date().getHours(); return h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น'; }
function clock(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function range(a,b,part){ if(a===b) return thDate(a,{weekday:'short',day:'numeric',month:'short',year:'2-digit'})+(part&&part!=='เต็มวัน'?' ('+part+')':''); return thDate(a,{day:'numeric',month:'short'})+' – '+thDate(b); }
function num(n){ return Number.isInteger(n)?String(n):String(n).replace(/\.5$/,'.5'); }

/* ---------- ป้ายสถานะ ---------- */
const ST_PILL={'ตรงเวลา':'ok','ไฟเหลือง':'warn','สาย':'bad','สายเกิน 09:00':'bad','ปกติ':'ok','กลับก่อนเวลา':'warn'};
function stPill(st){ return st?`<span class="pill ${ST_PILL[st]||''}">${esc(st)}</span>`:''; }
const LV_PILL={'รอเห็นชอบ':'warn','รออนุมัติ':'warn','อนุมัติ':'ok','ไม่เห็นชอบ':'bad','ไม่อนุมัติ':'bad','ยกเลิก':''};
function lvPill(st){ return `<span class="pill ${LV_PILL[st]||''}">${esc(st)}</span>`; }
const METHOD={gps:'GPS',qr:'สแกน QR',admin:'ลงแทน'};
function methodTxt(x){ if(!x) return ''; return (METHOD[x.method]||x.method)+(x.method==='gps'&&x.dist?' · ห่าง '+x.dist+' ม.':'')+(x.method==='qr'&&x.point?' · '+x.point:'')+(x.method==='admin'&&x.point?' · '+x.point:''); }

/* ---------- โครงหน้า ---------- */
function canBoard(){ const m=S.home.me; return m.isAdmin||m.isHR; }
function render(){
  if(!S.home) return;
  const body=pageBody();
  const el=document.getElementById('app');
  const n=S.home.tasks.length;
  if(wide.matches){
    const items=[{id:'home',label:'ลงเวลา',icon:'clock'},{id:'leave',label:'ใบลา / ไปราชการ',icon:'doc',badge:n},{id:'history',label:'ประวัติของฉัน',icon:'hist'}];
    if(canBoard()) items.push({id:'board',label:'การมาปฏิบัติงาน',icon:'board'});
    const adm=S.home.me.isAdmin?[{id:'gps',label:'จุดลงเวลา GPS',icon:'pin',c:'h'},{id:'qr',label:'จุด QR สำรอง',icon:'qr',c:'g'}]:[];
    const nv=i=>`<button class="nv" data-go="${i.id}"${S.page===i.id?' aria-current="page"':''}><span class="sq${i.c?' c-'+i.c:''}">${ic(i.icon)}</span>${i.label}${i.badge?`<span class="n">${i.badge}</span>`:''}</button>`;
    el.innerHTML=`<div class="d-shell"><nav class="side" aria-label="เมนูหลัก">
      <div class="brand"><div class="lg">T</div><div><b>Q-Teacher</b><small>โรงเรียนบ้านกาวะ</small></div></div>
      <button class="btn pri new" data-act="newLeave">${ic('plus',18)} ยื่นใบลา / ไปราชการ</button>
      ${items.map(nv).join('')}${adm.length?`<div class="grp">ผู้ดูแลระบบ</div>${adm.map(nv).join('')}`:''}
      <div class="grp">ชุดแอป Q-Kawa</div><a class="nv" href="${esc(CONFIG.HUB_URL)}" style="text-decoration:none"><span class="sq c-t">${ic('grid')}</span>กลับหน้ากลาง</a>
      <div style="flex:1"></div><p class="credit">ผู้พัฒนา: นายฮาฟีซี อูมา</p></nav>
      <main class="d-main">${body}</main></div>`;
  }else{
    const cur=['gps','qr'].includes(S.page)?'menu':S.page;
    const b=(id,label,icon,badge)=>`<button data-go="${id}"${cur===id?' aria-current="page"':''}>${ic(icon,22)}${label}${badge?`<span class="dot">${badge}</span>`:''}</button>`;
    el.innerHTML=`<div class="m-shell"><main class="m-main">${body}</main>
      <nav class="m-nav" aria-label="เมนูหลัก">${b('home','ลงเวลา','clock')}${b('leave','ใบลา','doc',n)}
        <button class="fab" data-act="newLeave" aria-label="ยื่นใบลา">${ic('plus')}</button>
        ${canBoard()?b('board','ภาพรวม','board'):b('history','ประวัติ','hist')}${b('menu','เมนู','menu')}</nav></div>`;
  }
}
function avatar(){ const m=S.home.me; return `<div class="avatar">${m.picture?`<img src="${esc(m.picture)}" alt="">`:esc((m.name.replace(/^(นาย|นางสาว|นาง)/,'')||'?').charAt(0))}</div>`; }
function rolesText(){ const r=S.home.me.roles.filter(x=>x!=='ครู'); return r.length?r.join(' · '):(S.home.me.roles[0]||S.home.me.position||''); }
function pageBody(){
  switch(S.page){
    case 'leave': return pageLeave();
    case 'history': return pageHistory();
    case 'board': return canBoard()?pageBoard():pageHome();
    case 'menu': return pageMenu();
    case 'gps': return S.home.me.isAdmin?pageGps():pageHome();
    case 'qr': return S.home.me.isAdmin?pageQr():pageHome();
    default: return pageHome();
  }

/* ---------- ลงเวลา: ตำแหน่ง / QR / เหตุผล ---------- */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){ const e=new Error('เครื่องนี้ไม่รองรับการหาตำแหน่ง'); e.code='NO_GEO'; return rej(e); }
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),
      e=>{ const er=new Error(e.code===1?'LINE ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง':e.code===3?'หาตำแหน่งนานเกินไป (สัญญาณ GPS อ่อน)':'หาตำแหน่งไม่ได้'); er.code=e.code===1?'DENIED':'NO_POS'; rej(er); },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
function busy(msg){ modal(`<div class="stack" style="align-items:center;gap:6px;padding:18px 0"><div class="spin" style="margin:6px auto"></div><p>${esc(msg)}</p></div>`); }
async function startCheck(kind,useQr){
  const data={kind,duty:kind==='in'?!!S.duty:undefined};
  if(useQr){ const code=await scanQr(); if(!code) return; data.qr=code; return sendCheck(data); }
  busy('กำลังหาตำแหน่งของคุณ…');
  try{ Object.assign(data,await getPos()); }
  catch(e){ return locFail(kind,e); }
  sendCheck(data);
}
function locFail(kind,e){
  const help=e.code==='DENIED'?`<p class="note">วิธีอนุญาต: ตั้งค่าโทรศัพท์ → แอป LINE → ตำแหน่ง → "ขณะใช้แอป" แล้วกลับมากดใหม่</p>`:'';
  modal(`<div class="stack" style="gap:14px"><h2>${ic('pin',22)} หาตำแหน่งไม่ได้</h2><p class="err">${esc(e.message)}</p>${help}
    <button class="btn pri block" data-act="${kind==='in'?'qrIn':'qrOut'}">${ic('qr',18)} สแกน QR ที่โรงเรียนแทน</button>
    <button class="btn block" data-act="${kind==='in'?'checkIn':'checkOut'}">${ic('refresh',18)} ลองหาตำแหน่งอีกครั้ง</button>
    <button class="btn block" data-act="close">ปิด</button></div>`);
}
async function sendCheck(data){
  busy('กำลังบันทึกเวลา…');
  try{
    const r=await api('check',{data});
    const x=r.result;
    modal(`<div class="stack" style="align-items:center;text-align:center;gap:10px;padding:8px 0">
      <span class="ic c-o" style="width:72px;height:72px;border-radius:50%">${ic('check',36)}</span>
      <h2>${x.kind==='in'?'ลงเวลามาแล้ว':'ลงเวลากลับแล้ว'}</h2>
      <p class="code" style="font-size:40px;letter-spacing:0">${esc(x.time)} น.</p>
      <p>${stPill(x.status)}</p><p class="t2">${esc(methodTxt(x))}</p>
      ${x.status==='สายเกิน 09:00'?'<button class="btn pri block" data-act="halfLeave">ยื่นใบลาครึ่งวันเช้า</button>':''}
      <button class="btn block" data-act="close">ปิด</button></div>`);
    applyHome(r.home);
  }catch(e){
    if(e.code==='NEED_REASON') return askReason(data,e.message);
    if(e.code==='OUT_OF_AREA'||e.code==='NO_LOCATION'||e.code==='BAD_QR') return modal(`<div class="stack" style="gap:14px"><h2>${e.code==='BAD_QR'?'QR ไม่ถูกต้อง':'อยู่นอกพื้นที่โรงเรียน'}</h2><p class="err">${esc(e.message)}</p>
      <button class="btn pri block" data-act="${data.kind==='in'?'qrIn':'qrOut'}">${ic('qr',18)} สแกน QR ที่โรงเรียน</button>
      ${data.qr?'':`<button class="btn block" data-act="${data.kind==='in'?'checkIn':'checkOut'}">${ic('refresh',18)} ลองหาตำแหน่งอีกครั้ง</button>`}
      <button class="btn block" data-act="close">ปิด</button></div>`);
    closeModal(); toast(e.message);
    if(e.code==='ALREADY') loadHome().catch(()=>{});
  }
}
function askReason(data,msg){
  modal(`<form class="form" id="rsForm"><h2>แจ้งเหตุผล</h2><p class="note warn">${esc(msg)}</p>
    <label>เหตุผล<textarea name="note" maxlength="300" required style="min-height:90px" placeholder="${data.kind==='in'?'เช่น รถเสีย พาลูกไปโรงพยาบาล':'เช่น ไปประชุมที่เขตพื้นที่'}"></textarea></label>
    <button class="btn pri block" type="submit">บันทึกเวลาพร้อมเหตุผล</button>
    ${/ลาครึ่งวัน/.test(msg)?'<button type="button" class="btn block" data-act="halfLeave">ยื่นใบลาครึ่งวันเช้าแทน</button>':''}
    <button type="button" class="btn block" data-act="close">ยกเลิก</button></form>`);
  const f=document.getElementById('rsForm');
  f.addEventListener('submit',e=>{ e.preventDefault(); const note=f.note.value.trim(); if(!note) return; sendCheck(Object.assign({},data,{note})); });
}
async function scanQr(){
  try{
    if(liff.isInClient()&&liff.isApiAvailable&&liff.isApiAvailable('scanCodeV2')){
      const r=await liff.scanCodeV2();
      if(r&&r.value) return r.value;
      return null;
    }
  }catch(e){ /* ใช้วิธีพิมพ์รหัสแทน */ }
  return await askCode();
}
function askCode(){
  return new Promise(res=>{
    modal(`<form class="form" id="qrForm"><h2>${ic('qr',22)} พิมพ์รหัสใต้ QR</h2>
      <p class="note">ถ้าเปิดกล้องสแกนไม่ได้ ให้พิมพ์รหัส 6 ตัวที่อยู่ใต้รูป QR ที่ติดในโรงเรียน (ต่อจาก QKAWA-T-)</p>
      <label>รหัส<input name="code" class="big-input" maxlength="16" autocomplete="off" autocapitalize="characters" required style="letter-spacing:.15em"></label>
      <button class="btn pri block" type="submit">ตกลง</button><button type="button" class="btn block" data-act="close">ยกเลิก</button></form>`);
    const f=document.getElementById('qrForm');
    f.addEventListener('submit',e=>{ e.preventDefault(); res(f.code.value.trim()); });
    const obs=new MutationObserver(()=>{ if(document.getElementById('modal').hidden){ obs.disconnect(); res(null); } });
    obs.observe(document.getElementById('modal'),{attributes:true});
  });
}

function workDays(type,a,b,part){
  if(!a||!b||b<a) return 0;
  if(part&&part!=='เต็มวัน') return 0.5;
  const hol=new Set(S.home.holidays||[]); let n=0;
  for(let d=d8(a);ymd(d)<=b;d.setDate(d.getDate()+1)){ if(type==='ไปราชการ'){n++;continue;} const w=d.getDay(); if(w&&w<6&&!hol.has(ymd(d))) n++; }
  return n;
}
function leaveForm(pre){
  const h=S.home, s=h.stats, t=h.today.date; pre=pre||{};
  modal(`<form class="form" id="lvForm">

    <label id="partL">ช่วงเวลา<select name="part">${['เต็มวัน','ครึ่งวันเช้า','ครึ่งวันบ่าย'].map(x=>`<option${pre.part===x?' selected':''}>${x}</option>`).join('')}</select></label>
    <label id="placeL" hidden>สถานที่ไปราชการ<input name="place" maxlength="200" placeholder="เช่น สพป.นราธิวาส เขต 2"></label>
    <label>เหตุผล / เรื่อง<textarea name="reason" maxlength="500" required style="min-height:80px">${esc(pre.reason||'')}</textarea></label>
    <label>ลิงก์ไฟล์แนบใน Drive (ถ้ามี เช่น ใบรับรองแพทย์ หนังสือเชิญ)<input type="url" name="attachment" placeholder="https://drive.google.com/…"></label>
    <p class="note" id="lvSum"></p>
    <p class="err" id="lvErr" hidden></p>
    <button class="btn pri block" type="submit">ส่งใบ</button></form>`);
  const f=document.getElementById('lvForm');
  const upd=()=>{
    if(f.end.value<f.start.value) f.end.value=f.start.value;
    const same=f.start.value===f.end.value; document.getElementById('partL').hidden=!same; if(!same) f.part.value='เต็มวัน';
    const off=f.type.value==='ไปราชการ'; document.getElementById('placeL').hidden=!off; f.place.required=off;
    const n=workDays(f.type.value,f.start.value,f.end.value,f.part.value);
    const quota=['ลาป่วย','ลากิจส่วนตัว'].includes(f.type.value);
    const flow=h.me.isDirector?'ใบของ ผอ. บันทึกเป็นอนุมัติทันที':h.me.isHR?'ส่งถึง ผอ. อนุมัติ':'ส่งถึงหัวหน้างานบุคคลเห็นชอบ แล้ว ผอ. อนุมัติ';
    document.getElementById('lvSum').innerHTML=`<b>${num(n)} วัน</b>${off?' (นับทุกวัน)':' (เฉพาะวันทำการ)'} · ${flow}${quota?`<br>รอบนี้ลาป่วย+กิจไปแล้ว ${num(s.leaveDays)}/${s.quota.days} วัน ${s.leaveTimes}/${s.quota.times} ครั้ง${s.quota.sample?' (โควตาค่าตัวอย่าง)':''}`:''}${f.type.value==='ลาป่วย'?'<br>ลาป่วยตั้งแต่ 30 วันขึ้นไปต้องมีใบรับรองแพทย์':''}`;
  };
  f.addEventListener('input',upd); f.addEventListener('change',upd); upd();

    ev.preventDefault();

let qrLib=null;
function loadQrLib(){ if(qrLib) return qrLib; qrLib=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload=res; s.onerror=()=>{qrLib=null;rej(new Error('โหลดตัวสร้าง QR ไม่ได้'));}; document.head.appendChild(s); }); return qrLib; }
function pageQr(){

  return head('จุด QR สำรอง','ใช้เมื่อ GPS จับไม่ได้ · พิมพ์ติดในโรงเรียน','',wide.matches?'':'menu')+`<div class="stack" style="gap:16px">

  <div class="qrgrid">${pts.map(p=>`<div class="card qrcard${p.active?'':' off'}" id="qc-${esc(p.code)}"><div class="qrimg" data-qr="${esc(p.code)}"></div>
    <b class="qrname">${esc(p.name)}</b><div class="qrcode">${esc(p.code.replace('QKAWA-T-',''))}</div><div class="t2 noprint">${p.active?'ใช้งานอยู่':'ปิดแล้ว'}</div>
    <div class="noprint" style="display:flex;gap:8px;margin-top:8px">${p.active?`<button class="btn sm" data-act="qrPrint" data-id="${esc(p.code)}">${ic('print',16)} พิมพ์</button>`:''}<button class="btn sm${p.active?' bad':''}" data-act="qrToggle" data-id="${esc(p.code)}">${p.active?'ปิดใช้':'เปิดใช้'}</button></div></div>`).join('')}</div>
  <form class="form card" id="qrAdd" style="padding:16px 18px"><h3>เพิ่มจุด QR</h3><label>ชื่อจุด<input name="name" maxlength="60" required placeholder="เช่น ประตูหน้า ห้องพักครู"></label><button class="btn pri block" type="submit">เพิ่มจุด</button></form></div>`;

async function drawQrs(){
  const els=document.querySelectorAll('[data-qr]'); if(!els.length) return;
  try{ await loadQrLib(); }catch(e){ els.forEach(el=>{el.textContent=e.message;}); return; }
  els.forEach(el=>{ if(el.childNodes.length) return; new QRCode(el,{text:el.dataset.qr,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); });
}

/* ---------- ตัวช่วย ---------- */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},3600); }
function modal(html){ const m=document.getElementById('modal'); m.hidden=false; m.innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; }
function go(p){
  S.page=p; render(); window.scrollTo(0,0);
  if(['home','leave','history'].includes(p) && Date.now()-(S.fetchedAt||0)>60000 && !S.loading){
    S.loading=true; loadHome().catch(()=>{}).finally(()=>{S.loading=false;});
  }
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('คัดลอกแล้ว นำไปวางในไลน์ได้เลย'); }
  catch(e){ modal(`<div class="stack" style="gap:12px"><h2>คัดลอกข้อความ</h2><p class="t2">กดค้างที่ข้อความแล้วเลือก "คัดลอก"</p><div class="copybox">${esc(txt)}</div><button class="btn block" data-act="close">ปิด</button></div>`); }
}

document.addEventListener('change',ev=>{
  if(ev.target.id==='duty'){ S.duty=ev.target.checked; render(); }
  if(ev.target.id==='bdate'&&ev.target.value){ S.boardDate=ev.target.value; S.board=null; render(); }
});
document.addEventListener('submit',async ev=>{
  const f=ev.target;
  if(f.id==='gpsForm'){
    ev.preventDefault();
    const b=f.querySelector('button[type=submit]'); b.disabled=true;
    try{ const r=await api('admin.gps',{data:{lat:f.lat.value,lng:f.lng.value,radius:f.radius.value}}); toast('บันทึกจุดลงเวลาแล้ว'); applyHome(r.home); }
    catch(e){ const er=document.getElementById('gpsErr'); er.hidden=false; er.textContent=e.message; b.disabled=false; }
  }
  if(f.id==='qrAdd'){
    ev.preventDefault();
    const b=f.querySelector('button[type=submit]'); b.disabled=true;
    try{ const r=await api('admin.qrAdd',{name:f.name.value}); toast('เพิ่มจุด QR แล้ว'); applyHome(r.home); }
    catch(e){ toast(e.message); b.disabled=false; }
  }
});
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-go],[data-act],[data-leave],[data-lf],[data-bv]');
  if(!t) return;
  if(t.dataset.go){ if(t.dataset.f) S.leaveFilter=t.dataset.f; go(t.dataset.go); return; }
  if(t.dataset.leave){ leaveDetail(t.dataset.leave); return; }
  if(t.dataset.lf){ S.leaveFilter=t.dataset.lf; render(); return; }
  if(t.dataset.bv){ S.boardView=t.dataset.bv; render(); return; }
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='overlay'){ if(ev.target===t) closeModal(); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='reload'){ location.reload(); return; }
  if(act==='refresh'){ try{ await loadHome(); toast('โหลดข้อมูลใหม่แล้ว'); }catch(e){ toast(e.message); } return; }
  if(act==='checkIn'){ startCheck('in',false); return; }
  if(act==='checkOut'){ startCheck('out',false); return; }
  if(act==='qrIn'){ closeModal(); startCheck('in',true); return; }
  if(act==='qrOut'){ closeModal(); startCheck('out',true); return; }
  if(act==='newLeave'){ leaveForm(); return; }
  if(act==='halfLeave'){ leaveForm({type:'ลากิจส่วนตัว',start:S.home.today.date,part:'ครึ่งวันเช้า'}); return; }
  if(act==='lvYes'||act==='lvNo'){
    const note=(document.getElementById('lvNote')||{}).value||'';
    const ok=act==='lvYes';
    if(!ok&&!note.trim()){ toast('กรุณาใส่เหตุผลในช่องความเห็น'); return; }
    t.disabled=true;
    try{ const r=await api(t.dataset.who==='hr'?'leave.hr':'leave.dir',{id,approve:ok,note}); closeModal(); toast(r.leave.status); applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='lvCancel'){
    if(!confirm('ยกเลิกใบนี้?')) return;
    t.disabled=true;
    try{ const r=await api('leave.cancel',{id}); closeModal(); toast('ยกเลิกแล้ว'); applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='forCheck'){ forCheckForm(id); return; }
  if(act==='copyBoard'){ copyText(boardText()); return; }
  if(act==='reBoard'){ S.board=null; render(); return; }
  if(act==='useHere'||act==='myDist'){
    const out=document.getElementById('distOut');
    t.disabled=true; const label=t.innerHTML; t.textContent='กำลังหาตำแหน่ง…';
    try{
      const p=await getPos();
      if(act==='useHere'){ const f=document.getElementById('gpsForm'); f.lat.value=p.lat.toFixed(7); f.lng.value=p.lng.toFixed(7); toast('ใส่ตำแหน่งแล้ว (คลาดเคลื่อน ±'+p.acc+' ม.) กด "บันทึก"'); }
      else { const g=S.home.gps; const m=Math.round(dist(p.lat,p.lng,g.lat,g.lng)); out.textContent='ห่างประมาณ '+m+' เมตร (GPS คลาด ±'+p.acc+' ม.) · '+(m-Math.min(p.acc,100)<=g.radius?'อยู่ในวง ลงเวลาได้':'อยู่นอกวง'); }
    }catch(e){ toast(e.message); }
    t.disabled=false; t.innerHTML=label; return;
  }
  if(act==='qrToggle'){
    const p=(S.home.qrPoints||[]).find(x=>x.code===id);
    if(p&&p.active&&!confirm('ปิดจุด "'+p.name+'" ?\nรูป QR ที่พิมพ์ไว้จะใช้ไม่ได้อีก')) return;
    t.disabled=true;
    try{ const r=await api('admin.qrToggle',{code:id}); toast('บันทึกแล้ว'); applyHome(r.home); }
    catch(e){ toast(e.message); t.disabled=false; }
    return;
  }
  if(act==='qrPrint'){
    const card=document.getElementById('qc-'+id); if(!card) return;
    card.classList.add('printme'); window.print(); setTimeout(()=>card.classList.remove('printme'),500); return;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
setInterval(()=>{ const c=document.getElementById('clk'); if(c) c.textContent=clock(); },15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.home&&Date.now()-(S.fetchedAt||0)>60000){ if(S.home.today.date!==todayLocal()) { cacheClear(); } loadHome().catch(()=>{}); } });

boot();

</script>
</body>
</html>
