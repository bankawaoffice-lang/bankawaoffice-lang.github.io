<script>
/* ตัวเฝ้าหน้า: ถ้าค้างที่หน้า "กำลังเปิด…" เกิน 15 วินาที หรือมี error ก่อนหน้าแรกวาดเสร็จ ให้ขึ้นข้อความบอกสาเหตุ + ปุ่มลองใหม่ (ไม่ขึ้นกับสคริปต์หลัก) */
(function(){
  var W=window;W.__qkStage='script';W.__qkErr='';var T0=Date.now();
  var WHY={script:'ไฟล์หน้าเว็บโหลดไม่ครบ หรือสคริปต์ยังไม่เริ่มทำงาน (เน็ตช้า หรือไฟล์ที่ต้องใช้โหลดไม่ได้)',
    liff:'เชื่อมต่อ LINE (LIFF) ไม่สำเร็จหรือช้ามาก',login:'กำลังพาไปล็อกอิน LINE ไม่สำเร็จ',
    cache:'แสดงข้อมูลที่จำไว้ในเครื่องไม่ได้ (แคชเก่าไม่เข้ากับหน้าใหม่)',
    api:'รอหลังบ้าน (Google Apps Script) ตอบ ใช้เวลานานผิดปกติ อาจเป็นเน็ตช้า หรือหลังบ้านกำลังเริ่มทำงาน',
    render:'วาดหน้าจอไม่สำเร็จ (ข้อมูลที่ได้มาวาดไม่ได้)'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function splash(){var b=document.getElementById('boot');return !!(b&&!b.hidden&&b.querySelector('.spin'))}
  W.qkClear=function(){try{var k=[],i;for(i=0;i<localStorage.length;i++){var n=localStorage.key(i);if(n.indexOf('qt21_')===0||n.indexOf('qt2_')===0)k.push(n)}k.forEach(function(n){localStorage.removeItem(n)})}catch(e){}try{sessionStorage.clear()}catch(e){}location.reload()};
  W.qkFail=function(stage,err,wait){
    var st=stage||W.__qkStage,em=err&&err.message?err.message:(err?String(err):W.__qkErr);
    if(em)W.__qkErr=em;
    var host=document.getElementById('boot');if(!host)return;
    host.hidden=false;try{document.body.classList.add('plain')}catch(e){}
    host.innerHTML='<div class="center" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="max-width:420px;width:100%;background:#fff;color:#1B1F3B;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(44,48,110,.15);font-family:IBM Plex Sans Thai,Tahoma,sans-serif;text-align:center">'
     +'<div style="font-size:2rem">⚠️</div><h2 style="margin:6px 0;font-size:1.15rem">'+(wait?'Q-Teacher เปิดช้ากว่าปกติ':'Q-Teacher เปิดไม่สำเร็จ')+'</h2>'
     +'<p style="margin:6px 0 10px;color:#5E6385;font-size:.92rem">'+esc(WHY[st]||WHY.script)+'</p>'
     +'<p style="margin:0 0 14px;color:#8A8FAE;font-size:.76rem">ขั้นที่ค้าง: '+esc(st)+' · ผ่านมา '+Math.round((Date.now()-T0)/1000)+' วินาที'+(em?'<br>'+esc(em).slice(0,160):'')+'</p>'
     +'<button onclick="location.reload()" style="width:100%;border:0;border-radius:14px;padding:13px;background:#5B5BF0;color:#fff;font:600 1rem inherit;cursor:pointer;margin-bottom:8px">ลองใหม่</button>'
     +'<button onclick="qkClear()" style="width:100%;border:1.5px solid #E7E9F3;border-radius:14px;padding:11px;background:#fff;color:#1B1F3B;font:500 .9rem inherit;cursor:pointer">ล้างข้อมูลที่จำไว้ในเครื่อง แล้วลองใหม่</button>'
     +(wait?'<p style="margin:10px 0 0;color:#8A8FAE;font-size:.76rem">ถ้ารอได้ ปล่อยไว้สักครู่ หน้าจะเปิดเองเมื่อข้อมูลมาถึง</p>':'')+'</div></div>';
  };
  W.addEventListener('error',function(e){W.__qkErr=(e&&e.message)||'error';if(splash())W.qkFail(W.__qkStage,e&&e.error?e.error:{message:e.message},false)});
  W.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;W.__qkErr=(r&&r.message)||String(r||'rejection');if(splash())W.qkFail(W.__qkStage,r,false)});
  setTimeout(function(){if(splash())W.qkFail(W.__qkStage,null,true)},15000);
})();
</script>
<style>
/* Layout: Q-Kawa suite. Phone + iPad (<1000px) = app shell: greeting header, cards, icon shortcuts, fixed bottom bar + menu sheet.
   Computer (>=1000px) = header + left sidebar + content grid (same as v.2). */
/* โทนเดียวกับหน้ากลาง Q-Kawa (ม่วงคราม · Kanit + IBM Plex Sans Thai) */
:root{
  --bg:#F3F4FB; --bg-top:#ECEBFF; --surface:#FFFFFF; --sunk:#F2F3F9; --ink:#1B1F3B; --muted:#6B7092; --faint:#A3A7C2; --line:#E7E9F3;
  --accent:#5B5BF0; --accent2:#8B6CF7; --accent-ink:#FFFFFF; --accent-soft:#ECEBFE; --navy:#1E2341; --navy2:#2C3263;
  --good:#1E9E66; --warn:#C27803; --bad:#E04850;
  --good-soft:#E2F6EC; --warn-soft:#FFF1D9; --bad-soft:#FDE8E9;
  --c-blue:#2C8CE6; --c-blue-s:#E2F0FD; --c-teal:#11A188; --c-teal-s:#DDF5EF; --c-amber:#E9820C; --c-amber-s:#FFF0DC;
  --c-coral:#EA5B3F; --c-coral-s:#FDE7E1; --c-green:#1E9E66; --c-green-s:#E2F6EC; --c-rose:#E0498D; --c-rose-s:#FDE6F0;
  --c-violet:#7B5CF0; --c-violet-s:#EEE9FE; --c-slate:#5D6385; --c-slate-s:#EEF0F7;
  --shadow:0 8px 28px rgba(44,48,110,.07),0 1px 2px rgba(44,48,110,.04);
  --f-display:"Kanit","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --f-data:"Kanit","IBM Plex Sans Thai",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --bg-top:#171A3A; --surface:#171A31; --sunk:#1F2340; --ink:#EDEEFB; --muted:#A4A8CA; --faint:#6E7296; --line:#2A2E50;
  --accent:#8C8CFF; --accent2:#B39BFF; --accent-ink:#0E1022; --accent-soft:#262A5C; --navy:#0A0C1C; --navy2:#1B1F45;
  --good:#6BD6A3; --warn:#F5C26B; --bad:#FF8F95; --good-soft:#15352A; --warn-soft:#3A2D12; --bad-soft:#40191D;
  --c-blue:#86C2FF; --c-blue-s:#16304A; --c-teal:#6EE0C7; --c-teal-s:#123A33; --c-amber:#FFB866; --c-amber-s:#3A2A14;
  --c-coral:#FF9A85; --c-coral-s:#3D2019; --c-green:#6BD6A3; --c-green-s:#15352A; --c-rose:#FF93C0; --c-rose-s:#401B2E;
  --c-violet:#B39BFF; --c-violet-s:#2A2458; --c-slate:#C3C6E0; --c-slate-s:#262A45; --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.2rem}h2{font-size:1.06rem}h3{font-size:.95rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* ---- desktop chrome ---- */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:none}
.brand small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.roles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.roles>span{font-size:.8rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding-inline:16px}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;padding-top:18px;display:grid;gap:2px}
.mi{border:0;background:none;padding:8px 10px;color:var(--ink);font-weight:500;display:flex;gap:10px;align-items:center;border-radius:10px;text-align:left;width:100%}
.mi:hover{background:var(--sunk)}
.mi[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.mi .ic{width:30px;height:30px}
.mi .ic svg{width:17px;height:17px}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;font-family:var(--f-data);line-height:1.5;margin-left:auto}
.credit{font-size:.78rem;color:var(--muted);padding:14px 10px 0;border-top:1px solid var(--line);margin-top:12px;line-height:1.5}
.credit b{color:var(--ink);font-weight:600}
main{padding-block:18px 56px;display:grid;gap:16px;min-width:0}
main.wrap{padding-inline:0;max-width:none;margin:0;width:100%}

/* ---- phone / iPad app shell ---- */
.app-top,.bottom,.sheet,.mrole{display:none}
@media (max-width:999.98px){
  header.top{display:none}
  .shell{display:block;padding-inline:0}
  nav.side{display:none}
  main.wrap{padding-inline:16px;max-width:760px;margin:0 auto;padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
  .app-top{display:block;max-width:760px;margin:0 auto;padding:14px 16px 6px}
  .app-top .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .app-top .eyebrow{font-size:.74rem;letter-spacing:.12em;color:var(--muted);font-weight:600}
  .app-top h1{font-size:1.45rem}
  .bell{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 1px 3px rgba(20,30,50,.12);display:grid;place-items:center;flex:none}
  .bell svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bell .badge{position:absolute;top:2px;right:0;margin:0}
  .mrole{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted)}
  .mrole select{width:auto;padding:4px 8px;border-radius:999px;font-size:.84rem}
  .bottom{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .bottom button{border:0;background:none;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:.72rem;color:var(--muted);position:relative;min-width:0}
  .bottom button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottom svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bottom button[aria-current="page"]{color:var(--ink);font-weight:600}
  .bottom .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
  .sheet{position:fixed;inset:0;z-index:25;background:rgba(10,16,26,.45);align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet .card{background:var(--bg);width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
}

/* ---- shared components ---- */
.note{font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 10px}
.ph p{color:var(--muted);font-size:.84rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}
.pill{display:inline-block;font-size:.75rem;padding:1px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--sunk);color:var(--muted)}.p-calm{background:var(--c-teal-s);color:var(--c-teal)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.77rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:.88rem;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:.8rem}
.btn.big{padding:13px 18px;font-size:1.02rem;font-family:var(--f-display);border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.list{display:grid;margin:0;padding:0;list-style:none}
.list>li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list>li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.82rem}
.sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.flow{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.78rem;color:var(--muted)}
.flow .d{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.flow .d.on{background:var(--good)}.flow .d.no{background:var(--bad)}.flow .d.wait{background:var(--warn)}
.f{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.lbl{font-weight:500;font-size:.86rem}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);width:100%;max-width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;background:var(--surface);position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opts label:has(input:focus-visible){outline:2px solid var(--accent)}
.callout{border-radius:12px;padding:10px 12px;font-size:.9rem;display:grid;gap:4px}
.c-good{background:var(--good-soft)}.c-warn{background:var(--warn-soft)}.c-bad{background:var(--bad-soft)}.c-info{background:var(--accent-soft)}
.lock{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.86rem;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.span2{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (min-width:1000px){.toast{bottom:24px}}

/* colored icon tiles */
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h-blue{background:var(--c-blue-s);color:var(--c-blue)}.h-teal{background:var(--c-teal-s);color:var(--c-teal)}.h-amber{background:var(--c-amber-s);color:var(--c-amber)}
.h-coral{background:var(--c-coral-s);color:var(--c-coral)}.h-green{background:var(--c-green-s);color:var(--c-green)}.h-rose{background:var(--c-rose-s);color:var(--c-rose)}
.h-violet{background:var(--c-violet-s);color:var(--c-violet)}.h-slate{background:var(--c-slate-s);color:var(--c-slate)}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
@media (min-width:600px){.shortcuts{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}}
.sc{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:.78rem;text-align:center;line-height:1.3;padding:0}
.sc .ic{width:54px;height:54px;border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.sc .ic svg{width:25px;height:25px}

/* home cards */
.hero{background:var(--hero);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.hero .ava{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.hero .ava svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.hero b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.3}
.status{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start;box-shadow:0 1px 3px rgba(20,30,50,.06);border:1px solid var(--line)}
.status .big{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.12rem;font-weight:600}
.status .big svg{width:22px;height:22px;stroke:var(--good);fill:none;stroke-width:2}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.split.four{grid-template-columns:repeat(4,1fr)}
.split span{font-size:.8rem;color:var(--muted);display:block}
.split b{font-family:var(--f-display);font-size:1.25rem}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.sec h2{font-size:1.08rem}
.count{background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.action{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.action .ic{width:40px;height:40px;border-radius:12px}
.action .ic svg{width:20px;height:20px}
.action .main{flex:1;min-width:0}
.action b{display:block;font-weight:600;line-height:1.35}
.action .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.actions{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.sos{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;border:0;border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.sos svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;flex:none}
.sos b{font-family:var(--f-display);font-size:1.05rem;display:block}
.sos small{opacity:.9}
.alertband{background:var(--bad);color:#fff;border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.alertband b{font-family:var(--f-display);font-size:1.05rem}
.alertband .btn{background:#fff;color:#a12a1c;border-color:#fff}

/* features */
.clockbig{font-family:var(--f-data);font-size:2.2rem;font-weight:600;line-height:1.1}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.punch b{display:block;font-family:var(--f-data);font-size:1.35rem}
.punch span{font-size:.8rem;color:var(--muted)}
.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;display:grid;gap:2px}
.slot b{font-family:var(--f-data);font-size:.76rem;color:var(--muted);font-weight:500}
.slot.teach{background:var(--accent-soft);border-color:transparent}
.slot.free{color:var(--muted)}
.slot.now{outline:2px solid var(--accent)}
.rank{list-style:none;margin:0;padding:0;display:grid}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-size:.78rem;font-weight:600;background:var(--sunk)}
.m1{background:#ecc65c;color:#3a2b00}.m2{background:#cbd2db;color:#20262e}.m3{background:#d89f6e;color:#2e1a08}
.period{font-size:.8rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}
.job{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.steps3 i{height:6px;border-radius:3px;background:var(--line);display:block}
.steps3 i.on{background:var(--good)}
.cp{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(4,minmax(46px,1fr));gap:6px;align-items:center;font-size:.84rem}
.cp .h{color:var(--muted);font-size:.76rem;text-align:center}
.cell{height:32px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-data);font-size:.74rem;border:0}
.cell.ok{background:var(--good-soft);color:var(--good)}.cell.miss{background:var(--bad-soft);color:var(--bad)}.cell.due{outline:2px dashed var(--accent);background:var(--surface);color:var(--accent)}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.toggle:first-child{border-top:0}
.toggle input{width:40px;height:22px;accent-color:var(--accent);flex:none}
.toggle small{display:block;color:var(--muted);font-size:.78rem}
.meter{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%}
.comp{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr;gap:6px 10px;align-items:center;font-size:.85rem}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:10px;border-radius:3px;background:var(--line);display:block}
.dots i.s{background:var(--accent)}.dots i.o{box-shadow:inset 0 0 0 2px var(--warn)}
/* big task bars */
.tasks{display:grid;gap:12px}
.task{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.task .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.task b.t{font-size:1rem;line-height:1.4}
.bigbar{position:relative;height:30px;border-radius:10px;background:var(--sunk);overflow:hidden}
.bigbar i{position:absolute;inset:0 auto 0 0;border-radius:10px}
.bigbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-inline:12px;font-family:var(--f-data);font-weight:600;font-size:.92rem}
/* headcount */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cls{border-radius:14px;padding:12px;display:grid;gap:4px;border:1px solid var(--line);background:var(--surface)}
.cls.ok{background:var(--good-soft);border-color:transparent}.cls.miss{background:var(--bad-soft);border-color:transparent}.cls.wait{background:var(--sunk);border-style:dashed}
.cls b{font-family:var(--f-display);font-size:1.05rem}
.cls .n{font-family:var(--f-data);font-size:1.3rem;font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:600}
.stepper output{font-family:var(--f-data);font-size:1.8rem;font-weight:600;min-width:90px;text-align:center}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.kid{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;font-size:.86rem;display:flex;gap:8px;align-items:center}
.kid i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.kid[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.kid[aria-pressed="true"] i{background:var(--good);border-color:var(--good)}
.tripgrid{display:grid;grid-template-columns:minmax(110px,1.2fr) repeat(5,minmax(58px,1fr));gap:6px;align-items:center;font-size:.82rem;min-width:520px}
.tripgrid .h{color:var(--muted);font-size:.74rem;text-align:center;line-height:1.3}
.qchart{display:grid;gap:7px}
.qrow{display:grid;grid-template-columns:minmax(72px,110px) minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:.84rem}
.qbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.qbar i{display:block;height:100%}
.qrow .v{font-family:var(--f-data);font-size:.76rem;color:var(--muted);white-space:nowrap}
.qsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qsum div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.qsum b{display:block;font-family:var(--f-display);font-size:1.25rem}
.qsum span{font-size:.76rem;color:var(--muted)}
.who{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px;font-size:.88rem}
.who div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who .k{min-width:62px;font-weight:600}
.msgbox{white-space:pre-wrap;font-family:var(--f-body);font-size:.88rem;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:200px;width:100%;resize:vertical;line-height:1.55}
.steplist{display:grid;gap:2px}
.steplist button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:5px 0;text-align:left;font-size:.88rem}
.steplist .tick{width:24px;height:24px}
.steplist .tick svg{width:13px;height:13px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:1.25rem;line-height:1;color:var(--line)}
.stars button.on,.stars span.on{color:#e0a823}
.stars span{font-size:1.05rem;color:var(--line)}
.kpibar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qrcard{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;justify-items:center;gap:6px;text-align:center;background:#fff;color:#16202c}
.qrcard svg{width:120px;height:120px}
.qrcard code{font-family:var(--f-data);font-size:.72rem;color:#5b6777}
.scanbtn{display:flex;gap:12px;align-items:center;justify-content:center;background:var(--c-slate);color:#fff;border-radius:16px;padding:16px;font-family:var(--f-display);font-size:1.1rem;font-weight:600;cursor:pointer;text-align:center}
.scanbtn svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8}
.actcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:var(--surface);text-align:left;width:100%}
.actcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.drow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) minmax(140px,1.4fr) auto;gap:8px;align-items:end}
@media (max-width:640px){.drow{grid-template-columns:1fr 1fr}.drow .dutyfld{grid-column:1/-1}}
.kid small{display:block;font-size:.7rem;color:var(--muted)}
.kid[disabled]{opacity:.45;cursor:not-allowed}
.foot{text-align:center;font-size:.78rem;color:var(--muted);padding-top:6px}
@media (prefers-reduced-motion:no-preference){.panel,.status,.action{animation:rise .22s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

/* ===== ปรับให้เหมือนหน้ากลาง ===== */
h1,h2,h3{font-weight:600}
.panel,.status,.kpi,.action,.task,.job,.actcard,.cls,.qrcard{border:0!important;box-shadow:var(--shadow)}
.panel{border-radius:20px;padding:18px}
.status{border-radius:22px}
.kpi{border-radius:18px}
.kpi b,.split b,.qsum b,.cls b,.cls .n,.clockbig,.punch b,.stepper output{font-weight:600}
.action{border-radius:18px}
.task,.job{border-radius:18px}
.job{background:var(--surface)}
.btn{border-radius:14px;padding:8px 15px}
.btn.sm{border-radius:10px}
.btn.big{border-radius:16px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent)}
.chip{border:0;box-shadow:var(--shadow);padding:6px 14px;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{border-radius:14px;padding:10px 12px;font-size:15px}
input[type=url]{border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.callout{border-radius:14px}
.note{border-radius:12px}
.pill{font-weight:500}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#4B47C9 100%);color:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 34px rgba(40,40,120,.22);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,247,.55),rgba(139,108,247,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .ava{background:rgba(255,255,255,.14);color:#fff;overflow:hidden}
.hero .ava img{width:100%;height:100%;object-fit:cover}
.hero .sub{color:rgba(255,255,255,.75)}
.sos{border-radius:18px}
.alertband{border-radius:18px}
.medal{font-family:var(--f-data)}
.sc .ic{border-radius:18px;box-shadow:none}
.sc{color:var(--ink)}
.prog,.meter,.bar,.qbar,.bigbar{background:var(--sunk)}
.prog i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* แถบบนคอมพิวเตอร์ */
header.top{background:var(--surface);border:0;box-shadow:var(--shadow)}
.mark{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:13px;font-weight:600}
.mi{border-radius:14px;padding:8px 10px}
.mi[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:none;font-weight:600}
.mi .ic{width:30px;height:30px;border-radius:10px}
.credit b{font-weight:600}
@media (max-width:999.98px){
  .app-top h1{font-size:1.5rem}
  .bell{border-radius:14px;box-shadow:var(--shadow)}
  .bottom{border:0;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(44,48,110,.08)}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom button{color:var(--faint)}
  .sheet .card{border-radius:26px 26px 0 0}
}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.toprow{display:flex;gap:10px;align-items:center}
.toplink{font-size:.85rem;color:var(--accent);text-decoration:none;font-weight:500}
/* หน้าต่างลอย (ลงเวลา ฟอร์ม) */
.ov{position:fixed;inset:0;background:rgba(20,22,50,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.msheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:1000px){.ov{align-items:center}.msheet{border-radius:26px;max-height:86vh}}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-input{font-size:26px!important;letter-spacing:.2em;text-align:center;font-weight:600;font-family:var(--f-display)!important}
.err{font-size:14px;color:var(--bad);background:var(--bad-soft);border-radius:14px;padding:10px 14px}
.okc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good);margin:0 auto}
.okc svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4}
.punchbtn{display:flex;gap:10px;align-items:center;justify-content:center}
.punchbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--sunk);flex:none}
.photo-row{display:flex;gap:8px;flex-wrap:wrap}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.center .panel{max-width:420px;width:100%}
.dotset{display:flex;gap:4px}
.dotset button{width:26px;height:14px;border-radius:4px;border:0;background:var(--line);padding:0}
.dotset button.s{background:var(--accent)}
.loading-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:60;animation:lb 1.2s ease-in-out infinite;width:40%}
@keyframes lb{0%{left:-40%}100%{left:100%}}
@media print{body *{visibility:hidden}.printme,.printme *{visibility:visible}.printme{position:absolute;left:0;top:0;width:100%;box-shadow:none!important}.noprint{display:none!important}}

.status .btn.big svg,.btn.big svg{stroke:currentColor}

/* ===== 2.1: กระชับ อ่านง่าย ตามแบบหน้าตั้งค่า ===== */
:root{--muted:#585D7F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#B4B8D8}}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{font-size:16px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:1.3;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=search]{border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 38px;background:var(--surface);width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.fgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.fgrid>.fld{min-width:0}
.i16,.i18,.i20{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.i16{width:16px;height:16px}.i18{width:18px;height:18px}.i20{width:20px;height:20px}
.tc{text-align:center}.small{font-size:.86rem}
.bad{color:var(--bad)!important}.warn{color:var(--warn)!important}.good{color:var(--good)!important}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.warnb{background:var(--warn);color:#fff;border-color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:.82rem;text-decoration:underline}
.empty{color:var(--muted);font-size:.9rem;padding:4px 2px;margin:0}
.empty.ok::before{content:"✓ ";color:var(--good);font-weight:700}
.loadbox{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem;padding:8px 2px}
.spin.sm{width:18px;height:18px;border-width:2px;margin:0;flex:none}
/* ส่วนหัว */
.hublink{display:inline-flex;align-items:center;gap:4px;font-size:.86rem;color:var(--accent);text-decoration:none;font-weight:600;padding:4px 10px 4px 6px;border-radius:999px;background:var(--accent-soft)}
.hublink svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.hublink.btn{padding:8px 14px;border-radius:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}
.app-top .sub1{align-items:center}
.app-top .sub1 h1{font-size:1.25rem}
.ptitle h1{font-size:1.35rem}
.mgrp{font-size:.74rem;color:var(--muted);letter-spacing:.08em;padding:12px 10px 4px}
.badge.dot{width:9px;height:9px;padding:0;min-width:0}
.bnum{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:.7rem;font-family:var(--f-data)}
/* หน้าแรก */
.pstate{font-family:var(--f-display);font-weight:600;font-size:1.02rem;color:var(--accent);margin-top:-4px}
.dutyrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center;font-size:.9rem;color:var(--muted)}
.dutyrow input{width:18px;height:18px;accent-color:var(--accent)}
.dutyrow .sub{width:100%;text-align:center;font-size:.76rem}
.emgbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:16px;padding:10px 14px}

/* ---------- วันที่ (แสดงตามเวลาไทยจากเซิร์ฟเวอร์) ---------- */
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const d8=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const thD=s=>{if(!s)return'';const d=d8(s);return d.getDate()+' '+MON[d.getMonth()]};
const thDY=s=>{if(!s)return'';const d=d8(s);return d.getDate()+' '+MON[d.getMonth()]+' '+(d.getFullYear()+543)};
const thDT=s=>s?thD(s)+(s.length>10?' '+s.slice(11,16)+' น.':''):'';
const thRange=(a,b)=>a===b?thD(a):thD(a)+' – '+thD(b);
const addDays=(s,n)=>{const d=d8(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=iso=>Math.round((d8(iso)-d8(TODAY_ISO))/864e5);
const toMin=hm=>{const[h,m]=String(hm).split(':').map(Number);return h*60+m};
/** เวลาไทย (Asia/Bangkok) ไม่ขึ้นกับเขตเวลาของเครื่อง */
const bkk=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());return p.replace(/^24/,'00')};
/** นาฬิกาอิงเวลาเซิร์ฟเวอร์ (ไม่เชื่อนาฬิกาเครื่อง) */
let SRV={hm:'',t:0};
const clockNow=()=>{if(!SRV.hm)return bkk();const m=(toMin(SRV.hm)+Math.floor((Date.now()-SRV.t)/60000))%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

function load(b){

  FREE=b.freeNow||{};

  ONLEAVE={};Object.entries(b.onleave||{}).forEach(([id,l])=>{ONLEAVE[id]=l});
  OUTNOW=b.outnow||{};
  REQ=b.reqs||[];RULE={n:b.quota.times,d:b.quota.days};LATE_RULE=b.quota.late;
  SUBS=b.subs||[];SUBCOUNT=b.subCounts.month||{};SUBTERM=b.subCounts.term||{};

  INCIDENTS=b.incidents||[];VISIT=b.visits||[];

/** รอบเดินตรวจปัจจุบัน: นับเวลาแบบกะกลางคืน (หลังเที่ยงคืนต่อจากคืนก่อน) */
const shiftMin=hm=>{const m=toMin(hm);return m<720?m+1440:m};
function curRound(){const n=shiftMin(clockNow());let i=0;ROUNDS.forEach((r,k)=>{if(shiftMin(r)<=n)i=k});return i}

let BUSY=0;
function busyBar(on){BUSY+=on?1:-1;let el=$('#lbar');if(BUSY>0&&!el){el=document.createElement('div');el.id='lbar';el.className='loading-bar';document.body.appendChild(el)}if(BUSY<=0&&el){el.remove();BUSY=0}}
const nonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
/** เรียกหลังบ้าน + จับเวลาแยกส่วน (รอเซิร์ฟเวอร์ / รับข้อมูล) สำหรับหน้าวินิจฉัยของผู้ดูแล */
async function api(action,payload){
  let r;busyBar(true);const t0=performance.now();
  try{r=await Promise.race([fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,idToken:liff.getIDToken()},payload||{}))}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),40000))]);}
  catch(e){busyBar(false);const to=e&&e.message==='TIMEOUT';const er=new Error(to?'หลังบ้านไม่ตอบภายใน 40 วินาที ลองใหม่อีกครั้ง':'เชื่อมต่อไม่ได้ ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่');er.code=to?'TIMEOUT':'NETWORK';throw er}
  const t1=performance.now();let txt='',j;
  try{txt=await r.text();j=JSON.parse(txt)}catch(e){busyBar(false);const er=new Error('หลังบ้านตอบกลับไม่ถูกต้อง (ตรวจการ Deploy)');er.code='BAD_RESPONSE';throw er}
  busyBar(false);
  const rec={action:action+(payload&&payload.name?':'+payload.name:''),at:clockNow(),total:Math.round(performance.now()-t0),wait:Math.round(t1-t0),server:j.ms||0,diag:j.diag||null,kb:Math.round(txt.length/102.4)/10};
  st.diagLog.unshift(rec);st.diagLog.length=Math.min(st.diagLog.length,12);
  if(!j.ok){if(j.code==='TOKEN_EXPIRED'||j.code==='NO_TOKEN')relogin();const er=new Error(j.error||j.code);er.code=j.code;throw er}
  return j;
}
const INFLIGHT=new Set();
/** ส่งคำสั่งบันทึก: กันกดซ้ำ (หน้าจอ + รหัสคำขอให้เซิร์ฟเวอร์กันซ้ำ) แล้วใช้ข้อมูลชุดใหม่ที่ได้กลับมาทันที */
async function act(action,payload,btn){
  const key=action+'|'+JSON.stringify(payload||{});
  if(INFLIGHT.has(key))return Promise.reject(new Error('กำลังบันทึก'));
  INFLIGHT.add(key);if(btn){btn.disabled=true;btn.dataset.lab=btn.dataset.lab||btn.textContent;if(btn.tagName==='BUTTON')btn.textContent='กำลังบันทึก…'}
  st.bootSeq++;  // ผลโหลดหน้าที่ส่งไปก่อนหน้านี้ถือว่าเก่า
  try{
    const j=await api(action,Object.assign({nonce:nonce()},payload||{}));
    if(j.data){load(j.data);cacheSet(j.data);st.fetchedAt=Date.now()}
    if(j.sec)Object.keys(j.sec).forEach(k=>{SEC[k]=j.sec[k];SEC_AT[k]=Date.now();delete SEC_ERR[k]});
    if(SEC_STALE_AFTER[action])SEC_STALE_AFTER[action].forEach(k=>{SEC_AT[k]=0});
    st.dirty=false;render();toast(j.msg);return j}
  catch(e){
    if(e.code==='DUP_REQ'){toast('รายการนี้บันทึกไปแล้ว');refresh(true);throw e}
    toast(e.message);throw e}
  finally{INFLIGHT.delete(key);if(btn&&btn.isConnected){btn.disabled=false;if(btn.tagName==='BUTTON'&&btn.dataset.lab)btn.textContent=btn.dataset.lab}}
}
/** หลังบันทึกบางอย่าง ข้อมูลส่วนสถิติเก่าแล้ว ให้โหลดใหม่ครั้งถัดไปที่เปิดหน้านั้น */
const SEC_STALE_AFTER={check:['stats'],'check.admin':['stats'],'leave.dir':['stats'],'leave.ext':['stats'],'leave.cancel':['stats'],'leave.hr':['stats']};
function relogin(){let n=0;try{n=Number(sessionStorage.getItem('qt_relogin')||0);sessionStorage.setItem('qt_relogin',String(n+1))}catch(e){}if(n>1)return;if(liff.isInClient())location.reload();else{try{liff.logout()}catch(e){}liff.login({redirectUri:location.href})}}
/** แคชในเครื่อง แยกตามบัญชี LINE · ล้างเมื่อบัญชีไม่ผูกหรือแอปปิด */
function cacheKey(){try{return'qt21_'+((liff.getDecodedIDToken()||{}).sub||'')}catch(e){return''}}
function cacheGet(){try{const k=cacheKey();if(!k)return null;const v=JSON.parse(localStorage.getItem(k)||'null');return v&&v.me&&v.today&&v.today.date===ymd(new Date())?v:null}catch(e){return null}}
function cacheSet(v){try{const k=cacheKey();if(k)localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cacheClear(){try{const k=cacheKey();if(k)localStorage.removeItem(k);localStorage.removeItem('qt2_'+k.slice(5))}catch(e){}}
/** โหลดข้อมูลหน้าใหม่ · ผลที่มาช้ากว่าการบันทึกครั้งล่าสุดจะไม่ทับข้อมูลใหม่ · ถ้ากำลังกรอกฟอร์ม จะไม่วาดหน้าใหม่ทับ */
async function refresh(quiet){
  const my=++st.bootSeq;
  try{const j=await api('boot');if(my!==st.bootSeq)return;load(j);cacheSet(j);st.fetchedAt=Date.now();st.stale=false;
    if(st.dirty)renderChrome();else render();if(!quiet)toast('โหลดข้อมูลใหม่แล้ว')}
  catch(e){if(my!==st.bootSeq)return;st.stale=false;if(!quiet)toast(e.message);else if(B)renderChrome()}
}
/** โหลดข้อมูลรายส่วน แสดง "กำลังโหลด" / "โหลดไม่สำเร็จ + ลองใหม่" เฉพาะส่วนนั้น */
function ensureSec(name,maxAge){
  const fresh=SEC[name]&&Date.now()-(SEC_AT[name]||0)<(maxAge||300000);
  if(fresh||SEC_LOADING[name])return;
  SEC_LOADING[name]=true;delete SEC_ERR[name];
  api('sec',{name}).then(j=>{SEC[name]=j.sec;SEC_AT[name]=Date.now()}).catch(e=>{SEC_ERR[name]=e.message})
    .finally(()=>{SEC_LOADING[name]=false;if(!st.dirty)render()});
}
function secBox(name,fn,maxAge){
  ensureSec(name,maxAge);
  if(SEC[name])return fn(SEC[name]);
  if(SEC_ERR[name])return`<div class="callout c-bad"><b>โหลดข้อมูลส่วนนี้ไม่สำเร็จ</b>${esc(SEC_ERR[name])}<div><button class="btn sm" data-secretry="${name}">ลองใหม่</button></div></div>`;
  return`<div class="loadbox" role="status"><span class="spin sm"></span>กำลังโหลดข้อมูล…</div>`;
}

async function boot(){
  window.__qkStage='liff';
  if(!CONFIG.API_URL)return screen('<h2>ยังไม่ได้ตั้งค่า API_URL</h2>');
  try{await liff.init({liffId:CONFIG.LIFF_ID})}catch(e){return screen(`<h2>เปิดการเข้าสู่ระบบ LINE ไม่สำเร็จ</h2><p class="err">${esc(e.message)}</p>`)}
  window.__qkStage='login';
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  window.__qkStage='cache';
  let c=cacheGet();
  if(c){
    try{load(c);SRV={hm:'',t:0};st.stale=true;start()}
    catch(e){ /* แคชเก่าวาดไม่ได้: ล้างแล้วโหลดใหม่ 1 ครั้ง (กันวนซ้ำด้วยตัวนับ) */
      window.__qkErr='cache: '+(e&&e.message);try{cacheClear()}catch(x){}
      let n=0;try{n=Number(sessionStorage.getItem('qt_cachefix')||0);sessionStorage.setItem('qt_cachefix',String(n+1))}catch(x){}
      if(n<1){location.reload();return}
      if(window.qkFail){qkFail('cache',e);return}
    }
  }
  window.__qkStage='api';
  const my=++st.bootSeq;
  try{const j=await api('boot');if(my!==st.bootSeq)return;load(j);cacheSet(j);st.fetchedAt=Date.now();st.stale=false;try{sessionStorage.removeItem('qt_relogin')}catch(e){}if(!c)start();else if(st.dirty)renderChrome();else render();openHash()}
  catch(e){
    if(e.code==='NOT_LINKED'){cacheClear();return screen(`<h2>ยังไม่ได้ผูกบัญชี</h2><p class="note">ผูกบัญชี LINE กับโรงเรียนที่หน้ากลาง Q-Kawa ก่อน (กรอกรหัส 6 หลักจาก ผอ.) แล้วกลับมาที่นี่</p><a class="btn pri big wide" style="text-align:center;text-decoration:none" href="${esc(CONFIG.HUB_URL)}">ไปหน้ากลาง Q-Kawa</a>`)}
    if(e.code==='APP_OFF'){cacheClear();return screen(`<h2>Q-Teacher ยังไม่เปิดใช้</h2><p class="note">${esc(e.message)}</p><a class="btn wide" style="text-align:center;text-decoration:none" href="${esc(CONFIG.HUB_URL)}">กลับหน้ากลาง</a>`)}
    if(c){st.stale=false;st.offline=true;renderChrome();render();toast('ยังโหลดข้อมูลล่าสุดไม่ได้ · แสดงข้อมูลครั้งก่อน');return}
    screen(`<h2>โหลดข้อมูลไม่สำเร็จ</h2><p class="err">${esc(e.message)}</p><button class="btn pri big wide" data-reload="1">ลองใหม่</button>`)
  }
}

/** ลิงก์จากหน้ากลาง: #tab=req / #leave=LV69-0001 (รองรับชื่อแท็บเดิมทั้งหมด) */
function openHash(){
  let h=decodeURIComponent(location.hash||'');if(!h)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  /* #tab=myreq&kind=leave → เปิดฟอร์มประเภทนั้นเลย (leave|out|gov|doc) · ไม่มี &kind = เหมือนเดิม */
  let kind='';const km=/&kind=(\w*)$/.exec(h);if(km){if(['leave','out','gov','doc'].includes(km[1]))kind=km[1];h=h.slice(0,km.index)}
  const m=/^#(\w+)(?:=(.+))?$/.exec(h);if(!m)return;
  let t=m[1]==='tab'?m[2]:m[1]==='leave'?(REQ.some(r=>r.id===m[2]&&(r.canDir||r.canHR))?'approve':'myreq'):'';
  t=ALIAS[t]||t;
  if(t&&avail().includes(t)){if(kind&&t==='myreq')st.kind=kind;go(t)}
}

function needCheckIn(){return!B.my.in&&isWork()&&!(B.my.leaveToday&&B.my.leaveToday.part==='เต็มวัน')&&NOW_HM<=B.rules.general.out}
function badgeFor(t){
  if(t==='approve')return REQ.filter(x=>x.canDir||x.canHR).length;
  if(t==='sub')return SUBS.filter(s=>!s.done&&s.date>=TODAY_ISO).length;
  if(t==='jan')return JOBS.filter(j=>j.st===0).length;
  if(t==='mysub')return REQ.filter(x=>x.canSub).length;
  if(t==='count')return EMG.on?1:0;
  if(t==='ops')return INCIDENTS.filter(x=>x.st==='แจ้ง ผอ. แล้ว').length+JOBS.filter(j=>j.st===0&&j.prio==='ด่วน').length;
  if(t==='mywork')return TASKS.filter(x=>x.own===me()&&['todo','fix'].includes(x.st)).length;
  if(t==='tasks')return TASKS.filter(x=>x.st==='sent'&&(ME.isAdmin||x.by===me())).length;
  if(t==='myreq')return REQ.filter(x=>x.canBack||x.canExt).length;
  if(t==='pachal')return B.pa?(B.pa.wait||0)+(B.pa.mine.returned||0):0;
  if(t==='eval'){const E=B.eval;return E&&E.round.opened&&E.round.status==='open'?((E.mine==='self'||E.mine==='signed')?1:0)+(E.wait||0):0}
  return 0}

/* ---------- ลงเวลา: GPS / QR / เหตุผล ---------- */
function modal(html){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="ov" data-ov="1"><div class="msheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function busyModal(msg,sub){modal(`<div style="text-align:center;padding:10px 0" role="status"><div class="spin"></div><p><b>${esc(msg)}</b></p>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div>`)}
/** ขอตำแหน่งครั้งเดียวเมื่อกดลงเวลา (ไม่ติดตามตำแหน่งต่อเนื่อง) */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){const e=new Error('เครื่องนี้ไม่รองรับการหาตำแหน่ง');e.code='NO_GEO';return rej(e)}
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),
      e=>{const er=new Error(e.code===1?'LINE ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง':e.code===3?'หาตำแหน่งนานเกินไป (สัญญาณ GPS อ่อน)':'หาตำแหน่งไม่ได้');er.code=e.code===1?'DENIED':'NO_POS';rej(er)},
      {enableHighAccuracy:true,timeout:15000,maximumAge:0})});
}
let CHECKING=false;
async function startCheck(kind,useQr){
  if(CHECKING)return;
  const data={kind,duty:kind==='in'?!!st.duty:undefined};
  if(useQr){const code=await scanCode('ลงเวลา','QKAWA-T-');if(!code)return;data.qr=code;return sendCheck(data)}
  busyModal('ขั้นที่ 1/2 · กำลังตรวจตำแหน่ง…','ระบบขอตำแหน่งครั้งเดียวตอนกดลงเวลา');
  try{Object.assign(data,await getPos())}catch(e){return locFail(kind,e)}
  sendCheck(data);
}
function locFail(kind,e){
  modal(`<h2>ตรวจตำแหน่งไม่ได้</h2><p class="err">${esc(e.message)} · ยังไม่ได้ลงเวลา</p>
   ${e.code==='DENIED'?'<p class="note">วิธีอนุญาต: ตั้งค่าโทรศัพท์ → แอป LINE → ตำแหน่ง → "ขณะใช้แอป" แล้วกดลงเวลาใหม่</p>':'<p class="note">ลองออกไปที่โล่ง หรือเปิด GPS แล้วกดใหม่ · ถ้ายังไม่ได้ ใช้ QR ที่ติดในโรงเรียนแทน</p>'}
   <button class="btn pri big wide" data-punch="${kind}">ลองตรวจตำแหน่งอีกครั้ง</button><button class="btn wide" data-punchqr="${kind}">${svg('qr','i18')} สแกน QR ที่โรงเรียนแทน</button><button class="btn wide" data-close="1">ปิด</button>`);
}
async function sendCheck(data){
  if(CHECKING)return;CHECKING=true;
  busyModal(data.qr?'กำลังบันทึกเวลา…':'ขั้นที่ 2/2 · กำลังบันทึกเวลา…','รอให้ระบบยืนยันก่อนปิดหน้านี้');
  try{
    st.bootSeq++;
    const j=await api('check',{data});const x=j.result;
    if(j.data){load(j.data);cacheSet(j.data);st.fetchedAt=Date.now()}SEC_AT.stats=0;st.dirty=false;render();
    const how=x.method==='gps'?(x.dist===''?'GPS · '+x.point:'GPS · ห่างจุดลงเวลา '+x.dist+' ม.'+(x.point?' · '+x.point:'')):x.method==='qr'?'สแกน QR · '+x.point:'';
    modal(`<div style="text-align:center;display:grid;gap:8px"><span class="okc">${svg('check')}</span><h2>${x.kind==='in'?'บันทึกเวลาเข้าแล้ว':'บันทึกเวลาออกแล้ว'}</h2>
     <div class="clockbig num" style="color:var(--accent)">${esc(x.time)} น.</div><div>${stPill(x.status)}</div><p class="sub">${esc(how)} · เวลาจากเซิร์ฟเวอร์ (เวลาไทย)</p>
     ${x.status==='สายเกิน 09:00'?'<button class="btn pri wide" data-halfleave="1">ยื่นใบลาครึ่งวันเช้า</button>':''}<button class="btn wide" data-close="1">ปิด</button></div>`);
  }catch(e){
    if(e.code==='NEED_REASON')return askReason(data,e.message);
    if(e.code==='ALREADY'){refresh(true);return modal(`<div style="text-align:center;display:grid;gap:8px"><span class="okc">${svg('check')}</span><h2>ลงเวลาไว้แล้ว</h2><p>${esc(e.message)}</p><button class="btn wide" data-close="1">ปิด</button></div>`)}
    if(['OUT_OF_AREA','NO_LOCATION','BAD_QR'].includes(e.code))return modal(`<h2>${e.code==='BAD_QR'?'QR ไม่ถูกต้อง':'อยู่นอกพื้นที่ลงเวลา'}</h2><p class="err">${esc(e.message)} · ยังไม่ได้ลงเวลา</p>
      <button class="btn pri big wide" data-punchqr="${data.kind}">สแกน QR ที่โรงเรียน</button>${data.qr?'':`<button class="btn wide" data-punch="${data.kind}">ตรวจตำแหน่งอีกครั้ง</button>`}<button class="btn wide" data-close="1">ปิด</button>`);
    st.retryCheck=data;
    modal(`<h2>ยังไม่ได้ลงเวลา</h2><p class="err">${esc(e.message)}</p><p class="note">ระบบยังไม่ยืนยันการบันทึก ถ้ากดลองใหม่แล้วพบว่าบันทึกไว้แล้ว ระบบจะแจ้งเวลาเดิม ไม่บันทึกซ้ำ</p>
      <button class="btn pri big wide" data-retrycheck="1">ลองส่งอีกครั้ง</button><button class="btn wide" data-close="1">ปิด</button>`);
  }finally{CHECKING=false}
}
function askReason(data,msg){
  modal(`<form class="f" id="rsForm"><h2>แจ้งเหตุผล</h2><div class="callout c-warn">${esc(msg)}</div>
   <div class="fld"><label for="rsNote">เหตุผล</label><textarea id="rsNote" maxlength="300" required placeholder="${data.kind==='in'?'เช่น รถเสีย พาลูกไปโรงพยาบาล':'เช่น ไปประชุมที่เขตพื้นที่'}"></textarea></div>
   <button class="btn pri big wide" type="submit">บันทึกเวลาพร้อมเหตุผล</button>${/ลาครึ่งวัน/.test(msg)?'<button type="button" class="btn wide" data-halfleave="1">ยื่นใบลาครึ่งวันเช้าแทน</button>':''}<button type="button" class="btn wide" data-close="1">ยกเลิก</button></form>`);
  $('#rsForm').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();const note=$('#rsNote').value.trim();if(note)sendCheck(Object.assign({},data,{note}))});
}
const ST_PILL={'ตรงเวลา':'p-good','ไฟเหลือง':'p-warn','สาย':'p-bad','สายเกิน 09:00':'p-bad','ปกติ':'p-good','กลับก่อนเวลา':'p-warn'};
const stPill=s=>s?`<span class="pill ${ST_PILL[s]||'p-mute'}">${esc(s)}</span>`:'';
/** สแกน QR: กล้อง LINE ก่อน · ไม่ได้ให้ถ่ายรูป QR หรือพิมพ์รหัส */
async function scanCode(label,prefix){
  try{if(liff.isInClient()&&liff.isApiAvailable&&liff.isApiAvailable('scanCodeV2')){const r=await liff.scanCodeV2();if(r&&r.value)return r.value;return null}}catch(e){}
  return await askCode(label,prefix);
}
function askCode(label,prefix){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;res(v)};
    modal(`<form class="f" id="qrForm"><h2>สแกน QR ${esc(label)}</h2>
     <label class="btn pri big wide" for="qrPhoto" style="text-align:center">${svg('cam','i20')} ถ่ายรูป QR</label><input type="file" id="qrPhoto" accept="image/*" capture="environment" hidden>
     <p class="sub" id="qrMsg">หรือพิมพ์รหัส 6 ตัวที่อยู่ใต้รูป QR (ต่อจาก ${esc(prefix)})</p>
     <input type="text" id="qrCode" class="big-input" maxlength="20" autocomplete="off" autocapitalize="characters" aria-label="รหัสใต้ QR">
     <button class="btn wide" type="submit">ตกลง</button><button type="button" class="btn wide" data-close="1">ยกเลิก</button></form>`);
    $('#qrForm').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();const v=$('#qrCode').value.trim();if(v)fin(v)});
    $('#qrPhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readQrFile(f).then(v=>{if(v)fin(v);else $('#qrMsg').textContent='อ่าน QR ไม่ได้ ถ่ายใหม่ให้ QR อยู่กลางภาพ หรือพิมพ์รหัสแทน'})});
    const obs=new MutationObserver(()=>{if($('#modal').hidden){obs.disconnect();fin(null)}});obs.observe($('#modal'),{attributes:true});
  });
}
function readQrFile(file){return new Promise(res=>{if(typeof jsQR==='undefined')return res(null);const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);URL.revokeObjectURL(url);res(r?r.data.trim():null)};
  img.onerror=()=>res(null);img.src=url})}
/** ย่อรูปก่อนส่ง (กว้างสุด 1280 px) */
function shrinkPhoto(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type||'image/'))return rej(new Error('รองรับเฉพาะไฟล์รูปภาพ'));const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=()=>rej(new Error('เปิดรูปไม่ได้ ลองเลือกรูปอื่น'));img.src=url})}
const photoUrl=id=>id?(/^https:/.test(id)?id:'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w800'):'';
const photoLink=(id,label)=>id?`<a href="${esc(/^https:/.test(id)?id:'https://drive.google.com/file/d/'+id+'/view')}" target="_blank" rel="noopener"><img class="thumb" src="${esc(photoUrl(id))}" alt="${esc(label||'รูป')}" loading="lazy"></a>`:'';
async function copyTxt(txt,what){try{await navigator.clipboard.writeText(txt);st.copied=true;toast('คัดลอก'+(what||'ข้อความ')+'แล้ว · ไปวางในไลน์กลุ่มเอง')}catch(e){modal(`<h2>คัดลอกข้อความ</h2><p class="sub">กดค้างที่ข้อความแล้วเลือก "คัดลอก"</p><textarea class="msgbox" readonly>${esc(txt)}</textarea><button class="btn wide" data-close="1">ปิด</button>`)}}
/** ช่องแนบรูป: ถ่ายรูป / เลือกไฟล์ + ชื่อไฟล์ + สถานะ */
const PICKED={},PDF_OK={};
function fileField(id,label,note,pdf){PDF_OK[id]=!!pdf;const p=PICKED[id];return`<div class="fld"><span class="lbl">${esc(label)}</span><div class="filebtns"><label class="btn" for="${id}c">${svg('cam','i18')} ถ่ายรูป</label><label class="btn" for="${id}f">${svg('file','i18')} เลือกไฟล์</label>
  <input type="file" id="${id}c" accept="image/*" capture="environment" data-pick="${id}" hidden><input type="file" id="${id}f" accept="${pdf?'image/*,application/pdf':'image/*'}" data-pick="${id}" hidden></div>
  <span class="sub" id="${id}s">${p?(p.err?'<span class="bad">'+esc(p.err)+'</span>':p.data?'พร้อมส่ง: '+esc(p.name)+` <button type="button" class="linkbtn" data-unpick="${id}">นำออก</button>`:'กำลังย่อรูป: '+esc(p.name)):esc(note||(pdf?'รองรับรูปภาพหรือ PDF (ไม่เกิน 5 MB)':'รองรับไฟล์รูปภาพ'))}</span></div>`}
async function pickFile(id,f){PICKED[id]={name:f.name};const s=$('#'+id+'s');
  const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  if(s)s.textContent=(isPdf?'กำลังอ่านไฟล์: ':'กำลังย่อรูป: ')+f.name;
  try{
    if(isPdf){
      if(!PDF_OK[id])throw new Error('ช่องนี้รองรับเฉพาะรูปภาพ');
      if(f.size>5*1024*1024)throw new Error('ไฟล์ PDF ต้องไม่เกิน 5 MB (ไฟล์นี้ '+(f.size/1048576).toFixed(1)+' MB)');
      PICKED[id].data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('อ่านไฟล์ไม่ได้'));r.readAsDataURL(f)});
    }else PICKED[id].data=await shrinkPhoto(f);
  }catch(e){PICKED[id].err=e.message}
  const s2=$('#'+id+'s');if(s2){s2.innerHTML=PICKED[id].err?'<span class="bad">'+esc(PICKED[id].err)+'</span>':'พร้อมส่ง: '+esc(f.name)+` <button type="button" class="linkbtn" data-unpick="${id}">นำออก</button>`}}

const V={};
const empty=(t,s)=>`<p class="empty">${esc(t)}${s?`<span class="sub"> · ${esc(s)}</span>`:''}</p>`;

function reqStatus(r){
  return{approved:'<span class="pill p-good">อนุมัติแล้ว</span>',rejected:'<span class="pill p-bad">ไม่อนุมัติ</span>',cancel:'<span class="pill p-mute">ยกเลิกแล้ว</span>',
    head:'<span class="pill p-warn">รอหัวหน้างานบุคคล</span>',sub:`<span class="pill p-warn">${r.noSub?'ยังไม่มีผู้สอนแทน':'รอครูสอนแทนตอบรับ'}</span>`,dir:'<span class="pill p-warn">รอ ผอ. อนุมัติ</span>',
    ext:'<span class="pill p-warn">รอผู้มีอำนาจ</span>'}[r.st]||''}
/** ขั้นตอนการพิจารณา: อยู่ขั้นไหน รอใคร ดำเนินการเมื่อใด */
function reqStages(r){
  const S=[['ยื่นคำขอ',r.created?thDT(r.created):'','on']];
  if(r.kind==='out'){
    if(r.free){S.push(['คาบว่าง ออกได้ทันที','','on']);if(r.back)S.push(['กลับถึงโรงเรียน',thDT(r.back),'on']);return S}
    S.push([`ครูสอนแทนตอบรับ (${r.sub?nm(r.sub):'ยังไม่มีครูว่าง'})`,'',r.subOk?'on':r.st==='sub'?'wait':r.st==='rejected'||r.st==='cancel'?'':'on']);
    S.push(['ผอ. อนุมัติ',r.dirAt?thDT(r.dirAt):'',r.st==='approved'?'on':r.st==='rejected'?'no':r.st==='dir'?'wait':'']);
    if(r.back)S.push(['กลับถึงโรงเรียน',thDT(r.back),'on']);return S}
  if(r.st==='ext'||(r.dirNote||'').indexOf('ผลจากผู้มีอำนาจ')===0){S.push(['ผู้มีอำนาจพิจารณา แล้ว ผอ. บันทึกผล',r.dirAt?thDT(r.dirAt):'',r.st==='approved'?'on':r.st==='rejected'?'no':r.st==='ext'?'wait':''])}
  else{
    if(r.head!=='-')S.push(['หัวหน้างานบุคคลเห็นชอบ'+(r.headBy?' ('+r.headBy+')':''),r.headAt?thDT(r.headAt):'',r.head==='ok'?'on':r.head==='no'?'no':r.st==='head'?'wait':'']);
    S.push(['ผอ. อนุมัติ'+(r.dirBy?' ('+r.dirBy+')':''),r.dirAt?thDT(r.dirAt):'',r.st==='approved'?'on':r.st==='rejected'&&r.head!=='no'?'no':r.st==='dir'?'wait':''])}
  if(r.kind==='gov'&&r.st==='approved')S.push(['รายงานหลังอบรม',r.reportAt?thDT(r.reportAt):'',r.report?'on':'wait']);
  return S}
function stageView(r){const S=reqStages(r);const cur=S.findIndex(x=>x[2]==='wait');

function followLine(id){const u=id===me()&&!B.leaveAll?{n:B.myStats.leaveTimes,d:B.myStats.leaveDays}:((SEC.stats&&SEC.stats.leave[id])||{n:0,d:0});

/* ---------- สถานะบุคลากรวันนี้ (ไม่สรุปว่า "ขาดงาน" จากการไม่ลงเวลาเพียงอย่างเดียว) ---------- */
function staffState(id){
  const l=ONLEAVE[id];
  if(ATT[id]){const s=ATT_INFO[id].status;return{k:LATE.includes(s)?'late':'in',t:ATT[id],label:s,cls:ST_PILL[s]||'p-good'}}
  if(l&&l.status==='อนุมัติ')return{k:'leave',label:(l.type==='ไปราชการ'?'ไปราชการ':l.type)+(l.part&&l.part!=='เต็มวัน'?' ('+l.part+')':''),cls:'p-info'};

function paLegacyAvail(S){

    const o={self:(x.self||{})[m]||null,c3:(x.c3||{})[m]||null,stat:(x.stat||{})[m]||null};return(o.self||o.c3||o.stat)?o:null}catch(e){return null}

      ${!others.length?empty('ยังไม่มีข้อตกลงที่ส่งเข้ามาในปีงบประมาณ '+fy):''}`;

  const labels=ax.map((a,i)=>{const q=pt(i,128),an=q[0]<cx-10?'end':q[0]>cx+10?'start':'middle';

async function sigAction(v){

function lvRefresh(){
  const ty=lvSel(),r=lvRemain(ty),box=$('#lInfo');if(!ty||!box)return;
  const a=$('#l1').value,b=$('#l2').value,part=$('#lpart').hidden?'เต็มวัน':$('#l5').value;
  const nWork=workDays(a,b,part),nCal=(a&&b&&b>=a)?Math.round((d8(b)-d8(a))/864e5)+1:0,n=ty.cal?nCal:nWork;
  const big=r.ok&&r.num!=null?`<div class="lvbig"><b>${lvFmtN(r.num)}</b> <span class="sub">${esc(r.unit||'วัน')}</span></div>`:`<div class="lvbig"><b style="font-size:1.05rem;color:${r.ok?'var(--accent)':'var(--bad)'}">${esc(r.short||r.text)}</b></div>`;
  let raise='';
  if(ty.cnt)raise=lvRaiseHtml(lvRaise(n));else if(ty.block)raise=`<div class="callout c-bad"><b>${esc(LV_VAC_MSG)}</b></div>`;else raise=`<div class="callout c-good">ประเภทนี้ไม่นับรวมเกณฑ์ลาป่วย+ลากิจ ในการเลื่อนเงินเดือน</div>`;
  box.innerHTML=`<div><span class="sub">เหลือสิทธิ</span>${big}<span class="sub">${esc(ty.pay||'')} · ${ty.cal?'นับรวมวันหยุดราชการ':'นับเฉพาะวันทำการ'}</span></div>
   <div><b style="font-size:.9rem">เงื่อนไขสำคัญ</b><ul class="lvrules">${ty.rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${raise}`;
  // สรุปวันที่ + คำเตือนตามช่วงที่เลือก
  const out=[];
  if(a&&b&&b>=a){
    let back=a;do{const d=d8(back);d.setDate(d.getDate()+1);back=ymd(d)}while(workDays(back,back,'เต็มวัน')===0&&back<'2100');
    const left=r.ok&&r.num!=null&&ty.k!=='sick'?r.num-n:null;
    out.push(`<div class="calc"><b>ลา ${lvFmtN(n)} ${ty.cal?'วัน (นับรวมวันหยุด)':'วันทำการ'}</b> · สิ้นสุดการลา ${esc(lvFull(b))} · กลับมาปฏิบัติงาน ${esc(lvFull(back))}${left!=null&&left>=0?` · เหลือสิทธิหลังลา ${lvFmtN(left)} ${esc(ty.unit||'วัน')}`:''}</div>`);
    if(ty.cal&&nCal!==nWork)out.push(`<p class="sub">ระบบหลังบ้านบันทึกเป็นวันทำการ (${lvFmtN(nWork)} วัน) ส่วนระเบียบนับรวมวันหยุด (${nCal} วัน)</p>`);
    if(left!=null&&left<0)out.push(`<div class="callout c-bad"><b>เกินสิทธิ์ที่เหลืออยู่ ${lvFmtN(-left)} วัน</b>เหลือ ${lvFmtN(r.num)} วัน</div>`);
    if(ty.k==='sick'&&n>=ty.doc)out.push(`<div class="callout c-warn"><b>ลาป่วยตั้งแต่ 30 วันขึ้นไป ต้องแนบใบรับรองแพทย์</b></div>`);
    if(ty.lead){const gap=Math.round((d8(a)-d8(TODAY_ISO))/864e5);if(gap<ty.lead)out.push(`<div class="callout c-warn"><b>ควรยื่นล่วงหน้าไม่น้อยกว่า ${ty.lead} วัน</b>ตอนนี้ล่วงหน้า ${Math.max(0,gap)} วัน</div>`)}
  }
  let sum=$('#lSum');if(!sum){sum=document.createElement('div');sum.id='lSum';sum.className='lvbox';$('#lDays').after(sum)}
  sum.innerHTML=out.join('');
  // ปุ่มยื่นลา: ลาพักผ่อน / ประเภทที่หลังบ้านยังไม่รองรับ = สีเทากดไม่ได้
  const sb=$('#fLeave button[type=submit]'),why=ty.block?LV_VAC_MSG:(!lvSupported(ty)?'ประเภทนี้ยังยื่นผ่านระบบไม่ได้ (หลังบ้านยังไม่รองรับ) · ใช้ Export PDF ส่งใบลาแทน':'');
  if(sb){sb.disabled=!!why;sb.classList.toggle('lvgrey',!!why);sb.title=why;sb.textContent=why?'ยื่นใบลาไม่ได้':'ตรวจแล้ว ยื่นใบลา';
    let nt=$('#lBlock');if(why){if(!nt){nt=document.createElement('p');nt.id='lBlock';nt.className='note';sb.parentNode.after(nt)}nt.textContent=why}else if(nt)nt.remove()}
}
function lvSigBlank(){const c=$('#lSig');if(!c)return true;const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i])return false;return true}
function lvBind(){
  if(!$('#lt'))return;
  ['#lt','#l1','#l2','#l5'].forEach(s=>{const el=$(s);if(el)el.addEventListener('change',lvRefresh)});
  const c=$('#lSig');
  if(c&&!c._ok){c._ok=true;const g=c.getContext('2d');g.lineWidth=3.5;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1B1F3B';let dr=false;
    const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.addEventListener('pointerdown',e=>{dr=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke();e.preventDefault()});
    c.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=pos(e);g.lineTo(x,y);g.stroke()});
    ['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>{dr=false}))}
  lvRefresh();
}

function workFilterList(list,f){const d=t=>dayDiff(t.due);return f==='open'?list.filter(t=>t.st!=='done'):f==='late'?list.filter(t=>['todo','doing','fix'].includes(t.st)&&d(t)<0):f==='soon'?list.filter(t=>['todo','doing','fix'].includes(t.st)&&d(t)>=0&&d(t)<=3):f==='sent'?list.filter(t=>t.st==='sent'):f==='fix'?list.filter(t=>t.st==='fix'):f==='done'?list.filter(t=>t.st==='done'):list}
function workFilters(list){const c=f=>workFilterList(list,f).length;return seg('wf',[['open','ยังไม่เสร็จ',c('open')],['late','เลยกำหนด',c('late')],['soon','ใน 3 วัน',c('soon')],['sent','รอตรวจ',c('sent')],['done','เสร็จสิ้น',c('done')],['all','ทั้งหมด',list.length]],st.wf)}
const sortTasks=l=>l.slice().sort((a,b)=>(a.st==='fix'?-1:0)-(b.st==='fix'?-1:0)||(['done','sent'].includes(a.st))-(['done','sent'].includes(b.st))||dayDiff(a.due)-dayDiff(b.due));

function emgView(){

  if(!EMG.on){
    if(isDir){const d=st.emgDraft;const types=d.mode?B.emgTypes[d.mode]:[];
      return`<section class="panel"><div class="ph"><h2>เริ่มเหตุฉุกเฉิน / การซ้อม</h2></div>
       <div class="fld"><span class="lbl">1. เป็นการซ้อมหรือเหตุจริง</span><div class="modepick"><button class="mp ${d.mode==='drill'?'on':''}" data-emgmode="drill"><b>ซ้อม</b><small>แถบสีส้ม · มีคำว่า "การซ้อม"</small></button><button class="mp real ${d.mode==='real'?'on':''}" data-emgmode="real"><b>เหตุจริง</b><small>แถบสีแดง</small></button></div></div>
       ${d.mode?`<div class="fld"><span class="lbl">2. ประเภทเหตุ</span><div class="opts">${types.map(x=>`<label><input type="radio" name="et" value="${esc(x)}" ${d.type===x?'checked':''}>${esc(x)}</label>`).join('')}</div></div>
       <div class="fld"><label for="ep">3. จุดรวมพล</label><select id="ep"><option value="">เลือกจุดรวมพล</option>${(EMG.points||[]).map(p=>`<option ${d.point===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
       <button class="btn big wide ${d.mode==='real'?'red':'warnb'}" data-emg="confirm">ตรวจแล้ว ${d.mode==='real'?'แจ้งเหตุจริง':'เริ่มการซ้อม'}…</button>`:''}
       ${chan}</section>${secBox('admin',A=>emgHist(A.emgHist))}`}
    return`<section class="panel"><h2>ยังไม่มีเหตุฉุกเฉิน</h2><p class="sub">เมื่อ ผอ. แจ้งเหตุหรือเริ่มการซ้อม หน้านี้จะให้ท่านรายงานยอดนักเรียน${mine.length?' ห้อง '+esc(mine.map(r=>r.grade).join(', ')):''} และขึ้นแถบเด่นบนหน้าหลัก</p>${chan}</section>`;
  }
  const reps=CLASSES.map(([c,t,n,room])=>({c,t,n,room,r:EMG.rep[room]}));
  const here=reps.reduce((a,x)=>a+(x.r?x.r.present:0),0),miss=reps.reduce((a,x)=>a+(x.r?x.r.total-x.r.present:0),0),wait=reps.filter(x=>!x.r);
  const board=`<section class="panel"><div class="ph"><h2>ยอดนักเรียนรายห้อง</h2><span class="num">รายงานแล้ว ${reps.filter(x=>x.r).length}/${CLASSES.length} ห้อง${EMG.last?' · ล่าสุด '+esc(EMG.last)+' น.':''}</span></div>
   <div class="kv"><div><span>อยู่ที่จุดรวมพล (ตามที่รายงาน)</span><b class="num good">${here} คน</b></div><div><span>รายงานว่ายังไม่พบ</span><b class="num ${miss?'bad':''}">${miss} คน</b></div><div><span>ยังไม่ทราบสถานะ</span><b class="num ${wait.length?'warn':''}">${wait.length} ห้อง${wait.reduce((a,x)=>a+x.n,0)?' · '+wait.reduce((a,x)=>a+x.n,0)+' คน':''}</b><small>ยังไม่รายงาน ≠ ปลอดภัยครบ</small></div></div>
   <div class="board">${reps.map(x=>`<div class="cls ${!x.r?'wait':x.r.present<x.r.total?'miss':'ok'}"><b>${esc(x.c)}</b><span class="n">${x.r?x.r.present+'/'+x.r.total:'ยังไม่รายงาน'}</span><span class="sub">${x.r?esc(nm(x.r.by))+' · '+esc(x.r.time)+' น.':'ครู '+esc(nm(x.t))}</span>${x.r&&x.r.missing?`<span class="bad small">ไม่พบ: ${esc(x.r.missing)}</span>`:''}${x.r&&x.r.injured?`<span class="bad small">บาดเจ็บ ${x.r.injured} คน</span>`:''}</div>`).join('')}</div></section>`;
  const head=`<div class="alertband ${EMG.mode==='drill'?'drill':''}"><span class="mode">${EMG.mode==='drill'?'การซ้อม':'เหตุจริง'}</span><b>${esc(EMG.type)} · เริ่ม ${esc(EMG.start)} น.${EMG.point?' · '+esc(EMG.point):''}</b><span>โดย ${esc(EMG.by||'ผอ.')}</span>${isDir?`<div class="row"><button class="btn" data-emg="end">${EMG.mode==='drill'?'จบการซ้อม':'ยุติเหตุ'}</button><button class="btn" data-copyemg="1">คัดลอกข้อความแจ้งไลน์กลุ่ม</button></div>`:''}</div>${chan}`;

    return`<section class="panel"><div class="ph"><h2>รายงานยอดนักเรียน ${esc(rm.grade)}</h2><p>${tot?'ทั้งหมด '+tot+' คน':'ยังไม่มีรายชื่อนักเรียนในระบบ'}</p></div>
